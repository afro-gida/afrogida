        function unpaintCartSummary() {
          var c = document.querySelectorAll('[data-afro-cartsum]');
          for (var i = 0; i < c.length; i++) c[i].removeAttribute('data-afro-cartsum');
        }

        // REQ5: ALT KATEGORİ çiplerini (ikinci kategori satırı) YEŞİL yap. İki
        // kategori satırından ALTTAKİ (main satırın hemen altındaki) satır alt
        // kategoridir; onu işaretle. Ürün rozetleri (aşağıda) hariç tutulur.
        function isOrangeStr(str) {
          var m = str.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
          if (!m) return false;
          var R = +m[1], G = +m[2], B = +m[3];
          return R > 225 && G >= 110 && G <= 170 && B < 100;
        }
        function paintSubCatGreen() {
          // Renkten BAĞIMSIZ satır-gruplama: kategori alanındaki tüm ÇİP
          // şeklindeki (yuvarlak, düz metin) elemanları topla. En üstteki grup
          // = ANA kategori satırı; hemen altındaki grup = ALT kategori satırı.
          // Alt satırdaki TURUNCU çipleri yeşile boya. Koyu temada ana satırın
          // aktif çipi yeşil olduğu için renge göre ayırmak güvenilmez; konum
          // (satır sırası) kullanılır.
          // ÖNCE eski etiketleri temizle: kaydırmada React düğümleri geri
          // dönüştürünce eski "subcat" etiketi yanlış eleman üstünde takılı
          // kalıp KISA YEŞİL PARLAMAYA yol açıyordu. Her boyamada sıfırla.
          unpaintSubCatGreen();
          var divs = document.body.querySelectorAll('div');
          var cands = [];
          for (var i = 0; i < divs.length; i++) {
            var e = divs[i];
            if (e.offsetParent === null) continue; // gizli/display:none ağaçlar
            var cs = getComputedStyle(e);
            if (cs.visibility === 'hidden' || cs.opacity === '0') continue;
            var br = parseFloat(cs.borderTopLeftRadius) || 0;
            if (br < 40) continue; // yuvarlak pill değilse atla
            var r = e.getBoundingClientRect();
            if (r.top < 60 || r.top > 320) continue;
            if (r.height < 16 || r.height > 40) continue;
            if (r.width < 34 || r.width > 220) continue;
            // Metni al: bilgi kutucukları / gün rozetleri / "İNDİRİMLİ" bir
            // İKON glyph ile BAŞLAR (char code >= 0xE000). Gerçek kategori
            // çipleri düz metindir (Domates, Biber...). Bunları ele.
            var txt = (e.textContent || '').replace(/^\s+/, '');
            if (txt) {
              var c0 = txt.charCodeAt(0);
              if (c0 >= 0xE000) continue; // ikon glyph ile başlıyor -> bilgi/rozet
            }
            if (txt.indexOf('Göster') !== -1) continue; // "Ürünleri Göster" butonu
            var bgOrange = isOrangeStr(cs.backgroundColor);
            var bordOrange = isOrangeStr(cs.borderTopColor);
            cands.push({ el: e, top: Math.round(r.top), orange: (bgOrange || bordOrange), active: bgOrange });
          }
          if (cands.length < 2) return;
          // Satırlara göre grupla (15px tolerans), üstten alta sırala.
          cands.sort(function (a, b) { return a.top - b.top; });
          var groups = [];
          for (var g = 0; g < cands.length; g++) {
            var placed = false;
            for (var h = 0; h < groups.length; h++) {
              if (Math.abs(groups[h].top - cands[g].top) <= 15) { groups[h].items.push(cands[g]); placed = true; break; }
            }
            if (!placed) groups.push({ top: cands[g].top, items: [cands[g]] });
          }
          groups.sort(function (a, b) { return a.top - b.top; });
          if (groups.length < 2) return; // alt kategori satırı yok
          // İkinci grup = ALT kategori satırı. Turuncu olanları yeşile boya.
          var sub = groups[1].items;
          for (var s = 0; s < sub.length; s++) {
            if (!sub[s].orange) continue;
            sub[s].el.setAttribute('data-afro-subcat', sub[s].active ? 'active' : '1');
          }
        }
        function unpaintSubCatGreen() {
          var c = document.querySelectorAll('[data-afro-subcat]');
          for (var i = 0; i < c.length; i++) c[i].removeAttribute('data-afro-subcat');
        }

        // KULLANICI İSTEĞİ: alt kategori çip ŞERİDİ, native dikey padding
        // (üst 0 / alt 8px) yüzünden çip ŞERİDİN ÜSTÜNE YAPIŞIK duruyordu.
        // Çiplerin buzlu-cam şerit atasını işaretle -> CSS dengeli 5/5 padding
        // ile çipi dikeyde ortalar. Sadece ANA + ALT olmak üzere >=2 çip satırı
        // varken (yani gerçek bir alt kategori şeridi mevcutken) uygulanır;
        // aksi halde tek satırlı ana kategori şeridine dokunmayız.
        function padSubCatStrip() {
          unpadSubCatStrip();
          var divs = document.body.querySelectorAll('div');
          var cands = [];
          for (var i = 0; i < divs.length; i++) {
            var e = divs[i];
            if (e.offsetParent === null) continue;
            var cs = getComputedStyle(e);
            if ((parseFloat(cs.borderTopLeftRadius) || 0) < 40) continue; // pill değil
            var r = e.getBoundingClientRect();
            if (r.top < 120 || r.top > 320) continue; // kategori bölgesi
            if (r.height < 16 || r.height > 40) continue;
            if (r.width < 34 || r.width > 240) continue;
            var txt = (e.textContent || '').replace(/^\s+/, '');
            if (txt && txt.charCodeAt(0) >= 0xE000) continue; // ikon glyph -> bilgi/rozet
            if (txt.indexOf('Göster') !== -1) continue;
            cands.push({ el: e, top: Math.round(r.top) });
          }
          if (cands.length < 2) return;
          // Satırlara ayır (15px tolerans); >=2 satır yoksa alt kategori yok.
          var rows = [];
          for (var g = 0; g < cands.length; g++) {
            var placed = false;
            for (var h = 0; h < rows.length; h++) {
              if (Math.abs(rows[h].top - cands[g].top) <= 15) { rows[h].items.push(cands[g]); placed = true; break; }
            }
            if (!placed) rows.push({ top: cands[g].top, items: [cands[g]] });
          }
          if (rows.length < 2) return;
          rows.sort(function (a, b) { return a.top - b.top; });
          var sub = rows[rows.length - 1].items; // en alttaki satır = alt kategori
          for (var p = 0; p < sub.length; p++) {
            var n = sub[p].el;
            for (var k = 0; k < 6 && n; k++) {
              var ncs = getComputedStyle(n);
              var m = ncs.backgroundColor.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/);
              var a = m ? (m[4] === undefined ? 1 : +m[4]) : 0;
              var nr = n.getBoundingClientRect();
              // Dolu-genişlikteki buzlu-cam şerit (yarı saydam zemin)
              if (a > 0.05 && nr.width > 240) {
                if (n.getAttribute('data-afro-substrip') !== '1')
                  n.setAttribute('data-afro-substrip', '1');
                break;
              }
              n = n.parentElement;
            }
          }
        }
        function unpadSubCatStrip() {
          var c = document.querySelectorAll('[data-afro-substrip]');
          for (var i = 0; i < c.length; i++) c[i].removeAttribute('data-afro-substrip');
        }

        // KULLANICI İSTEĞİ: kategori çiplerinin (ana + alt) SEÇİLİ OLMAYAN
        // beyaz/soluk/buzlu dolgusunu KALDIR; içinden duvar kağıdı görünsün.
        // Sadece dolgu şeffaflaşır (turuncu/yeşil KENAR ve YAZI korunur).
        // Seçili (dolu turuncu ya da dolu yeşil) çiplere DOKUNMAZ.
        function clearCatChipFill() {
          unpaintCatChipFill(); // flicker önleme: eski işaretleri temizle
          var CATS = { 'İNDİRİMLİ': 1, 'Sebze': 1, 'Meyve': 1, 'Yeşillik': 1,
                       'Zeytin Ürünleri': 1, 'Domates': 1, 'Kabak': 1,
                       'Patlıcan': 1, 'Biber': 1, 'Diğer': 1 };
          var divs = document.body.querySelectorAll('div');
          for (var i = 0; i < divs.length; i++) {
            var e = divs[i];
            var raw = (e.innerText || '').replace(/\s+/g, ' ').trim();
            if (!raw || raw.length > 22) continue;
            // ikon glyph'lerini at, saf kategori metnini bırak
            var txt = raw.replace(/[\uE000-\uF8FF]/g, '').trim();
            if (!CATS.hasOwnProperty(txt)) continue;
            var r = e.getBoundingClientRect();
            if (r.height < 20 || r.height > 46 || r.width < 40 || r.width > 240) continue;
            // Seçili (dolu turuncu ya da dolu yeşil) çip mi? -> dokunma
            var cs = getComputedStyle(e);
            var m = cs.backgroundColor.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/);
            if (m) {
              var R = +m[1], G = +m[2], B = +m[3], a = (m[4] === undefined ? 1 : +m[4]);
              var isOrangeFill = (a > 0.55 && R > 220 && G >= 100 && G <= 185 && B < 120);
              var isGreenFill  = (a > 0.55 && R < 70 && G > 140 && B >= 90 && B <= 170);
              if (isOrangeFill || isGreenFill) continue; // seçili çip, dolu kalsın
            }
            // Pasif çip: buzlu-cam işaretini kaldır + dolguyu şeffaflaştır
            if (e.getAttribute(GLASS_ATTR) === '1') e.removeAttribute(GLASS_ATTR);
            if (e.getAttribute('data-afro-catchip-clear') !== '1')
              e.setAttribute('data-afro-catchip-clear', '1');
          }
        }
        function unpaintCatChipFill() {
          var c = document.querySelectorAll('[data-afro-catchip-clear]');
          for (var i = 0; i < c.length; i++) c[i].removeAttribute('data-afro-catchip-clear');
        }

        function unpaint() {
          var marked = document.querySelectorAll('[' + WP_ATTR + ']');
          for (var i = 0; i < marked.length; i++) marked[i].removeAttribute(WP_ATTR);
          var g = document.querySelectorAll('[' + GLASS_ATTR + ']');
          for (var j = 0; j < g.length; j++) g[j].removeAttribute(GLASS_ATTR);
          var o = document.querySelectorAll('[data-afro-orange]');
          for (var k = 0; k < o.length; k++) o[k].removeAttribute('data-afro-orange');
          unpaintGreenTexts();
          unpaintNavGlass();
          unpaintNavDark();
          unpaintCartOutline();
          unpaintCartFrost();
          unpaintNavPill();
          unpaintNavIcons();
          unpaintCartBar();
          unpaintInfoChips();
          unwireScrollTop();
          unpaintGlassCards();
          unpaintHeaderPanel();
              hideProductsBackBtn();
          unpaintMgrCard();
          unpaintCartSummary();
          unpaintSubCatGreen();
          unpadSubCatStrip();
          unpaintCatChipFill();
          unpaintSectionBands();
        }

        function unpaintGlassOnly() {
          var g = document.querySelectorAll('[' + GLASS_ATTR + ']');
          for (var j = 0; j < g.length; j++) g[j].removeAttribute(GLASS_ATTR);
          unpaintNavGlass();
          unpaintNavDark();
        }

        var ORANGE_ATTR = 'data-afro-orange';
        // Açık modda DOLU YEŞİL arka planlı elemanları (marka yeşili
        // rgb(20,182,126) ve yakın tonları) TURUNCU yap. Buna dahil:
        //  - küçük yeşil butonlar ("Ekle", "Pazardan Gel-Al" vb.)
        //  - üstteki yeşil "Yönetici Görünümü" bandı (köşesiz, geniş)
        //  - profildeki büyük yeşil isim/başlık kartı
        //  - alt menüdeki aktif yeşil pill (varsa)
        //  - PAZAR KARTI "Siparişe Başla" butonları (flicker düzeltmesi)
        // Beyaz yazılar turuncu üstünde okunur kaldığı için sorun olmaz.
        // Soluk yeşiller (rgb(204,230,209)) buraya GİRMEZ; onlar buzlu cam olur.
        function paintOrangeButtons() {
          var root = document.body; // modallar dahil (bkz. paintGlassLayers notu)
          if (!root) return;
          var vw = window.innerWidth, vh = window.innerHeight;
          var nodes = root.querySelectorAll('*');
          for (var i = 0; i < nodes.length; i++) {
            var el = nodes[i];
            if (el.getAttribute(ORANGE_ATTR) === '1') continue;
            var cs = getComputedStyle(el);
            var m = (cs.backgroundColor || '').match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/);
            if (!m) continue;
            var rr = +m[1], gg = +m[2], bb = +m[3], a = (m[4] === undefined ? 1 : +m[4]);
            if (a < 0.5) continue; // yarı saydam -> atla (dolu yeşiller hedef)
            // DOLU marka yeşili ve yakın tonları (soluk yeşiller HARİÇ)
            var isBrandGreen = (rr <= 90 && gg >= 130 && gg <= 220 && bb >= 70 && bb <= 180 && gg > rr + 50 && gg > bb + 15);
            if (!isBrandGreen) continue;
            var r = el.getBoundingClientRect();
            if (r.width < 20 || r.height < 16) continue; // çok küçük -> atla
            // Tam ekranı kaplayan bir katman OLMAMALI (güvenlik)
            if (r.width >= vw * 0.97 && r.height >= vh * 0.8) continue;
            el.setAttribute(ORANGE_ATTR, '1');
          }
          // FLICKER DÜZELTMESİ: Pazar kartı "Siparişe Başla" butonları React
          // render döngüsünde backgroundColor: theme.primary ile render ediliyor
          // ama statik CSS kuralları onları yakalamıyor. Metin bazlı tespit yapıp
          // işaretleyerek her durumda turuncu kalmasını sağlarız.
          var isMarketPage = (location.pathname === '/' || location.pathname.indexOf('/markets') > -1);
          if (isMarketPage) {
            var divs = root.querySelectorAll('div');
            for (var j = 0; j < divs.length; j++) {
              var btn = divs[j];
              if (btn.getAttribute(ORANGE_ATTR) === '1') continue;
              var txt = (btn.innerText || '').trim();
              // "Siparişe Başla" veya "Sipariş Başla" (typo toleransı)
              if (txt.indexOf('Sipari') === -1 || txt.indexOf('Ba') === -1) continue;
              if (txt.length > 25) continue; // sadece buton metni, açıklama değil
              var rb = btn.getBoundingClientRect();
              // Buton boyutu: genişlik 90-400, yükseklik 30-80
              if (rb.width < 90 || rb.width > 400 || rb.height < 30 || rb.height > 80) continue;
              // ÖNEMLİ FLICKER DÜZELTMESİ: Buton enabled iken yeşil (#14B67E),
              // fakat market verisi yeniden yüklenirken KISA süre disabled
              // duruma geçip SOLUK YEŞİL (accentSurface #CCE6D1 = rgb(204,230,209))
              // oluyor -> beyaz gibi görünüyor. Rengine göre koşul koymak yerine
              // GÖRÜNÜR DOLGUSU olan (şeffaf olmayan) buton kutusunu -yeşil, soluk
              // yeşil, beyaz, turuncu fark etmeksizin- turuncu işaretle. İç yazı
              // sarmalayıcısı (şeffaf zemin) elenir; yalnızca dolu buton kutusu geçer.
              var cBtn = getComputedStyle(btn);
              var mbtn = (cBtn.backgroundColor || '').match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/);
              if (!mbtn) continue;
              var ba = (mbtn[4] === undefined ? 1 : +mbtn[4]);
              // Görünür (şeffaf olmayan) dolgusu olan kutu = asıl buton.
              if (ba < 0.5) continue;
              btn.setAttribute(ORANGE_ATTR, '1');
            }
          }
        }

        function unpaintOrange() {
          var o = document.querySelectorAll('[' + ORANGE_ATTR + ']');
          for (var k = 0; k < o.length; k++) o[k].removeAttribute(ORANGE_ATTR);
        }

        // Açık modda TÜM YEŞİL yazıları/kenarlıkları/SVG'leri turuncu yap.
        function paintGreenTextsOrange() {
          var root = document.body; // modallar dahil (bkz. paintGlassLayers notu)
          if (!root) return;
          var nodes = root.querySelectorAll('*');
          for (var i = 0; i < nodes.length; i++) {
            var el = nodes[i];
            var r = el.getBoundingClientRect();
            if (r.width < 5 || r.height < 5) continue; // görünmez (offsetParent yerine boyut kontrolü)
            // NOT: alt menü (bottom nav) artık İSTİSNA DEĞİL — aktif yeşil ikon
            // ve etiketi de turuncu olsun (kullanıcı isteği). Pasif gri ikonlar
            // yeşil olmadığı için etkilenmez.
            var cs = getComputedStyle(el);
            
            // YAZI RENGİ (color)
            if (!el.getAttribute('data-afro-green-text')) {
              var col = cs.color;
              var mc = col && col.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
              if (mc) {
                var cr = +mc[1], cg = +mc[2], cb = +mc[3];
                // Yeşil: g > r+20 && g > b+20 && g >= 80 (koyu+açık yeşiller)
                if (cg > cr + 20 && cg > cb + 20 && cg >= 80) {
                  el.setAttribute('data-afro-green-text', '1');
                }
              }
            }
            
            // KENARLIK (border-color)
            if (!el.getAttribute('data-afro-green-border')) {
              var bord = cs.borderTopColor || cs.borderColor;
              var mb = bord && bord.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
              if (mb) {
                var br = +mb[1], bg = +mb[2], bb = +mb[3];
                if (bg > br + 20 && bg > bb + 20 && bg >= 80) {
                  el.setAttribute('data-afro-green-border', '1');
                }
              }
            }
            
            // SVG FILL (fill)
            if (!el.getAttribute('data-afro-green-fill') && (el.tagName === 'svg' || el.tagName === 'path' || el.tagName === 'circle')) {
              var fill = cs.fill;
              var mf = fill && fill.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
              if (mf) {
                var fr = +mf[1], fg = +mf[2], fb = +mf[3];
                if (fg > fr + 20 && fg > fb + 20 && fg >= 80) {
                  el.setAttribute('data-afro-green-fill', '1');
                }
              }
            }
          }
        }

        function unpaintGreenTexts() {
          var attrs = ['data-afro-green-text', 'data-afro-green-border', 'data-afro-green-fill'];
          for (var j = 0; j < attrs.length; j++) {
            var marked = document.querySelectorAll('[' + attrs[j] + ']');
            for (var i = 0; i < marked.length; i++) marked[i].removeAttribute(attrs[j]);
          }
        }

        // KOYU TEMA: uygulamanın kendi TURUNCU rengini (rgb(251,140,60)) kullanan
        // elemanları parlak yeşile çevir. Turuncu tolerans aralığında bg/border/color
        // olan elemanlara data-afro-d2g işareti koyar (CSS onları yeşile boyar).
        function isAppOrange(str) {
          var m = (str || '').match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/);
          if (!m) return false;
          var r = +m[1], g = +m[2], b = +m[3], a = (m[4] === undefined ? 1 : +m[4]);
          if (a < 0.35) return false;
          return r >= 235 && r <= 255 && g >= 118 && g <= 162 && b >= 42 && b <= 82;
        }
        function fixDarkOrangeToGreen() {
          var root = document.body; if (!root) return;
          // FLICKER DÜZELTMESİ (kupon kartı vb.): Bir eleman d2g ile yeşile
          // boyanınca getComputedStyle YEŞİL döner -> isAppOrange(false) ->
          // işaret kalkar -> tekrar turuncu -> tekrar yeşil... sonsuz TİTREME.
          // Çözüm (paintCartOutline ile aynı desen): her taramada önce TÜM d2g
          // işaretlerini KALDIR. Böylece override kalkar ve getComputedStyle
          // uygulamanın GERÇEK rengini (turuncu) döndürür; sadece gerçekten
          // turuncu olanlar yeniden işaretlenir. Tümü senkron tek geçişte olur,
          // ekranda ara turuncu kare (paint) görünmez -> titreme tamamen biter.
          // Bu yöntem, turuncu inline style ile de atomik class ile de gelse çalışır.
          unfixDarkOrange();
          var nodes = root.querySelectorAll('*');
          for (var i = 0; i < nodes.length; i++) {
            var el = nodes[i];
            var cs = getComputedStyle(el);
            var toks = [];
            if (isAppOrange(cs.backgroundColor)) toks.push('bg');
            var bw = parseFloat(cs.borderTopWidth) || 0;
            if (bw > 0 && isAppOrange(cs.borderTopColor)) toks.push('border');
            if (isAppOrange(cs.color)) toks.push('text');
            if (toks.length) {
              var v = toks.join(' ');
              if (el.getAttribute('data-afro-d2g') !== v) el.setAttribute('data-afro-d2g', v);
            } else if (el.getAttribute('data-afro-d2g')) {
              el.removeAttribute('data-afro-d2g');
            }
          }
        }
        function unfixDarkOrange() {
          var m = document.querySelectorAll('[data-afro-d2g]');
          for (var i = 0; i < m.length; i++) m[i].removeAttribute('data-afro-d2g');
        }

        // Harita seçici (map-picker.html) AYNI KÖKENLİ bir <iframe> içinde çalışır
        // ve "Bu Konumu Onayla" butonu (#confirm-btn) yeşildir (#22C55E). Ana
        // belgedeki stiller iframe'e uygulanmadığı için, aynı köken avantajıyla
        // iframe'in kendi <head>'ine küçük bir stil enjekte edip AÇIK modda
        // butonu turuncu yaparız. KOYU modda enjekte edilen stili kaldırırız.
        function paintMapIframe(makeOrange) {
          try {
            var ifr = document.querySelectorAll('iframe');
            for (var i = 0; i < ifr.length; i++) {
              var f = ifr[i];
              var src = f.getAttribute('src') || '';
              if (src.indexOf('map-picker') === -1) continue;
              var doc = null;
              try { doc = f.contentDocument; } catch (e) { doc = null; }
              if (!doc || !doc.head) continue;
              var st = doc.getElementById('afro-iframe-style');
              if (makeOrange) {
                if (!st) {
                  st = doc.createElement('style');
                  st.id = 'afro-iframe-style';
                  st.textContent = '#confirm-btn{background:rgb(251,140,60) !important;}';
                  doc.head.appendChild(st);
                }
              } else {
                if (st && st.parentNode) st.parentNode.removeChild(st);
              }
            }
          } catch (e) { /* sessizce geç */ }
        }

        // ============================================================
        // ADMIN: "Tedarikçi Yetkilendir" penceresi geliştirmesi
        // Uygulama derlenmiş (kaynak yok); bu ekranda (a) atanmış
        // tedarikçileri İSİM + TELEFON ile listeleyen ve (b) her birinde
        // "Kaldır" butonu olan bir bölümü DOM'a enjekte ederiz.

        function afroAdminToken() {
          try {
            var raw = localStorage.getItem('pazar_session_token');
            if (!raw) return '';
            try { var v = JSON.parse(raw); return (typeof v === 'string') ? v : String(v || ''); }
            catch (e) { return raw; }
          } catch (e) { return ''; }
        }
        function afroApi(path, opts) {
          opts = opts || {};
          var h = { 'Content-Type': 'application/json' };
          var tk = afroAdminToken();
          if (tk) h['Authorization'] = 'Bearer ' + tk;
          return fetch('https://afrogida.com.tr/api' + path, {
            method: opts.method || 'GET',
            headers: h,
            body: opts.body ? JSON.stringify(opts.body) : undefined
          }).then(function (r) {
            return r.text().then(function (t) {
              var j = null; try { j = t ? JSON.parse(t) : null; } catch (e) { j = null; }
              if (!r.ok) { throw new Error((j && j.detail) || ('Hata ' + r.status)); }
              return j;
            });

        }

        // ============================================================
        // DOM tabanlı onay/uyarı/giriş diyalogları.

        function afroDialog(opts) {
          opts = opts || {};
          var ov = document.createElement('div');
          ov.style.cssText = 'position:fixed;inset:0;z-index:2147483200;background:rgba(1,15,9,0.72);display:flex;align-items:center;justify-content:center;padding:20px;font-family:Arial,sans-serif;';
          var box = document.createElement('div');

          var msg = document.createElement('div');
          msg.style.cssText = 'color:#eafff4;font-size:15px;line-height:1.5;margin-bottom:16px;white-space:pre-wrap;';
          msg.textContent = opts.message || '';
          box.appendChild(msg);
          var inp = null;
          if (opts.prompt) {
            inp = document.createElement('input');
            inp.value = opts.defaultValue || '';
            inp.style.cssText = 'width:100%;box-sizing:border-box;padding:11px 12px;border-radius:9px;border:1px solid #1b7d59;background:#04231a;color:#eafff4;font-size:14px;margin-bottom:16px;';
            box.appendChild(inp);
          }
          var btnRow = document.createElement('div');
          btnRow.style.cssText = 'display:flex;gap:10px;justify-content:flex-end;';
          function close() { if (ov.parentNode) ov.parentNode.removeChild(ov); }
          if (opts.showCancel !== false) {

            cancel.textContent = opts.cancelText || 'İptal';
            cancel.style.cssText = 'background:#10291e;color:#cdeee0;border:0;border-radius:10px;padding:11px 18px;font-weight:800;font-size:14px;cursor:pointer;';
            cancel.onclick = function () { close(); if (typeof opts.onCancel === 'function') opts.onCancel(); };
            btnRow.appendChild(cancel);
          }
          var ok = document.createElement('button');
          ok.textContent = opts.okText || 'Tamam';
          ok.style.cssText = 'background:' + (opts.danger ? '#e5484d' : '#059669') + ';color:#fff;border:0;border-radius:10px;padding:11px 18px;font-weight:900;font-size:14px;cursor:pointer;';
          ok.onclick = function () { var v = inp ? inp.value : true; close(); if (typeof opts.onOk === 'function') opts.onOk(v); };
          btnRow.appendChild(ok);
          box.appendChild(btnRow);
          ov.appendChild(box);
          ov.onclick = function (e) { if (e.target === ov) { close(); if (typeof opts.onCancel === 'function') opts.onCancel(); } };
          document.body.appendChild(ov);
          if (inp) { try { inp.focus(); } catch (x) {} }
        }
        function afroConfirm(message, onOk, o) {
          o = o || {};
          afroDialog({ message: message, onOk: function () { onOk && onOk(); }, onCancel: o.onCancel, okText: o.okText || 'Evet', cancelText: o.cancelText || 'İptal', danger: o.danger });
        }
        function afroAlert(message, onOk) {

        // Para biçimlendir (₺)
        function afroFmtTL(n) {

        }
        // Adres string'inden koordinat veya arama sorgusu çıkar.
        function _afroMapUrl(o) {
          var addressText = o.address || '';
          var m = addressText.match(/https?:\/\/(?:(?:www\.|maps\.)?google\.com)\/maps[^?\s]*\?[^&\s]*q=([\-0-9.]+),([\-0-9.]+)/);
          if (m) return 'geo:' + m[1] + ',' + m[2] + '?q=' + m[1] + ',' + m[2];
          var hood = (o.delivery_neighborhood ? o.delivery_neighborhood + ' ' : '');
          var plain = (hood + addressText).replace(/\nKonum:.*$/g, '').trim();
          return 'geo:0,0?q=' + encodeURIComponent(plain || addressText);
        }
        // Harita aç — APK'da geo: (intercepted → native harita), browser'da yeni sekmede Google Maps.
        // Her iki durumda da çalışır: koordinatlı (pin) veya koordinatsız (arama).
        function _afroOpenMap(o) {
          var addressText = o.address || '';
          var mCoord = addressText.match(/https?:\/\/(?:(?:www\.|maps\.)?google\.com)\/maps[^?\s]*\?[^&\s]*q=([\-0-9.]+),([\-0-9.]+)/);
          var hood = (o.delivery_neighborhood ? o.delivery_neighborhood + ' ' : '');
          var plain = (hood + addressText).replace(/\nKonum:.*$/g, '').trim();
          var q = plain || addressText;
          var isApp = (navigator.userAgent || '').indexOf('AfroGidaApp') > -1;
          if (isApp) {
            // APK: geo: scheme → onShouldStartLoadWithRequest intercepts → Linking.openURL → native harita/Maps
            var geoUrl = mCoord
              ? ('geo:' + mCoord[1] + ',' + mCoord[2] + '?q=' + mCoord[1] + ',' + mCoord[2])
              : ('geo:0,0?q=' + encodeURIComponent(q));
            window.location.href = geoUrl;
          } else {
            // Desktop/browser: Google Maps web (yeni sekme)
            var webUrl = mCoord
              ? ('https://www.google.com/maps?q=' + mCoord[1] + ',' + mCoord[2])
              : ('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q));
            window.open(webUrl, '_blank');
          }
        }

        // ============================================================

            if (!iso) return '';
            var s = String(iso);
            if (s.length >= 10 && s.charAt(4) === '-' && s.charAt(7) === '-') return s.slice(0, 10);
            try { var d = new Date(iso); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
            catch (x) { return ''; }
          }

              return d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric', weekday: 'long' });
            } catch (x) { return key; }

          afroApi('/admin/all-supplier-sales')

              filterBar.appendChild(lbl); filterBar.appendChild(dateInput); filterBar.appendChild(allBtn);
              body.appendChild(filterBar);

              // ---- Genel özet + liste konteynerleri ----

              // Bir sipariş kartı (tedarikçi + ürün tablosu)
              function buildOrderCard(e) {

                try { dstr = new Date(e.date).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }); } catch (x) { dstr = ''; }

                oc.appendChild(oh);
                var tbl = document.createElement('table');

                  '<th style="text-align:right;color:#9ccbb8;border-bottom:1px solid #154b36;padding:6px 4px;">Miktar</th>' +
                  '<th style="text-align:right;color:#9ccbb8;border-bottom:1px solid #154b36;padding:6px 4px;">Birim Fiyat</th>' +
                  '<th style="text-align:right;color:#9ccbb8;border-bottom:1px solid #154b36;padding:6px 4px;">Tutar</th>' +
                  '</tr></thead>';
                var tbody = '<tbody>';
                (e.items || []).forEach(function (it) {
                  var qtyStr = (Number(it.qty) || 0).toLocaleString('tr-TR') + (it.unit ? ' ' + it.unit : '');
                  var isRefunded = !!(it && it.refunded);
                  var nameColor = isRefunded ? '#f87171' : '#e6f5ee';
                  var dataColor = isRefunded ? '#f87171' : '#cdeee0';
                  var totalColor = isRefunded ? '#f87171' : '#e6f5ee';
                  var refLabel = isRefunded ? ' <span style="color:#f87171;font-weight:900;">[İADE]</span>' : '';
                  tbody += '<tr>' +
                    '<td style="color:' + nameColor + ';padding:6px 4px;border-bottom:1px solid #0d3325;">' + (it.name || 'Ürün') + refLabel + '</td>' +
                    '<td style="color:' + dataColor + ';text-align:right;padding:6px 4px;border-bottom:1px solid #0d3325;">' + qtyStr + '</td>' +
                    '<td style="color:' + dataColor + ';text-align:right;padding:6px 4px;border-bottom:1px solid #0d3325;">' + afroFmtTL(it.price) + '</td>' +
                    '<td style="color:' + totalColor + ';text-align:right;font-weight:700;padding:6px 4px;border-bottom:1px solid #0d3325;">' + afroFmtTL(it.line_total) + '</td>' +

                tbody += '</tbody>';

              // Seçili güne (veya tümüne) göre: genel özet + TEDARİKÇİ bazlı gruplu liste
              function render(filterKey) {

                var gross = 0, refund = 0, net = 0, profit = 0;
                shown.forEach(function (e) {

                sum.appendChild(chip('Toplam İade', afroFmtTL(refund), '#f87171'));
                sum.appendChild(chip('Satış Sayısı', String(shown.length), '#eafff4'));

                // Tedarikçileri net tutara göre büyükten küçüğe sırala
                var supKeys = Object.keys(groups).sort(function (a, b) {
                  var na = 0, nb = 0;

                  groups[b].forEach(function (e) { nb += Number(e.net) || 0; });
                  return nb - na;
                });
                supKeys.forEach(function (sk) {

                  entries.forEach(function (e) { sNet += Number(e.net) || 0; sProfit += Number(e.profit) || 0; });

        // TEDARİKÇİ SATIŞ LOGU BUTONU (profil sayfasında gösterir)
        var _cachedUserRole = null;
        function afroSupplierMySalesButton() {
          var isProfile = (location.pathname || '').indexOf('/profile') > -1;
          var existing = document.getElementById('afro-supplier-mysales-btn');
          
          if (!isProfile) {
            _cachedUserRole = null; // Profil dışındayken cache'i sıfırla → rol değişince yeniden çekilir
            if (existing && existing.parentNode) existing.parentNode.removeChild(existing);
            return;
          }

          // Kullanıcı rolünü kontrol et (cache'den veya API'den)
          if (_cachedUserRole === null) {
            var tok = localStorage.getItem('pazar_session_token');
            if (!tok) return;
            afroApi('/user/me')
              .then(function (user) {
                _cachedUserRole = user.role || '';
                afroSupplierMySalesButton(); // Rol bilgisi gelince tekrar çağır
              })
              .catch(function () {
                _cachedUserRole = '';
              });
            return;
          }

          // Tedarikçi değilse butonu kaldır
          if (_cachedUserRole !== 'esnaf' && _cachedUserRole !== 'supplier') {
            if (existing && existing.parentNode) existing.parentNode.removeChild(existing);
            return;
          }

          // Profil sayfasındaki kartları bul (glass card attribute'u ile)
          var cards = document.querySelectorAll('[data-afro-glasscard]');
          if (!cards || cards.length === 0) {
            if (existing && existing.parentNode) existing.parentNode.removeChild(existing);
            return;
          }

          // Zaten varsa dokunma
          if (existing && existing.isConnected && existing.parentNode === cards[0].parentNode) return;
          if (existing && existing.parentNode) existing.parentNode.removeChild(existing);

          // Butonu oluştur
          var btn = document.createElement('div');
          btn.id = 'afro-supplier-mysales-btn';
          btn.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:16px 18px;cursor:pointer;margin:12px 0;border-radius:16px;background:linear-gradient(135deg,#1f8a5b,#2fae70);box-shadow:0 4px 14px rgba(31,138,91,.35);';
          btn.innerHTML = '<div style="display:flex;align-items:center;gap:12px;">' +
            '<div style="font-size:24px;">📊</div>' +
            '<div style="font-weight:700;font-size:15px;color:#e6f5ee;">Satışlarım</div>' +
            '</div>' +
            '<div style="font-size:20px;color:#9ccbb8;">›</div>';
          btn.onclick = function () { afroOpenSupplierMySales(); };

          // İlk kartın üstüne ekle
          if (cards[0].parentNode) {
            cards[0].parentNode.insertBefore(btn, cards[0]);
          }

        // Eve Servis Ayarları satırını bul — data-testid önce, olmadı text-content fallback.
        // React production build'inde data-testid bazen kaybolur; fallback bunu yakalar.
        function _afroFindEveServisAnchor(excludeIds) {
          // Yardımcı: elementin gerçekten viewport'ta görünür olup olmadığını kontrol et.
          // React SPA geçişlerinde ESKİ ekran (animasyonla kaybolan) ile YENİ ekran
          // aynı anda DOM'da bulunuyor. Viewport dışındaki (display:none, opacity:0,
          // transform ile kaydırılmış, sıfır boyutlu) elementin bulunması halinde
          // yanlış ekrana enjeksiyon yapılırdı → ekran kalkınca butonlar silinirdi.
          function _isVisible(el) {
            try {
              // display:none veya sıfır boyutlu
              if (el.offsetWidth === 0 && el.offsetHeight === 0) return false;
              // Üst zincirde gizli ata var mı?
              var cs = getComputedStyle(el);
              if (cs.display === 'none' || cs.visibility === 'hidden') return false;
              // opacity 0 olan (geçiş animasyonu)
              if (parseFloat(cs.opacity) < 0.05) return false;
              // Viewport'un çok uzağına kaydırılmış (transform ile ekran dışı)
              var r = el.getBoundingClientRect();
              if (r.width === 0 || r.height === 0) return false;
              var vw = window.innerWidth || 600;
              var vh = window.innerHeight || 800;
              if (r.right < -vw || r.left > 2 * vw) return false; // yatay olarak tamamen dışarıda
              if (r.bottom < -vh || r.top > 2 * vh) return false; // dikey olarak tamamen dışarıda
              return true;
            } catch (e) { return true; } // hata durumunda iyimser davran
          }

          // 1) data-testid ile dene — görünür olanı seç
          var cands = document.querySelectorAll('[data-testid="manage-eve-service-settings"]');
          for (var i = 0; i < cands.length; i++) {
            if (excludeIds.indexOf(cands[i].id) === -1 && _isVisible(cands[i])) return cands[i];
          }
          // 2) Fallback: hem "Eve Servis Ayarları" hem "Teslimat bölgeleri" içeren kompakt div
          var all = document.querySelectorAll('div');
          for (var j = 0; j < all.length; j++) {
            var el = all[j];
            if (excludeIds.indexOf(el.id) !== -1) continue;
            var txt = el.textContent || '';
            if (txt.indexOf('Eve Servis Ayarlar\u0131') !== -1 &&
                txt.indexOf('Teslimat b\u00f6lgeleri') !== -1 &&
                txt.length < 250 &&
                _isVisible(el)) {
              return el;
            }
          }
          return null;
        }

        // Klon text node'larını değiştir (CSS class'ları bundle ile değişir, textContent güvenli)
        function _afroSetCloneLabel(clone, newTitle, newSubtitle) {
          var walker = document.createTreeWalker(clone, NodeFilter.SHOW_TEXT, null, false);
          var node;
          while ((node = walker.nextNode())) {
            var t = node.nodeValue;
            if (!t) continue;
            var trimmed = t.trim();
            if (trimmed === 'Eve Servis Ayarlar\u0131') {
              node.nodeValue = newTitle;
            } else if (trimmed === 'Teslimat b\u00f6lgeleri, \u00f6deme se\u00e7enekleri ve g\u00f6r\u00fcn\u00fcrl\u00fc\u011f\u00fc y\u00f6net') {
              node.nodeValue = newSubtitle;
            }
          }
        }

        // --- ADMIN PANELİ "Yönetim" listesine "Kurye Yönetimi" satırı enjekte et ---
        // Mevcut bir satırı ("Eve Servis Ayarları") klonlayıp başlık/alt başlığını
        // değiştirir; böylece yerel (native) stil + bisiklet ikonu korunur. Tıklanınca
        // afroOpenCourierAdmin() açılır. Dashboard dışındaysa kendini temizler.
        function afroCourierAdminMenuRow() {
          var existing = document.getElementById('afro-courier-admin-row');
          // Anchor'ı hem data-testid hem text-content fallback ile bul
          var anchor = _afroFindEveServisAnchor(['afro-courier-admin-row', 'afro-push-admin-row']);
          if (!anchor || !anchor.parentNode) {
            // Bu sayfa admin dashboard değil -> enjekte edilen satırı kaldır
            if (existing && existing.parentNode) existing.parentNode.removeChild(existing);
            return;
          }
          // Zaten doğru yerde mi? — object referansı DEĞİL, ID ile karşılaştır
          // (React re-render'da anchor yeni node olur; referans eşleşmez ama ID eşleşir)
          var nextOfAnchor = anchor.nextElementSibling;
          if (existing && existing.isConnected && nextOfAnchor && nextOfAnchor.id === 'afro-courier-admin-row') return;
          if (existing && existing.parentNode) existing.parentNode.removeChild(existing);

          // Referans bisiklet ikonu glyph'ini yakala (cloneNode bazen kopyalamıyor)
          var glyph = '';
          var refIcon = anchor.querySelector('div[style*="ionicons"]');
          if (refIcon) glyph = refIcon.textContent || '';

          var clone = anchor.cloneNode(true);
          clone.id = 'afro-courier-admin-row';
          clone.removeAttribute('data-testid');
          // Başlık / alt başlık — text node walker ile (CSS sınıfları bundle'a göre değişir)
          _afroSetCloneLabel(clone, 'Kurye Yönetimi', 'Kuryeler, aktif teslimatlar ve teslim geçmişi');
          // İkon glyph'ini garantiye al (klonda boş kalmışsa referanstan bas)
          var cloneIcon = clone.querySelector('div[style*="ionicons"]');
          if (cloneIcon && glyph) cloneIcon.textContent = glyph;

          clone.onclick = function (e) { if (e) { try { e.preventDefault(); e.stopPropagation(); } catch (x) {} } afroOpenCourierAdmin(); };
          anchor.parentNode.insertBefore(clone, anchor.nextSibling);
        }

        // Profil sayfasındaki "Kampanya Bildirimleri" satırını gizle
        // ─────────────────────────────────────────────────────────────
        function afroHideBildirimToggle() {
          var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
          var node, textNode = null;
          while ((node = walker.nextNode())) {
            if (node.nodeValue && node.nodeValue.trim() === 'Kampanya Bildirimleri') { textNode = node; break; }
          }
          if (!textNode) return;
          // Metin-icerik tabanli: yukari cikarken textContent'i sadece bildirim
          // satirina ait olan EN UST ata elemani (kart) sec. Boslugu normalize et.
          var el = textNode.parentNode;
          var card = null;
          for (var i = 0; i < 8 && el && el !== document.body; i++) {
            var tc = (el.textContent || '').replace(/\s+/g,' ').trim();
            var okContains = tc.indexOf('Kampanya Bildirimleri') !== -1;
            var tooBig = tc.indexOf('r\u00fcn\u00fcm') !== -1 /* Gorunum */
                      || tc.indexOf('Ayarlar') !== -1 /* baska bolum basligi */
                      || tc.length > 120;
            if (okContains && !tooBig) { card = el; }
            if (tooBig) break;
            el = el.parentNode;
          }
          if (card && card.style && !card.getAttribute('data-afro-hidden-broadcast')) {
            card.style.display = 'none';
            card.setAttribute('data-afro-hidden-broadcast','1');
            var prev = card.previousElementSibling;
            if (prev && (prev.textContent || '').replace(/\s/g,'').toLowerCase().indexOf('bildirimayarlar') !== -1) {
              prev.style.display = 'none';
            }
          }
        }

              function render(filterKey) {
                var shown = filterKey ? allLog.filter(function (e) { return afroDayKey(e.date) === filterKey; }) : allLog;
                var gross = 0, refund = 0, net = 0;
                shown.forEach(function (e) {
                  gross += Number(e.subtotal) || 0;
                  refund += Number(e.refunded_amount) || 0;
                  net += Number(e.net) || 0;
                });
                sum.innerHTML = '';
                sum.appendChild(chip(filterKey ? 'Net (Seçili Gün)' : 'Toplam Net', afroFmtTL(net), '#34d399'));
                sum.appendChild(chip('Brüt Satış', afroFmtTL(gross), '#eafff4'));
                sum.appendChild(chip('İade', afroFmtTL(refund), '#f87171'));
                sum.appendChild(chip('Satış Sayısı', String(shown.length), '#eafff4'));
                (function () {
                  var dayKeys = {};
                  shown.forEach(function (e) { dayKeys[afroDayKey(e.date)] = 1; });
                  var pendNet = 0, paidNet = 0;
                  Object.keys(dayKeys).forEach(function (dk) {
                    var pm = afroPayMap[dk]; if (!pm) return;
                    if (pm.status === 'paid') paidNet += Number(pm.net) || 0; else pendNet += Number(pm.net) || 0;
                  });
                  sum.appendChild(chip('Ödenen', afroFmtTL(paidNet), '#6ee7b7'));
                  sum.appendChild(chip('Ödeme Bekleyen', afroFmtTL(pendNet), '#fcd34d'));
                })();

                listWrap.innerHTML = '';
                if (!shown.length) {
                  var empty = document.createElement('div');
                  empty.style.cssText = 'color:#9ccbb8;padding:24px 0;font-size:14px;';
                  empty.textContent = filterKey ? 'Seçili günde satış yok.' : 'Henüz satış yok.';
                  listWrap.appendChild(empty);
                  return;
                }
                var byDay = {};
                shown.forEach(function (e) { var dk = afroDayKey(e.date); (byDay[dk] = byDay[dk] || []).push(e); });
                Object.keys(byDay).sort().reverse().forEach(function (dk) {
                  var dLbl = document.createElement('div');
                  dLbl.style.cssText = 'color:#9ccbb8;font-size:12px;font-weight:700;margin:12px 0 0;';
                  dLbl.textContent = afroDayLabel(dk);
                  (function () {
                    var pm = afroPayMap[dk]; if (!pm) return;
                    var paid = pm.status === 'paid';
                    var confirmed = pm.confirm_status === 'confirmed';
                    var b = document.createElement('span');
                    b.textContent = paid ? '  ✅ Ödendi' : '  ⏳ Ödeme Bekliyor';
                    b.style.cssText = 'font-weight:800;font-size:11px;padding:2px 8px;border-radius:8px;margin-left:8px;' + (paid ? 'background:#065f46;color:#6ee7b7;' : 'background:#78350f;color:#fcd34d;');
                    dLbl.appendChild(b);
                    if (paid) {
                      var cb = document.createElement('span');
                      if (confirmed) {
                        cb.textContent = '  ✔ Onayladınız';
                        cb.style.cssText = 'font-weight:800;font-size:11px;padding:2px 8px;border-radius:8px;margin-left:6px;background:#064e3b;color:#a7f3d0;';
                        dLbl.appendChild(cb);
                      } else {
                        // Onaylama satırı (SMS kodu ile)
                        var wrap = document.createElement('div');
                        wrap.style.cssText = 'margin-top:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;';
                        var info = document.createElement('span');
                        info.textContent = 'SMS ile gelen onay kodunu girerek ödemeyi onaylayın:';
                        info.style.cssText = 'color:#fcd34d;font-size:12px;font-weight:600;';
                        var inp = document.createElement('input');
                        inp.type = 'tel'; inp.maxLength = 6; inp.placeholder = '6 haneli kod';
                        inp.style.cssText = 'width:110px;padding:8px 10px;border-radius:8px;border:1px solid #34d399;background:#04231a;color:#eafff4;font-size:14px;letter-spacing:2px;text-align:center;';
                        var btn = document.createElement('button');
                        btn.textContent = 'Ödemeyi Onayla';
                        btn.style.cssText = 'padding:8px 14px;border:none;border-radius:8px;background:#059669;color:#fff;font-weight:800;font-size:12px;cursor:pointer;';
                        var msg = document.createElement('span');
                        msg.style.cssText = 'font-size:12px;font-weight:700;';
                        btn.onclick = function () {
                          var code = (inp.value || '').replace(/\D/g, '').trim();
                          if (code.length !== 6) { msg.textContent = 'Lütfen 6 haneli kodu girin.'; msg.style.color = '#f87171'; return; }
                          btn.disabled = true; btn.style.opacity = '0.6'; btn.textContent = 'Onaylanıyor...'; msg.textContent = '';
                          afroApi('/supplier/my-payments/confirm', { method: 'POST', body: { date: dk, code: code } })
                            .then(function (res) {
                              if (afroPayMap[dk]) { afroPayMap[dk].confirm_status = 'confirmed'; afroPayMap[dk].confirmed_at = (res && res.confirmed_at) || null; }
                              render(dateInput.value || null);
                            })
                            .catch(function (e) {
                              btn.disabled = false; btn.style.opacity = '1'; btn.textContent = 'Ödemeyi Onayla';
                              msg.textContent = (e && e.message) || 'Onaylanamadı.'; msg.style.color = '#f87171';
                            });
                        };
                        wrap.appendChild(info); wrap.appendChild(inp); wrap.appendChild(btn); wrap.appendChild(msg);
                        // wrap'ı dLbl'den sonra eklemek için işaretle
                        dLbl._afroConfirmWrap = wrap;
                      }
                    }
                  })();
                  listWrap.appendChild(dLbl);
                  if (dLbl._afroConfirmWrap) { listWrap.appendChild(dLbl._afroConfirmWrap); }
                  byDay[dk].forEach(function (e) { listWrap.appendChild(buildOrderCard(e)); });
                });

              dateInput.onchange = function () { render(dateInput.value || null); };
              allBtn.onclick = function () { dateInput.value = ''; render(null); };
              render(null);
              afroApi('/supplier/my-payments').then(function (pd) {
                (pd.rows || []).forEach(function (r) { afroPayMap[r.date] = r; });
                render(null);
              }).catch(function () {});
            })
            .catch(function (err) {
              body.innerHTML = '<div style="color:#f87171;padding:20px 0;">Satış logu alınamadı: ' + ((err && err.message) || '') + '</div>';
            });

        function afroSupRemove(u, btn) {
          afroConfirm((u.name || u.phone || 'Bu kişi') + ' için tedarikçi yetkisi kaldırılsın mı?', function () {
            btn.textContent = '...'; btn.style.opacity = '0.6';
            afroApi('/admin/staff/assign', { method: 'POST', body: { identifier: u.user_id, supplier_group: null } })
              .then(function () { afroSupLoad(document.getElementById('afro-sup-list')); afroSupLoad(document.getElementById('afro-members-sup-list')); })
              .catch(function (e) {
                btn.textContent = 'Kaldır'; btn.style.opacity = '1';
                afroAlert('Kaldırılamadı: ' + ((e && e.message) || ''));
              });
          }, { danger: true });
        }
        function afroSupplierPanel() {
          var input = document.querySelector('input[placeholder*="user_id"]');
          if (!input) { afroSupCleanup(); return; }   // modal kapalı
          var col = input.parentNode;
          if (!col) return;
          // Modal içeriği (atanmış tedarikçi listesi) taşınca kaydırılamıyordu ->
          // modal kartını kaydırılabilir yap. React her render'da inline style'ı
          // sıfırlayabildiği için her tick'te yeniden uygulanır (idempotent).
          try { col.style.maxHeight = '85vh'; col.style.overflowY = 'auto'; col.style.webkitOverflowScrolling = 'touch'; } catch (e) {}
          var wrap = document.getElementById('afro-sup-wrap');
          if (!wrap) {
            wrap = document.createElement('div');
            wrap.id = 'afro-sup-wrap';
            // Katı koyu-yeşil panel: açık temada başlık + kartlar okunur kalır.
            wrap.style.cssText = 'margin-top:14px;padding:12px;border-radius:12px;background:#06392a;border:1px solid #14855f;';
            wrap.innerHTML = '<div style="color:#e6f5ee;font-weight:800;font-size:14px;margin-bottom:8px;">Atanmış Tedarikçiler</div>'
              + '<div id="afro-sup-list" style="display:flex;flex-direction:column;gap:8px;">'
              + '<div style="color:#9fb3aa;font-size:13px;">Yükleniyor...</div></div>';
            col.appendChild(wrap);
            // Madde 8: Ödeme Takibi butonu (başlığın hemen altına)
            var payTrackBtn = document.createElement('div');
            payTrackBtn.textContent = '💰 Ödeme Takibi';
            payTrackBtn.style.cssText = 'background:#059669;color:#fff;font-weight:800;font-size:13px;padding:9px 14px;border-radius:10px;cursor:pointer;text-align:center;margin-bottom:10px;';
            payTrackBtn.onclick = function () { afroOpenPaymentTracking(); };
            if (wrap.firstChild && wrap.firstChild.nextSibling) {
              wrap.insertBefore(payTrackBtn, wrap.firstChild.nextSibling);
            } else {
              wrap.appendChild(payTrackBtn);
            }
            afroSupLoad();
          } else if (wrap.parentNode !== col) {
            col.appendChild(wrap); // React kaldırdıysa geri koy
          }
        }

        // ============================================================
        // ÜYELER SAYFASI: en üstte "📦 Tedarikçiler" bölümü + altında "👥 Üyeler".
        // Bir üye tedarikçi yapılınca backend /admin/members listesinden düşüyordu
        // (rol=esnaf). Artık atanmış tedarikçiler bu bölümde görünür, üyeler altta.
        // "Tedarikçi Yetkilendir" butonunun hemen altına enjekte edilir.
        // React düğümü silerse AYNI düğüm tekrar takılır (veri yeniden yüklenmez).
        // ============================================================
        var afroMembersSecNode = null;
        var afroMembersLblNode = null;
        function afroMembersSupBuildSection() {
          var sec = document.createElement('div');
          sec.id = 'afro-members-sup-section';
          // Katı koyu-yeşil bölüm: açık temada başlık + kartlar okunur kalır.
          sec.style.cssText = 'margin:0 20px 6px 20px;border:1px solid #14855f;border-radius:14px;background:#06392a;padding:12px;box-sizing:border-box;';
          var title = document.createElement('div');
          title.textContent = '📦 Tedarikçiler';
          title.style.cssText = 'color:#e6f5ee;font-weight:800;font-size:14px;margin-bottom:8px;';
          sec.appendChild(title);
          var payBtn = document.createElement('div');
          payBtn.textContent = '💰 Ödeme Takibi';
          payBtn.style.cssText = 'background:#059669;color:#fff;font-weight:800;font-size:13px;padding:9px 14px;border-radius:10px;cursor:pointer;text-align:center;margin-bottom:10px;';
          payBtn.onclick = function () { try { afroOpenPaymentTracking(); } catch (e) {} };
          sec.appendChild(payBtn);
          var list = document.createElement('div');
          list.id = 'afro-members-sup-list';
          // NOT: iç kaydırma YOK. Bölüm, üye listesinin scroll container'ının
          // içine enjekte edildiği için tüm içerik (tedarikçiler + üyeler) birlikte
          // kayar. İç max-height/overflow mobilde sayfa kaydırmayı hapsediyordu.
          list.style.cssText = 'display:flex;flex-direction:column;gap:8px;';
          list.innerHTML = '<div style="color:#9fb3aa;font-size:13px;">Yükleniyor...</div>';
          sec.appendChild(list);
          afroSupLoad(list);
          return sec;
        }
        function afroMembersSupBuildLabel() {
          var lbl = document.createElement('div');
          lbl.id = 'afro-members-uyeler-label';
          lbl.textContent = '👥 Üyeler';
          lbl.style.cssText = 'color:#1a7a52;font-weight:800;font-size:15px;margin:6px 20px 8px 20px;';
          return lbl;
        }
        function afroMembersSupCleanup() {
          var s = document.getElementById('afro-members-sup-section');
          if (s && s.parentNode) s.parentNode.removeChild(s);
          var l = document.getElementById('afro-members-uyeler-label');
          if (l && l.parentNode) l.parentNode.removeChild(l);
          afroMembersSecNode = null; afroMembersLblNode = null;
        }
        // Üye listesinin KAYAN container'ının iç içerik sarmalayıcısını bulur.
        // Yapı: sabit başlık (arama + "Tedarikçi Yetkilendir") DIŞINDA; üye kartları
        // ayrı bir ScrollView (overflow:auto) içinde. Her üye kartında "Detay" butonu
        // var; ona en yakın kayan atayı buluruz = üye ScrollView'i. Onun tek çocuğu
        // (içerik sarmalayıcı) üye kartlarını tutar. Bölümü BURAYA, kartlardan önce
        // enjekte edince her şey (tedarikçiler + üyeler) birlikte kayar.
        function afroFindMembersScrollContent() {
          var nodes = document.querySelectorAll('div, span');
          var detay = null;
          for (var i = 0; i < nodes.length; i++) {
            var n = nodes[i];
            if (n.children.length === 0 && (n.textContent || '').trim() === 'Detay') { detay = n; break; }
          }
          if (!detay) return null;
          var p = detay;
          for (var j = 0; j < 18 && p && p.tagName; j++) {
            var cs = null;
            try { cs = getComputedStyle(p); } catch (e) {}
            if (cs && (cs.overflowY === 'auto' || cs.overflowY === 'scroll')) {
              // p = ScrollView; tek çocuğu içerik sarmalayıcı
              return (p.children.length === 1) ? p.children[0] : p;
            }
            p = p.parentNode;
          }
          return null;
        }
        function afroMembersSuppliersSection() {
          // Üyeler sayfasını "Ad soyad ara" arama kutusundan tanı (yalnızca burada var).
          var si = document.querySelector('input[placeholder="Ad soyad ara"]');
          if (!si) { afroMembersSupCleanup(); return; }
          var content = afroFindMembersScrollContent();
          if (!content) return; // liste henüz render olmadı -> sonraki tick'te dene
          // bölüm + etiket (React sildiyse AYNI düğümü tekrar tak; yoksa oluştur)
          if (!afroMembersSecNode || !document.body.contains(afroMembersSecNode)) {
            afroMembersSecNode = afroMembersSupBuildSection();
          }
          if (!afroMembersLblNode || !document.body.contains(afroMembersLblNode)) {
            afroMembersLblNode = afroMembersSupBuildLabel();
          }
          // sıralama: [Tedarikçiler bölümü] -> [Üyeler etiketi] -> üye kartları
          // Bölümü, içerik sarmalayıcısının İLK çocuğu yap (üye kartlarının üstünde).
          if (content.firstChild !== afroMembersSecNode) {
            content.insertBefore(afroMembersSecNode, content.firstChild);
          }
          if (afroMembersSecNode.nextSibling !== afroMembersLblNode) {
            content.insertBefore(afroMembersLblNode, afroMembersSecNode.nextSibling);
          }
        }

        // ============================================================
        // TEDARİKÇİLER LİSTE SAYFASI: "Tedarikçi / Kategori" butonunun
        // hemen altına "📊 Tüm Satış Logu (Genel Toplam)" butonu ekle.
        // Bu sayfada user_id input'u YOKtur; bu yüzden afroSupplierPanel
        // burada çalışmaz. Ayrı, her tick'te çalışan bir enjektör gerekir.
        // React yeniden render edip silerse tekrar eklenir.
        // ============================================================
        function afroAllSalesLogButton() {
          // 1) "Tedarikçi / Kategori" yazan tıklanabilir butonu bul
          var targetBtn = null;
          var allDivs = document.querySelectorAll('div, button, a');
          for (var i = 0; i < allDivs.length; i++) {
            var el = allDivs[i];
            var txt = (el.textContent || '').trim();
            // Sadece bu buton (kısa metin, hem "Tedarikçi" hem "Kategori" içeren)
            if (txt.length <= 40 && txt.indexOf('Tedarikçi') >= 0 && txt.indexOf('Kategori') >= 0) {
              // Tıklanabilir kapsayıcıyı bul (kendisi veya üst 5 ata)
              var cand = el;
              for (var j = 0; j < 6 && cand; j++) {
                var cs = getComputedStyle(cand);
                if (cs.cursor === 'pointer' || cand.getAttribute('role') === 'button' ||
                    cand.tagName === 'BUTTON' || cand.tagName === 'A') {
                  targetBtn = cand;
                  break;
                }
                cand = cand.parentElement;
              }
              if (targetBtn) break;
            }
          }
          if (!targetBtn || !targetBtn.parentNode) {
            // Bu sayfada değiliz -> önceden eklenmiş butonu temizle (başka sayfaya sızmasın)
            var leaked = document.getElementById('afro-all-saleslog-btn');
            if (leaked && leaked.parentNode) leaked.parentNode.removeChild(leaked);
            return;
          }
          // "Tedarikçi / Kategori" butonu, "TEDARİKÇİ LİSTESİ" başlığıyla AYNI satırda
          // (sağda) olabilir. Butonun yanına değil, o başlık satırının ALTINA koymak
          // için: butondan yukarı çıkıp EBEVEYNİNİN GENİŞLİĞİNİ NEREDEYSE KAPLAYAN
          // (tam-genişlik) atayı bul; onun ardına eklersek her zaman ALTA düşer.
          var row = targetBtn;
          var container = row.parentElement;
          for (var k = 0; k < 6 && container; k++) {
            var rw = row.getBoundingClientRect().width;
            var cw = container.getBoundingClientRect().width;
            if (cw > 0 && rw >= cw * 0.8) break; // row, ebeveynini dolduruyor = tam-genişlik satır
            row = container;
            container = container.parentElement;
          }
          if (!container) { row = targetBtn; container = targetBtn.parentNode; }
          // 2) Buton zaten DOM'da bağlıysa ve doğru satırın hemen ardındaysa dokunma
          var existing = document.getElementById('afro-all-saleslog-btn');
          if (existing) {
            if (existing.isConnected && existing.previousElementSibling === row) return;
            if (existing.parentNode) existing.parentNode.removeChild(existing); // yanlış yerde -> yeniden ekle
          }
          // 3) Butonu oluştur ve tam-genişlik başlık satırının hemen ALTINA ekle
          var allLogBtn = document.createElement('div');
          allLogBtn.id = 'afro-all-saleslog-btn';
          allLogBtn.textContent = '📊 Tüm Satış Logu (Genel Toplam)';
          allLogBtn.style.cssText = 'display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-sizing:border-box;background:#0e7a55;color:#fff;font-weight:800;font-size:15px;padding:14px 16px;border-radius:14px;cursor:pointer;margin:12px 0 6px 0;border:1px solid #16b67e;box-shadow:0 4px 14px rgba(14,122,85,0.35);';
          allLogBtn.onclick = function () { afroOpenAllSalesLog(); };

        // TEDARİKÇİ DETAY SAYFASI: Satış Logu butonu ekle, hesaba ata butonunu gizle

        // ============================================================
        // Bir div'in SADECE kendi doğrudan text node'larını döndürür (çocuklar hariç)
        function afroDirectText(el) {
          var d = '';
          for (var n = 0; n < el.childNodes.length; n++) {
            if (el.childNodes[n].nodeType === 3) d += el.childNodes[n].nodeValue;
          }
          return d.trim();
        }
        function afroSupplierDetailPanel() {
          var logBtnId = 'afro-supplier-detail-saleslog-btn';
          // 1) "Bu tedarikçiyi hesaba ata" metnini taşıyan div'i bul
          //    (React Native Web: <div class="css-...">, role/button yok)
          var textDiv = null;
          var divs = document.querySelectorAll('div');
          for (var i = 0; i < divs.length; i++) {
            if (afroDirectText(divs[i]) === 'Bu tedarikçiyi hesaba ata') { textDiv = divs[i]; break; }
          }
          if (!textDiv) {
            // Tedarikçi detay sayfasında DEĞİLİZ. SPA'da başka sayfaya geçildiğinde
            // React bizim eklediğimiz butonu temizlemez -> elle kaldır ki başka
            // sayfalara (Pazarlar vb.) sızmasın.
            var leaked = document.getElementById(logBtnId);
            if (leaked && leaked.parentNode) leaked.parentNode.removeChild(leaked);
            return;
          }

          // 2) Tıklanabilir buton kutusunu bul (r-1loqt21 = RN Web pressable) ve gizle.
          //    Her tick'te tekrar gizle (React yeniden render edip geri getirebilir).
          var btnBox = textDiv;
          for (var k = 0; k < 5 && btnBox; k++) {
            if ((btnBox.className || '').toString().indexOf('r-1loqt21') >= 0) break;
            btnBox = btnBox.parentElement;
          }
          if (!btnBox) btnBox = textDiv.parentElement;
          if (btnBox && btnBox.style.display !== 'none') btnBox.style.display = 'none';

          // 3) Tedarikçi adını bul: "Tedarikçi Detayı" etiketinin hemen sonraki kardeşi
          var supplierName = '';
          for (var j = 0; j < divs.length; j++) {
            if (afroDirectText(divs[j]).toLocaleLowerCase('tr-TR') === 'tedarikçi detayı') {
              var sib = divs[j].nextElementSibling;
              if (sib) supplierName = (sib.textContent || '').trim();
              break;
            }
          }
          // Yedek: kalın (fw>=800), tepede ve "bağlı ürün" içermeyen metni ad kabul et
          if (!supplierName) {
            for (var m = 0; m < divs.length; m++) {
              var el = divs[m];
              var r = el.getBoundingClientRect();
              if (r.top > 0 && r.top < 140) {
                var dt = afroDirectText(el);
                var fw = parseInt(getComputedStyle(el).fontWeight, 10) || 400;
                if (dt && fw >= 800 && dt.toLocaleLowerCase('tr-TR') !== 'tedarikçi detayı' &&
                    dt.indexOf('bağlı ürün') < 0 && dt.length > 1 && dt.length < 60) {
                  supplierName = dt; break;
                }
              }
            }
          }

          // 4) "Satış Logları" butonunu ekle (yoksa). React sildiyse tekrar eklenir.
          if (document.getElementById(logBtnId)) return; // zaten ekranda

          var logBtn = document.createElement('div');
          logBtn.id = logBtnId;
          logBtn.textContent = '📊 Satış Logları';
          // "Ürün Ekle" butonuyla aynı boyut/stil: yan boşluk 24px (daha dar), padding 12px 0, aynı yeşil
          logBtn.style.cssText = 'display:flex;align-items:center;justify-content:center;gap:8px;box-sizing:border-box;background:#14b67e;color:#fff;font-weight:700;font-size:16px;padding:12px 0;border-radius:12px;cursor:pointer;margin:8px 24px 0;';
          logBtn.onclick = function () {
            if (!supplierName) { afroAlert('Tedarikçi adı bulunamadı.'); return; }
            afroOpenSalesLog(supplierName);
          };

          // "Bu tedarikçiyi hesaba ata" kutusunun bulunduğu yere (Ürün Ekle'nin altına) ekle
          if (btnBox && btnBox.parentNode) {
            btnBox.parentNode.insertBefore(logBtn, btnBox.nextSibling);
          } else if (textDiv.parentNode) {
            textDiv.parentNode.appendChild(logBtn);
          }
        }

                      '<div style="color:#eafff4;font-weight:800;font-size:17px;margin-bottom:8px;">' + msg + '</div>' +
                      cardLine +
                      '<div style="color:#9ccbb8;font-size:13px;line-height:1.5;margin-top:10px;">Satış logu güncellendi: iade edilen ürün(ler) ' +
                      '<b>iade</b> olarak işaretlendi ve tutarı net satıştan düşüldü. ' +
                      'Sayfayı yenileyerek güncel durumu görebilirsiniz.</div>' +
                      '<button id="afro-refund-done" style="margin-top:18px;background:#0e7a55;color:#fff;border:0;border-radius:10px;padding:12px 22px;font-weight:800;font-size:15px;cursor:pointer;">Tamam</button>' +
                      '</div>';
                    var done = document.getElementById('afro-refund-done');

                  })
                  .catch(function (err) {
                    saveBtn.disabled = false;
                    saveBtn.textContent = 'İadeyi Kaydet';
                    saveBtn.style.opacity = '1';
                    afroAlert('İade kaydedilemedi: ' + (err && err.message ? err.message : 'bilinmeyen hata'));
                  });
              };
              body.appendChild(saveBtn);
            })
            .catch(function (err) {
              body.innerHTML = '<div style="color:#f87171;padding:20px 0;">Sipariş yüklenemedi: ' +
                (err && err.message ? err.message : 'hata') + '</div>';
