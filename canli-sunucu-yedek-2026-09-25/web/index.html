        }

        // ============================================================
        // ÜYE DETAY SAYFASI: TESLİM ALINMAMA (NO-SHOW) DURUMU
        // /admin/member/<user_id> ekranında "Üye Detayı" başlığının altına
        // teslim alınmama durumu + "Kısıtlamayı Kaldır" ve "Mücbir Sebep
        // İstisnası" butonlarını enjekte eder.
        // ============================================================
        function afroMemberDetailUserId() {
          var m = (location.pathname || '').match(/^\/admin\/member\/([^\/]+)\/?$/);
          return m ? decodeURIComponent(m[1]) : '';
        }
        var afroNoShowState = { userId: '', loading: false, data: null };

        // Kartı, başlığın bulunduğu YATAY (flex-row) çubuğa değil; yukarıdaki ilk
        // DİKEY (column/blok) ve yeterince geniş konteynıra, başlık bloğunun hemen
        // altına ekleyecek konumu bulur. Böylece kart tam genişlikte görünür.
        function afroNoShowInsertPoint(heading) {
          var node = heading;
          var parent = node.parentNode;
          for (var i = 0; i < 10 && parent && parent !== document.body; i++) {
            var cs = null;
            try { cs = window.getComputedStyle(parent); } catch (e) { cs = null; }
            var dir = cs ? (cs.flexDirection || '') : '';
            var disp = cs ? (cs.display || '') : '';
            var isFlexRow = (disp.indexOf('flex') >= 0 && dir.indexOf('row') >= 0);
            var w = 0;
            try { w = parent.getBoundingClientRect().width; } catch (e) { w = 0; }
            // Dikey (satır olmayan) ve yeterince geniş ilk konteynır
            if (!isFlexRow && w >= 240) {
              return { parent: parent, after: node };
            }
            node = parent;
            parent = parent.parentNode;
          }
          // Uygun konteynır bulunamazsa eski davranışa dön
          return { parent: heading.parentNode, after: heading };
        }

        function afroNoShowPanel() {
          var uid = afroMemberDetailUserId();
          if (!uid) {
            var leaked = document.getElementById('afro-noshow-card');
            if (leaked && leaked.parentNode) leaked.parentNode.removeChild(leaked);
            afroNoShowState = { userId: '', loading: false, data: null };
            return;
          }
          // "Üye Detayı" başlığını bul
          var heading = null;
          var divs = document.querySelectorAll('div');
          for (var i = 0; i < divs.length; i++) {
            var t = afroDirectText(divs[i]);
            if (t === 'Üye Detayı' || t === 'Uye Detayi') { heading = divs[i]; break; }
          }
          if (!heading || !heading.parentNode) return;

          // Kullanıcı değiştiyse veriyi (yeniden) çek
          if (afroNoShowState.userId !== uid && !afroNoShowState.loading) {
            afroNoShowState.loading = true;
            afroNoShowState.userId = uid;
            afroNoShowState.data = null;
            afroApi('/admin/members/' + encodeURIComponent(uid))
              .then(function (member) { afroNoShowState.data = member; })
              .catch(function () { afroNoShowState.data = { _error: true }; })
              .then(function () { afroNoShowState.loading = false; });
          }

          var existing = document.getElementById('afro-noshow-card');
          // Kart doğru yerde ve veriyle güncelse dokunma
          if (existing && existing.getAttribute('data-uid') === uid &&
              existing.getAttribute('data-loaded') === (afroNoShowState.data ? '1' : '0')) {
            return;
          }
          if (existing && existing.parentNode) existing.parentNode.removeChild(existing);

          var card = document.createElement('div');
          card.id = 'afro-noshow-card';
          card.setAttribute('data-uid', uid);
          card.setAttribute('data-loaded', afroNoShowState.data ? '1' : '0');
          card.style.cssText = 'width:100%;box-sizing:border-box;align-self:stretch;flex:0 0 auto;background:#12130a;border:1px solid #b45309;border-radius:14px;padding:16px;margin:10px 0 14px 0;color:#fde68a;font-family:Arial,sans-serif;';

          var data = afroNoShowState.data;
          if (!data) {
            card.innerHTML = '<div style="font-weight:800;font-size:15px;color:#fbbf24;">🚚 Teslim Alınmama Durumu</div>' +
              '<div style="color:#cbb27a;margin-top:6px;">Yükleniyor...</div>';
          } else if (data._error) {
            card.innerHTML = '<div style="font-weight:800;font-size:15px;color:#fbbf24;">🚚 Teslim Alınmama Durumu</div>' +
              '<div style="color:#f87171;margin-top:6px;">Durum yüklenemedi.</div>';
          } else {
            var ns = data.no_show_status || {};
            var count = ns.count || 0;
            var blocked = !!ns.online_only;
            var untilStr = '';
            if (ns.until) { try { untilStr = new Date(ns.until).toLocaleDateString('tr-TR'); } catch (e) { untilStr = ns.until; } }
            var lastStr = '';
            if (ns.last_at) { try { lastStr = new Date(ns.last_at).toLocaleString('tr-TR'); } catch (e) { lastStr = ns.last_at; } }

            var statusLine = blocked
              ? '<span style="color:#f87171;font-weight:800;">🔴 Kısıtlı</span> — kapıda ödeme kapalı' + (untilStr ? ' (bitiş: ' + untilStr + ')' : '')
              : '<span style="color:#34d399;font-weight:800;">🟢 Normal</span> — kapıda ödeme açık';

            var html = '<div style="font-weight:800;font-size:16px;color:#fbbf24;margin-bottom:8px;">🚚 Teslim Alınmama Durumu</div>';
            html += '<div style="color:#eae3c7;font-size:14px;line-height:1.7;">';
            html += 'Toplam teslim alınmama: <b>' + count + '</b><br>';
            html += 'Kapıda ödeme durumu: ' + statusLine + '<br>';
            if (lastStr) html += 'Son teslim alınmama: ' + lastStr + '<br>';
            html += '</div>';

            // Geçmiş (loglar)
            var logs = data.no_show_logs || [];
            if (logs.length) {
              html += '<div style="margin-top:10px;font-weight:700;color:#fbbf24;font-size:13px;">Geçmiş</div>';
              html += '<div style="margin-top:4px;max-height:160px;overflow:auto;">';
              for (var k = 0; k < logs.length; k++) {
                var lg = logs[k];
                var ld = '';
                if (lg.created_at) { try { ld = new Date(lg.created_at).toLocaleString('tr-TR'); } catch (e) { ld = lg.created_at; } }
                var actIcon = lg.action === 'cash_blocked' ? '🔴' : (lg.action === 'cash_unblocked' ? '🟢' : (lg.action === 'exception_applied' ? '⚖️' : '⚠️'));
                html += '<div style="border-bottom:1px solid #2a2a12;padding:5px 0;font-size:12px;color:#d6cfac;">' +
                  actIcon + ' ' + (ld ? '<span style="color:#9c936a;">' + ld + '</span> — ' : '') +
                  (lg.details || '') +
                  (lg.admin_note ? '<br><span style="color:#9c936a;">Not: ' + lg.admin_note + '</span>' : '') +
                  '</div>';
              }
              html += '</div>';
            }

            html += '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;">' +
              '<button id="afro-ns-clear" style="flex:1;min-width:150px;background:#065f46;color:#fff;border:0;border-radius:10px;padding:12px;font-weight:800;cursor:pointer;">✅ Kısıtlamayı Kaldır</button>' +
              '<button id="afro-ns-exc" style="flex:1;min-width:150px;background:#1d4ed8;color:#fff;border:0;border-radius:10px;padding:12px;font-weight:800;cursor:pointer;">⚖️ Mücbir Sebep İstisnası</button>' +
              '</div>';
            card.innerHTML = html;
          }

          // "Üye Detayı" metnini taşıyan div genelde bir flex-ROW başlık çubuğunun
          // (geri butonu + başlık + rozet) içindedir. Kartı bu satırın İÇİNE koyarsak
          // daralır. Bunun yerine yukarı çıkıp ilk COLUMN (dikey) ve yeterince geniş
          // konteynırı bulup başlık bloğunun ALTINA tam genişlikte ekliyoruz.
          var ins = afroNoShowInsertPoint(heading);
          if (ins.after && ins.after.nextSibling) ins.parent.insertBefore(card, ins.after.nextSibling);
          else ins.parent.appendChild(card);

          // Buton olaylarını bağla
          var clearBtn = document.getElementById('afro-ns-clear');
          if (clearBtn) clearBtn.onclick = function () { afroNoShowAction(uid, 'clear'); };
          var excBtn = document.getElementById('afro-ns-exc');
          if (excBtn) excBtn.onclick = function () { afroNoShowAction(uid, 'exception'); };
        }

        function afroNoShowAction(uid, kind) {
          var promptMsg = (kind === 'clear')
            ? 'Kapıda ödeme kısıtlamasını KALDIR.\nSayaç korunur, sadece aktif kısıtlama kalkar.\n\nAdmin notu (zorunlu):'
            : 'MÜCBİR SEBEP İSTİSNASI: teslim alınmama sayacından 1 düşülür ve kısıtlama yeniden hesaplanır.\n\nAdmin notu (zorunlu):';
          afroPrompt(promptMsg, '', function (note) {
            note = (note || '').trim();
            if (!note) { afroAlert('Admin notu zorunludur.'); return; }
            var endpoint = (kind === 'clear')
              ? '/admin/members/' + encodeURIComponent(uid) + '/no-show/clear'
              : '/admin/members/' + encodeURIComponent(uid) + '/no-show/exception';
            afroApi(endpoint, { method: 'POST', body: { admin_note: note } })
              .then(function () {
                afroAlert(kind === 'clear' ? '✅ Kısıtlama kaldırıldı.' : '⚖️ Mücbir sebep istisnası uygulandı.');
                // Veriyi yeniden çekmek için state'i sıfırla -> tick yeniden yükler
                afroNoShowState = { userId: '', loading: false, data: null };
                var c = document.getElementById('afro-noshow-card');
                if (c && c.parentNode) c.parentNode.removeChild(c);
              })
              .catch(function (err) {
                afroAlert('İşlem başarısız: ' + (err && err.message ? err.message : 'hata'));
              });
          });
        }

        // ============================================================
        // ADMIN — "Gizlilik ve Sözleşmeler" sayfasına Tedarikçi Sözleşmesi butonu ekle
        // ============================================================
        // Mevcut sözleşme kartlarından birini KLONLAYARAK, birebir aynı stilde
        // bir "Tedarikçi Sözleşmesi" kartı enjekte eder. Böylece diğer kartlarla
        // (KVKK, Gizlilik Politikası, Üyelik Sözleşmesi, İade & Şikayet) aynı
        // görünür. "PDF Yükle" butonu yükleme modalını açar.
        function afroCountOcc(s, sub) {
          if (!s) return 0; return s.split(sub).length - 1;
        }
        function afroLegalPageContractButton() {
          var isLegalPage = (location.pathname || '').indexOf('/admin/legal-documents') > -1;
          var existing = document.getElementById('afro-supplier-contract-card');
          if (!isLegalPage) {
            if (existing && existing.parentNode) existing.parentNode.removeChild(existing);
            return;
          }
          if (existing && existing.isConnected) return; // zaten enjekte edilmiş

          // Mevcut kartları bul: "Aktif belge" ifadesini TAM 1 kez içeren en
          // dıştaki div = tek bir kartın kökü. (Liste kabı 4 kez içerir.)
          var divs = document.querySelectorAll('div');
          var cardRoot = null, best = -1;
          for (var i = 0; i < divs.length; i++) {
            var t = divs[i].textContent || '';
            if (t.indexOf('Aktif belge') > -1 && afroCountOcc(t, 'Aktif belge') === 1 && t.indexOf('PDF Yükle') > -1) {
              if (t.length > best) { best = t.length; cardRoot = divs[i]; }
            }
          }
          if (!cardRoot || !cardRoot.parentNode) return; // sayfa henüz yüklenmedi

          var container = cardRoot.parentNode;
          // Zaten kartımız varsa (isConnected kontrolü yukarıda), yoksa klonla
          var clone = cardRoot.cloneNode(true);
          clone.id = 'afro-supplier-contract-card';
          clone.setAttribute('data-afro-contract', '1');

          // Metinleri güncelle: başlık, sürüm, URL. "Aktif belge" ve "PDF Yükle" korunur.
          var titleSet = false;
          var walker = document.createTreeWalker(clone, NodeFilter.SHOW_TEXT, null, false);
          var tn, urlNode = null, verNode = null;
          while ((tn = walker.nextNode())) {
            var v = tn.nodeValue;
            if (!v || !v.trim()) continue;
            var s = v.trim();
            if (s.indexOf('Sürüm') > -1) { verNode = tn; }
            else if (s.indexOf('http') > -1) { urlNode = tn; tn.nodeValue = 'Yükleniyor...'; }
            else if (s.indexOf('Aktif belge') > -1) { /* koru */ }
            else if (s.indexOf('PDF Yükle') > -1) { /* koru */ }
            else if (!titleSet) { tn.nodeValue = 'Tedarikçi Sözleşmesi'; titleSet = true; }
          }
          if (verNode) verNode.nodeValue = 'Sürüm: yükleniyor...';

          // Tüm eski React tıklama davranışlarını temizlemek için: klonun
          // içindeki "PDF Yükle" ve URL'ye tıklamayı kendi handler'ımıza bağla.
          clone.addEventListener('click', function (e) {
            var node = e.target;
            while (node && node !== clone) {
              var nt = (node.textContent || '').trim();
              if (nt.indexOf('PDF Yükle') > -1 && nt.length < 24) {
                e.preventDefault(); e.stopPropagation();
                afroOpenContractAdmin();
                return;
              }
              node = node.parentNode;
            }
            // Karta (URL/ikon) tıklanınca aktif PDF'i aç
            if (clone._afroPdfUrl) {
              e.preventDefault(); e.stopPropagation();
              window.open(clone._afroPdfUrl, '_blank', 'noopener');
            }
          }, true);

          container.appendChild(clone);

          // Aktif sözleşme bilgisini çekip kartı doldur
          afroApi('/supplier-contract').then(function (c) {
            var live = document.getElementById('afro-supplier-contract-card');
            if (!live) return;
            var ver = (c && c.version) || 'Henüz yüklenmedi';
            var url = (c && c.url) || '';
            if (url && url.indexOf('http') !== 0) url = 'https://afrogida.com.tr' + url;
            live._afroPdfUrl = url;
            var w2 = document.createTreeWalker(live, NodeFilter.SHOW_TEXT, null, false);
            var n;
            while ((n = w2.nextNode())) {
              var val = (n.nodeValue || '').trim();
              if (val.indexOf('Sürüm') > -1) { n.nodeValue = 'Sürüm: ' + ver; }
              else if (val === 'Yükleniyor...') { n.nodeValue = url || 'Henüz sözleşme yüklenmedi'; }
            }
          }).catch(function () {});
        }

        // ============================================================
        // TEDARİKÇİ SÖZLEŞMESİ — ERİŞİM KİLİDİ (GATE)
        // Sözleşmeyi (aktif sürümü) onaylamayan tedarikçi panele giremez.
        // Tam ekran, en üst z-index bloklayıcı modal. Onaylayınca kalkar.
        // Backend ayrıca ürün ekleme/düzenlemeyi 403 ile engeller.
        // ============================================================
        var _afroContractState = null; // null | 'checking' | 'ok' | 'blocked'
        var _afroContractInfo = null;  // {url, version, title}
        function afroRemoveContractGate() {
          var m = document.getElementById('afro-contract-gate');
          if (m && m.parentNode) m.parentNode.removeChild(m);
        }
        function afroSupplierLogout() {
          try { localStorage.removeItem('pazar_session_token'); } catch (e) {}
          try { location.href = '/'; } catch (e) { location.reload(); }
        }
        function afroShowContractGate() {
          if (document.getElementById('afro-contract-gate')) return;
          var info = _afroContractInfo || {};
          var pdfUrl = (info.url || '');
          if (pdfUrl.indexOf('http') !== 0) pdfUrl = 'https://afrogida.com.tr' + pdfUrl;
          var ov = document.createElement('div');
          ov.id = 'afro-contract-gate';
          ov.style.cssText = 'position:fixed;inset:0;z-index:2147483600;background:rgba(6,20,14,0.92);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:18px;';
          var card = document.createElement('div');
          card.style.cssText = 'max-width:460px;width:100%;background:linear-gradient(150deg,#0f3d2a,#12503a);border:1px solid rgba(255,255,255,0.14);border-radius:20px;box-shadow:0 18px 50px rgba(0,0,0,.5);padding:24px 22px;color:#e6f5ee;font-family:inherit;';
          card.innerHTML =
            '<div style="font-size:34px;text-align:center;margin-bottom:6px;">📄</div>' +
            '<div style="font-weight:800;font-size:19px;text-align:center;margin-bottom:6px;">' + (info.title || 'Tedarikçi Sözleşmesi') + '</div>' +
            '<div style="color:#9fcbb8;font-size:13px;text-align:center;margin-bottom:16px;">Panele erişebilmek için tedarikçi sözleşmesini okuyup onaylamanız gerekmektedir.</div>' +
            '<a href="' + pdfUrl + '" target="_blank" rel="noopener" style="display:block;text-align:center;background:rgba(255,255,255,0.10);color:#e6f5ee;text-decoration:none;font-weight:700;font-size:14px;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.16);margin-bottom:16px;">📑 Sözleşmeyi Görüntüle (PDF)</a>' +
            '<label id="afro-contract-chk-row" style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;background:rgba(255,255,255,0.06);padding:12px 14px;border-radius:12px;margin-bottom:16px;">' +
              '<input type="checkbox" id="afro-contract-chk" style="width:20px;height:20px;margin-top:1px;flex:0 0 auto;cursor:pointer;">' +
              '<span style="font-size:13.5px;line-height:1.4;color:#e6f5ee;">Sözleşmeyi okudum, anladım ve <b>kabul ediyorum</b>.</span>' +
            '</label>' +
            '<button id="afro-contract-accept" disabled style="width:100%;background:#1f8a5b;color:#fff;font-weight:800;font-size:15px;padding:13px;border:none;border-radius:12px;cursor:not-allowed;opacity:.55;margin-bottom:10px;">Kabul Et ve Devam Et</button>' +
            '<button id="afro-contract-logout" style="width:100%;background:transparent;color:#9fcbb8;font-weight:600;font-size:13px;padding:8px;border:none;cursor:pointer;text-decoration:underline;">Çıkış Yap</button>' +
            '<div id="afro-contract-msg" style="text-align:center;font-size:12.5px;margin-top:8px;min-height:16px;"></div>';
          ov.appendChild(card);
          document.body.appendChild(ov);
          var chk = card.querySelector('#afro-contract-chk');
          var btn = card.querySelector('#afro-contract-accept');
          var msg = card.querySelector('#afro-contract-msg');
          chk.addEventListener('change', function () {
            if (chk.checked) { btn.disabled = false; btn.style.cursor = 'pointer'; btn.style.opacity = '1'; }
            else { btn.disabled = true; btn.style.cursor = 'not-allowed'; btn.style.opacity = '.55'; }
          });
          card.querySelector('#afro-contract-logout').onclick = afroSupplierLogout;
          btn.onclick = function () {
            if (btn.disabled) return;
            btn.disabled = true; btn.style.opacity = '.55'; btn.style.cursor = 'wait';
            msg.style.color = '#9fcbb8'; msg.textContent = 'Onaylanıyor...';
            afroApi('/supplier/accept-contract', { method: 'POST', body: {} })
              .then(function () {
                _afroContractState = 'ok';
                msg.style.color = '#7dffb0'; msg.textContent = 'Onaylandı ✓';
                setTimeout(afroRemoveContractGate, 500);
              })
              .catch(function (e) {
                btn.disabled = false; btn.style.opacity = '1'; btn.style.cursor = 'pointer';
                msg.style.color = '#ff9b9b'; msg.textContent = (e && e.message) || 'Onay başarısız, tekrar deneyin.';
              });
          };
        }
        function afroSupplierContractGate() {
          var tok = localStorage.getItem('pazar_session_token');
          if (!tok) { afroRemoveContractGate(); return; }
          // Rol henüz bilinmiyorsa çek (aynı cache paylaşılır)
          if (_cachedUserRole === null) {
            afroApi('/user/me')
              .then(function (user) { _cachedUserRole = user.role || ''; })
              .catch(function () { _cachedUserRole = ''; });
            return;
          }
          if (_cachedUserRole !== 'esnaf' && _cachedUserRole !== 'supplier') {
            afroRemoveContractGate(); return;
          }
          if (_afroContractState === null) {
            _afroContractState = 'checking';
            afroApi('/supplier/contract-status')
              .then(function (st) {
                if (st && st.accepted) { _afroContractState = 'ok'; afroRemoveContractGate(); }
                else { _afroContractInfo = (st && st.contract) || null; _afroContractState = 'blocked'; afroShowContractGate(); }
              })
              .catch(function () { _afroContractState = null; });
            return;
          }
          if (_afroContractState === 'blocked') { afroShowContractGate(); }
        }

        // ============================================================
        // ADMIN — TEDARİKÇİ SÖZLEŞMESİ YÜKLEME PANELİ
        // Aktif sözleşmeyi gösterir, yeni PDF + sürüm yükler, onay
        // loglarını (kim/ne zaman/IP) listeler.
        // ============================================================
        function afroUploadPdf(file) {
          var fd = new FormData();
          fd.append('file', file);
          var h = {};
          var tk = afroAdminToken();
          if (tk) h['Authorization'] = 'Bearer ' + tk;
          return fetch('https://afrogida.com.tr/api/admin/upload-pdf', { method: 'POST', headers: h, body: fd })
            .then(function (r) {
              return r.text().then(function (t) {
                var j = null; try { j = t ? JSON.parse(t) : null; } catch (e) { j = null; }
                if (!r.ok) { throw new Error((j && j.detail) || ('Hata ' + r.status)); }
                return j;
              });
            });
        }
        function afroOpenContractAdmin() {

          // KURYE ÜST ÇUBUĞU: HER SAYFADA çalışır (admin/müşteri ayrımı yok).

        // rota değişiminde/DOM güncellemesinde ANINDA boya (600ms boşluğu kapat)
        var rafPending = false;
        function scheduleTick() {
          if (rafPending) return;
          rafPending = true;
          requestAnimationFrame(function () { rafPending = false; tick(); });
        }

        tick();
        setInterval(tick, 600);
        window.addEventListener('resize', tick);
        // KAYDIRMA sırasında ANINDA yeniden boya. React iç scroll container'da
        // kaydırınca çipleri yeniden çiziyor; capture=true ile o iç kaydırmaları
        // da yakalarız. rAF ile throttle -> uygulamanın turuncu/yeşil arası
        // KISA PARLAMASI (flicker) neredeyse görünmez olur.
        window.addEventListener('scroll', scheduleTick, { passive: true, capture: true });

        // DOM her değiştiğinde (sayfa geçişi = yeni katmanlar) hemen boya.
        // ÖNEMLİ: Modallar/popuplar (Şikayet & Öneri, "Evlere Servisimiz Olan
        // Mahalleler" vb.) #root DIŞINDA ayrı bir PORTAL katmanına render edilir.

        // ancak 600ms'lik periyodik tick'te yapılır -> mahalle çiplerinin yeşilden
        // beyaz-cama geçişi ~500ms GÖRÜNÜR (flash). Çözüm: document.body'yi izle,
        // böylece portal katmanı eklenince ANINDA boyanır (flash olmaz).
        // NOT: setAttribute(GLASS_ATTR) yalnızca ATTRIBUTE değiştirir; observer
        // childList/subtree (node ekle/çıkar) izlediği için sonsuz döngü OLMAZ.
        try {
          var mo = new MutationObserver(scheduleTick);
          var startObserve = function () {
            var body = document.body;
            if (body) mo.observe(body, { childList: true, subtree: true });
            else setTimeout(startObserve, 100);
          };
          startObserve();
        } catch (e) {}

        // SPA rota değişimlerini de yakala.
        // scheduleTick() → RAF (~16ms) çok erken ateşleniyor: React geçiş animasyonu
        // henüz tamamlanmadı, eski + yeni ekran DOM'da aynı anda var.
        // scheduleNavTick() 300ms + 700ms'lik ek gecikmeli tick'ler ekler; animasyon
        // (~250ms) bittikten SONRA doğru ekranı yakalamak için ek sigorta sağlar.
        function scheduleNavTick() {
          scheduleTick();                          // anında (tema vb. hızlı işler için)
          setTimeout(tick, 300);                  // animasyon biter bitmez enjekte et
          setTimeout(tick, 700);                  // ağır cihazlarda geç render için
        }
        try {
          var _ps = history.pushState;
          history.pushState = function () { _ps.apply(this, arguments); scheduleNavTick(); };
          var _rs = history.replaceState;
          history.replaceState = function () { _rs.apply(this, arguments); scheduleNavTick(); };
          window.addEventListener('popstate', scheduleNavTick);
        } catch (e) {}
      })();

    <!-- ================================================================
         ÜRÜN SEÇİM PANELİ MODÜLÜ (afro_panel_module.js)
         ================================================================ -->
    <script>
/* ================================================================
   ÜRÜN SEÇİM PANELİ (Getir/Yemeksepeti tarzı alt-sayfa / bottom-sheet)
   ----------------------------------------------------------------
   AMAÇ: Bir ürüne tıklanınca eskiden /product/{id} BİLGİ sayfasına
   gidiliyordu (sadece fiyat + üretici notu; seçim/sepet yok). Bunun
   yerine sayfanın ÜSTÜNDE bir panel açılır:
     - adet seçimi (Kg -> 0.5 adım, adet -> 1 adım)
     - özelleştirilebilir üründe malzeme/seçenek grupları + not
     - "Sepete Ekle" butonu
   ----------------------------------------------------------------
   MİMARİ (derlenmiş Expo bundle'a müdahale edemediğimiz için):
   * ADET: uygulamanın KENDİ "Ekle"/"+"/"-" butonları programatik
     tıklanır. Böylece React state (G) + alt "Siparişi Tamamla"
     çubuğu doğru güncellenir, sepet/afro_basket tutarlı kalır.
   * ÖZELLEŞTİRME: uygulamanın CSel state'ine yazamadığımız için
     seçimler 'afro_custom' localStorage anahtarına yazılır; sipariş
     POST /api/orders isteği araya girilip her item'a selected_options
     + note enjekte edilir. Backend fiyatı ÜRÜN TANIMINDAN yeniden
     hesapladığı için (client'a güvenmiyor) para açısından güvenlidir.
   ================================================================ */
(function () {
  if (window.__afroPanel) return;
  window.__afroPanel = 1;

  var CUSTOM_KEY = 'afro_custom';
  var BASKET_KEY = 'afro_basket';
  var DELIVERY_KEY = 'afro_delivery_prefs';

  /* ---------- yardımcılar ---------- */
  function jget(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function jset(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function basket() { return jget(BASKET_KEY, {}) || {}; }
  function customs() { return jget(CUSTOM_KEY, {}) || {}; }
  function deliveryPrefs() { return jget(DELIVERY_KEY, {}) || {}; }
  function saveDeliveryPrefs(p) { jset(DELIVERY_KEY, p); }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function isDark() { try { return document.documentElement.classList.contains('afro-dark'); } catch (e) { return false; } }
  function accent() { return isDark() ? 'rgb(20,182,126)' : 'rgb(251,140,60)'; }
  function stepFor(unit) { return /kg/i.test(String(unit || '')) ? 0.5 : 1; }
  function fmtTL(n) {
    try { return new Intl.NumberFormat('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(Number(n || 0)); }
    catch (e) { return Number(n || 0).toFixed(2); }
  }
  function fmtQty(n) { var s = (Math.round(Number(n) * 100) / 100).toString(); return s; }
  function basePrice(p) { return Number((p && (p.price != null ? p.price : (p.gel_al_price != null ? p.gel_al_price : p.eve_servis_price))) || 0); }

  /* ---------- ürün önbelleği ---------- */
  window.__afroProducts = window.__afroProducts || {};   // id -> product
  function cacheProducts(arr) {
    if (!Array.isArray(arr)) return;
    arr.forEach(function (p) { if (p && p.id) window.__afroProducts[p.id] = p; });
  }
  function productNames() {
    var s = {};
    Object.keys(window.__afroProducts).forEach(function (id) {
      var n = (window.__afroProducts[id].name || '').trim();
      if (n) s[n] = id;
    });
    return s;
  }
  async function ensureProducts() {
    if (Object.keys(window.__afroProducts).length) return;
    try {
      var tok = localStorage.getItem('pazar_session_token');
      var mkt = localStorage.getItem('selected_market_name') || '';
      var r = await fetch(location.origin + '/api/products' + (mkt ? ('?market=' + encodeURIComponent(mkt)) : ''),
        { headers: tok ? { Authorization: 'Bearer ' + tok } : {} });
      var j = await r.json();
      cacheProducts(Array.isArray(j) ? j : (j.products || j.items || []));
    } catch (e) {}
  }

  /* ================================================================
     FETCH SARMALAYICI: (a) ürün listelerini önbelleğe al,
     (b) sipariş POST'una özelleştirmeleri enjekte et.
     ================================================================ */
  (function () {
    var prev = window.fetch;
    if (typeof prev !== 'function') return;
    function urlOf(input) { try { return typeof input === 'string' ? input : (input && input.url) || ''; } catch (e) { return ''; } }

    window.fetch = function (input, init) {
      var url = urlOf(input);
      var method = (init && init.method ? init.method : (input && input.method) || 'GET').toString().toUpperCase();

      // (b) SİPARİŞ: POST /api/orders VE /api/payments/init -> item'lara
      //     afro_basket (adet) + afro_custom (seçenek/not) enjekte et.
      //     Sepet çubuğu gerçekte /payments/init kullanıyor; qty native G'den,
      //     selected_options native CSel'den geliyordu -> bizim panelimizin
      //     seçimleri faturaya HİÇ yansımıyordu. Artık afro_basket+afro_custom
      //     TEK doğruluk kaynağı; backend fee'yi üründen yeniden hesaplar (güvenli).
      try {
        if (method === 'POST' && /\/api\/(orders|payments\/init)(\?|$)/.test(url) && !/\/admin\//.test(url) && init && typeof init.body === 'string') {
          var body = JSON.parse(init.body);
          // KURYE: eve servis siparişleri pazar (market) ile eşleşsin diye
          // seçili pazar adını gövdeye enjekte et. Backend order kaydına
          // market_name yazar; kurye kendi pazarının siparişlerini görür.
          try {
            var _mkt = localStorage.getItem('selected_market_name') || '';
            if (_mkt && !body.market_name) {
              body.market_name = _mkt;
              init = Object.assign({}, init, { body: JSON.stringify(body) });
            }
          } catch (e) {}
          var items = body.items || body.cart_items;
          if (Array.isArray(items)) {
            var cs = customs();
            var bk = basket();
            items.forEach(function (it) {
              var id = it && (it.id || it.product_id);
              if (!id) return;
              // Adet: afro_basket yetkili (panelde değiştirilen adet native G
              // stale kalsa bile doğru tahsil edilsin).
              if (bk[id] != null && Number(bk[id]) > 0) { it.qty = Number(bk[id]); it.quantity = Number(bk[id]); }
              // Seçenek/not: afro_custom yetkili (panel native editörü değiştirir).
              var c = cs[id];
              if (c) {
                it.selected_options = (c.selected_options && c.selected_options.length) ? c.selected_options : [];
                if (c.note && c.note.trim()) { it.note = c.note; it.customization_note = c.note; }
              }
            });
            init = Object.assign({}, init, { body: JSON.stringify(body) });
          }
          // TESLİMAT TERCİHLERİ: afro_delivery_prefs → sipariş gövdesine enjekte et.
          // delivery_note ve no_bell her ödeme yöntemi için geçerli.
          // leave_at_door yalnızca /api/payments/init (online ödeme) için gönderilir;
          // backend kapıda ödeme siparişlerinde zaten false'a zorlar.
          try {
            var dp = deliveryPrefs();
            if (dp.note && dp.note.trim()) body.delivery_note = dp.note.trim().slice(0, 500);
            if (dp.no_bell) body.no_bell = true;
            if (dp.leave_at_door) body.leave_at_door = true;
            init = Object.assign({}, init, { body: JSON.stringify(body) });
          } catch (e2) {}
        }
      } catch (e) { /* sipariş enjeksiyonu hata verirse orijinal gövde gider */ }

      // (c) KUPON DOĞRULAMA: POST /api/coupons/validate -> total'ı afro_basket'ten
      //     yeniden hesapla. Bundle, total'ı kendi iç React state'inden (G) gönderir;
      //     sepette adet overlay ile değiştirildiğinde G bayat kalır -> ekran 1000₺+
      //     gösterirken API'ye eski (düşük) tutar gider ve "Minimum sipariş tutarı"
      //     hatası çıkar. afro_basket + ürün fiyatı + seçenek ücretleri TEK doğruluk
      //     kaynağıdır (sipariş de zaten böyle tahsil ediliyor).
      try {
        if (method === 'POST' && /\/api\/coupons\/validate(\?|$)/.test(url) && init && typeof init.body === 'string') {
          var cbody = JSON.parse(init.body);
          var cbk = basket();
          var cgrand = 0, callKnown = true;
          Object.keys(cbk).forEach(function (id) {
            var q = Number(cbk[id] || 0); if (q <= 0) return;
            var upx = unitPriceOf(id, isCartPage() ? findCartRow(id) : null);
            if (!(upx > 0)) { callKnown = false; return; }
            cgrand += (upx + optExtraFor(id)) * q;
          });
          cgrand = Math.round(cgrand * 100) / 100;
          if (cgrand > 0) {
            // Tüm ürün fiyatları biliniyorsa gerçek tutarla DEĞİŞTİR;
            // eksik fiyat varsa güvenli tarafta kal (tutarı asla düşürme).
            cbody.total = callKnown ? cgrand : Math.max(Number(cbody.total) || 0, cgrand);
            if (cbody.cart_total != null) cbody.cart_total = cbody.total;
            init = Object.assign({}, init, { body: JSON.stringify(cbody) });
          }
        }
      } catch (e) { /* kupon enjeksiyonu hata verirse orijinal gövde gider */ }

      var p = prev.call(this, input, init);

      // (a2) genel ayarları önbelleğe al (teslimat ücreti / eşikler için)
      try {
        if (method === 'GET' && /\/api\/settings(\?|$)/.test(url)) {
          p.then(function (resp) {
            try {
              resp.clone().json().then(function (j) {
                if (j && typeof j === 'object') window.__afroSettings = j;
              }).catch(function () {});
            } catch (e) {}
          }).catch(function () {});
        }
      } catch (e) {}

      // (a) ürün listesi yanıtını önbelleğe al
      try {
        if (method === 'GET' && /\/api\/products(\?|$)/.test(url) && !/\/products\/[^?]/.test(url)) {
          p.then(function (resp) {
            try {
              resp.clone().json().then(function (j) {
                cacheProducts(Array.isArray(j) ? j : (j && (j.products || j.items)) || []);
              }).catch(function () {});
            } catch (e) {}
          }).catch(function () {});
        }
        // sipariş başarılıysa özelleştirmeleri ve teslimat tercihlerini temizle
        if (method === 'POST' && /\/api\/(orders|payments\/init)(\?|$)/.test(url) && !/\/admin\//.test(url)) {
          p.then(function (resp) {
            try {
              if (resp && resp.ok) {
                localStorage.removeItem(CUSTOM_KEY);
                localStorage.removeItem(DELIVERY_KEY);
              }
            } catch (e) {}
          }).catch(function () {});
        }
      } catch (e) {}

      return p;
    };
  })();

  /* ================================================================
     NATİF ADET SÜRÜCÜSÜ: ürün kartındaki uygulamanın kendi
     "Ekle"/"+"/"-" butonlarını bulup programatik tıklar.
     ================================================================ */
  function fireClick(el) {
    if (!el) return false;
    var r = el.getBoundingClientRect();
    var o = { bubbles: true, cancelable: true, clientX: r.left + r.width / 2, clientY: r.top + r.height / 2, button: 0, pointerId: 1, pointerType: 'mouse' };
    try { el.dispatchEvent(new PointerEvent('pointerdown', o)); } catch (e) {}
    try { el.dispatchEvent(new PointerEvent('pointerup', o)); } catch (e) {}
    try { el.dispatchEvent(new MouseEvent('mousedown', o)); } catch (e) {}
    try { el.dispatchEvent(new MouseEvent('mouseup', o)); } catch (e) {}
    try { el.dispatchEvent(new MouseEvent('click', o)); } catch (e) {}
    return true;
  }
  // Kart içindeki "Ekle" butonu (henüz sepette olmayan ürün).
  function ekleBtn(card) {
    return Array.prototype.slice.call(card.querySelectorAll('*')).filter(function (e) {
      var t = (e.innerText || '').replace(/\s+/g, ' ').trim();
      return /Ekle$/.test(t) && t.length < 12;
    }).sort(function (a, b) { return a.querySelectorAll('*').length - b.querySelectorAll('*').length; })[0] || null;
  }
  // Stepper'ın DIŞ yuvarlak −/+ butonları (soldan sağa: [−, +]).
  function roundBtns(card) {
    return Array.prototype.slice.call(card.querySelectorAll('*')).filter(function (e) {
      var r = e.getBoundingClientRect(); var cs;
      try { cs = getComputedStyle(e); } catch (x) { return false; }
      var br = parseFloat(cs.borderTopLeftRadius) || 0;
      return r.width >= 30 && r.width <= 60 && r.height >= 30 && r.height <= 60 && br >= 12 && cs.cursor === 'pointer';
    }).sort(function (a, b) { return a.getBoundingClientRect().left - b.getBoundingClientRect().left; });
  }
  // Kartın GÖRÜNEN adedini oku (React state'in doğru yansıması; afro_basket
  // gecikmesine güvenmeyiz). "Ekle" görünüyorsa 0.
  function getNativeQty(card) {
    var e = ekleBtn(card);
    if (e && e.offsetParent !== null) return 0;
    var btns = roundBtns(card);
    if (btns.length < 2) return 0;
    var lx = btns[0].getBoundingClientRect().right;
    var rx = btns[btns.length - 1].getBoundingClientRect().left;
    var val = 0;
    Array.prototype.slice.call(card.querySelectorAll('*')).forEach(function (n) {
      if (n.children.length) return;
      var t = (n.textContent || '').trim();
      if (/^[0-9]+([.,][0-9]+)?$/.test(t)) {
        var cr = n.getBoundingClientRect(); var cx = cr.left + cr.width / 2;
        if (cx > lx - 4 && cx < rx + 4) val = parseFloat(t.replace(',', '.'));
      }
    });
    return val;
  }
  async function setNativeQty(card, id, unit, target) {
    if (!card) return 0;
    var guard = 0;
    if (getNativeQty(card) === 0 && target > 0) {
      var ek = ekleBtn(card);
      if (ek) { fireClick(ek); await wait(320); }
    }
    while (Math.abs(getNativeQty(card) - target) > 1e-6 && guard++ < 40) {
      var c = getNativeQty(card);
      var b = roundBtns(card);
      if (b.length < 2) break;
      var btn = c < target ? b[b.length - 1] : b[0];
      fireClick(btn);
      await wait(280);
      if (getNativeQty(card) === c) { await wait(300); if (getNativeQty(card) === c) break; } // ilerleme yok -> dur
    }
    return getNativeQty(card);
  }

  /* ================================================================
     SEPET STEPPER SÜRÜCÜSÜ: sepet satırındaki adet göstergesi bir DÜZ
     SAYI yaprağı; −/+ butonları ise ikon-glyph (cursor:pointer) elemanlar.
     roundBtns() bunları bulamıyordu (genişlik/köşe kriteri tutmuyor); bu
     yüzden setNativeQty sepette çalışmıyor, adet native yeniden-çizime
     kadar (~3-4sn) gecikiyordu. Aşağıdaki bulucu sayı yaprağını ve onu
     saran −/+ pointer elemanlarını konuma göre bulur -> sentetik tık ile
     uygulamanın KENDİ state'ini anında sürer (kanıtlandı: tık -> afro_basket
     ve ara toplam anında güncelleniyor, kampanya indirimi native uygulanıyor).
     ================================================================ */
  function cartStepper(row) {
    if (!row) return null;
    var leaves = Array.prototype.slice.call(row.querySelectorAll('*')).filter(function (e) {
      return e.children.length === 0 && (e.textContent || '').trim();
    });
    var numLeaf = null;
    for (var i = 0; i < leaves.length; i++) {
      if (/^[0-9]+([.,][0-9]+)?$/.test((leaves[i].textContent || '').trim())) { numLeaf = leaves[i]; break; }
    }
    if (!numLeaf) return null;
    var nr = numLeaf.getBoundingClientRect();
    var pointers = Array.prototype.slice.call(row.querySelectorAll('*')).filter(function (e) {
      if (e.children.length > 1) return false;
      try { return getComputedStyle(e).cursor === 'pointer'; } catch (x) { return false; }
    });
    var minus = pointers.filter(function (e) { return e.getBoundingClientRect().right <= nr.left + 3; })
      .sort(function (a, b) { return b.getBoundingClientRect().left - a.getBoundingClientRect().left; })[0] || null;
    var plus = pointers.filter(function (e) { return e.getBoundingClientRect().left >= nr.right - 3; })
      .sort(function (a, b) { return a.getBoundingClientRect().left - b.getBoundingClientRect().left; })[0] || null;
    return { numLeaf: numLeaf, minus: minus, plus: plus, val: parseFloat((numLeaf.textContent || '').replace(',', '.')) };
  }
  // Sepet satırındaki native adedi hedefe sür (uygulamanın kendi +/- tıklanır).
  async function setCartQty(row, unit, target) {
    var guard = 0, st = cartStepper(row);
    while (st && Math.abs(st.val - target) > 1e-6 && guard++ < 60) {
      var btn = st.val < target ? st.plus : st.minus;
      if (!btn) break;
      fireClick(btn);
      await wait(120);
      var nv = cartStepper(row);
      if (!nv || nv.val === st.val) { await wait(220); nv = cartStepper(row); if (!nv || nv.val === st.val) break; }
      st = nv;
    }
    return st ? st.val : null;
  }

  /* ================================================================
     KART TESPİTİ: tıklanan ürün kartını ve ürünü çöz.
     ================================================================ */
  function findCard(node) {
    var n = node, names = productNames();
    for (var k = 0; k < 14 && n && n !== document.body; k++) {
      if (n.nodeType === 1) {
        var r = n.getBoundingClientRect();
        var t = (n.innerText || '');
        if (r.width >= 130 && r.width <= 340 && r.height >= 140 && r.height <= 360 && /₺/.test(t)) {
          // ürün adını bul (DOM sırasında ilk eşleşen ad = ürün, sonrası tedarikçi)
          var pid = matchProduct(n, names);
          if (pid) return { card: n, id: pid };
        }
      }
      n = n.parentElement;
    }
    return null;
  }
  function matchProduct(card, names) {
    var leaves = Array.prototype.slice.call(card.querySelectorAll('*')).filter(function (e) {
      return e.children.length === 0 && (e.textContent || '').trim();
    });
    for (var i = 0; i < leaves.length; i++) {
      var txt = (leaves[i].textContent || '').trim();
      if (names[txt] != null) return names[txt];
    }
    return null;
  }
  // Tıklama kartın hangi bölgesinde? 'control' (Ekle/stepper) mı 'body' mi?
  function regionOf(card, ev) {
    var r = card.getBoundingClientRect();
    // alt ~64px kontrol şeridi
    return (ev.clientY >= r.bottom - 66) ? 'control' : 'body';
  }

  /* ================================================================
     PANEL (bottom-sheet) DOM'u
     ================================================================ */
  var el = {};
  function buildPanel() {
    if (el.wrap) return;
    var wrap = document.createElement('div');
    wrap.id = 'afroPanelWrap';
    wrap.setAttribute('data-afro-panel', '1');
    wrap.innerHTML =
      '<div class="afroPanelBackdrop"></div>' +
      '<div class="afroPanelSheet" role="dialog" aria-modal="true">' +
        '<div class="afroPanelHandle"></div>' +
        '<button class="afroPanelClose" aria-label="Kapat">\u2715</button>' +
        '<div class="afroPanelBody"></div>' +
        '<div class="afroPanelFooter">' +
          '<div class="afroQty">' +
            '<button class="afroQtyBtn afroQtyMinus" aria-label="Azalt">\u2212</button>' +
            '<span class="afroQtyVal">1</span>' +
            '<button class="afroQtyBtn afroQtyPlus" aria-label="Artır">+</button>' +
          '</div>' +
          '<button class="afroAddBtn">Sepete Ekle</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(wrap);
    el.wrap = wrap;
    el.backdrop = wrap.querySelector('.afroPanelBackdrop');
    el.sheet = wrap.querySelector('.afroPanelSheet');
    el.body = wrap.querySelector('.afroPanelBody');
    el.close = wrap.querySelector('.afroPanelClose');
    el.qtyVal = wrap.querySelector('.afroQtyVal');
    el.minus = wrap.querySelector('.afroQtyMinus');
    el.plus = wrap.querySelector('.afroQtyPlus');
    el.add = wrap.querySelector('.afroAddBtn');

    el.backdrop.addEventListener('click', closePanel);
    el.close.addEventListener('click', closePanel);
    el.minus.addEventListener('click', function () { changeQty(-1); });
    el.plus.addEventListener('click', function () { changeQty(1); });
    el.add.addEventListener('click', commit);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && el.wrap && el.wrap.classList.contains('open')) closePanel(); });
  }

  var state = null; // {product, qty, step, sel:{title->choice}, note}

  function closePanel() {
    if (!el.wrap) return;
    el.wrap.classList.remove('open');
    state = null;
    setTimeout(function () { if (el.wrap && !el.wrap.classList.contains('open')) el.wrap.style.display = 'none'; }, 260);
  }

  function currentTotal() {
    if (!state) return 0;
    var d = 0;
    Object.keys(state.sel).forEach(function (t) { var c = state.sel[t]; if (c) d += Number(c.price_delta || 0); });
    return (basePrice(state.product) + d) * state.qty;
  }
  function refreshFooter() {
    if (!state) return;
    el.qtyVal.textContent = fmtQty(state.qty);
    el.add.textContent = (state.existing ? 'Güncelle' : 'Sepete Ekle') + ' \u00B7 \u20BA' + fmtTL(currentTotal());
    var a = accent();
    el.add.style.background = a;
    [el.plus, el.minus].forEach(function (b) { b.style.color = a; b.style.borderColor = a; });
  }
  function changeQty(dir) {
    if (!state) return;
    var q = state.qty + dir * state.step;
    if (q < state.step) q = state.step;
    state.qty = Math.round(q * 100) / 100;
    refreshFooter();
  }

  function renderBody() {
    var p = state.product, a = accent();
    var h = '';
    h += '<div class="afroPName">' + escapeHtml(p.name || 'Ürün') + '</div>';
    var sub = escapeHtml((p.supplier_group || '') + '');
    h += '<div class="afroPPrice">\u20BA' + fmtTL(basePrice(p)) + '<span class="afroPUnit"> / ' + escapeHtml(p.unit || '') + '</span></div>';
    if (p.description) h += '<div class="afroPDesc">' + escapeHtml(p.description) + '</div>';
    var groups = (p.customization_options || []).filter(function (g) { return g && (g.choices || []).length; });
    // "İstemiyorum" tarzı seçenekleri her grubun EN ALTINA taşı (kararlı sıralama).
    groups.forEach(function (g) {
      g.choices = (g.choices || []).slice().sort(function (a, b) {
        return (/istemi/i.test(a.label || '') ? 1 : 0) - (/istemi/i.test(b.label || '') ? 1 : 0);
      });
    });
    groups.forEach(function (g, gi) {
      h += '<div class="afroGroup"><div class="afroGroupTitle">' + escapeHtml(g.title || ('Seçenek ' + (gi + 1))) + '</div>';
      (g.choices || []).forEach(function (c, ci) {
        var pd = Number(c.price_delta || 0);
        var extra = pd > 0 ? '<span class="afroChoiceDelta">+\u20BA' + fmtTL(pd) + '</span>' : (pd < 0 ? '<span class="afroChoiceDelta">\u2212\u20BA' + fmtTL(Math.abs(pd)) + '</span>' : '');
        h += '<label class="afroChoice" data-g="' + gi + '" data-c="' + ci + '">' +
             '<span class="afroRadio"></span>' +
             '<span class="afroChoiceLabel">' + escapeHtml(c.label || '') + '</span>' + extra + '</label>';
      });
      h += '</div>';
    });
    if (p.customization_note_enabled) {
      var lbl = p.customization_note_label || 'Not ekleyin (opsiyonel)';
      h += '<div class="afroGroup"><div class="afroGroupTitle">' + escapeHtml(lbl) + '</div>' +
           '<textarea class="afroNote" rows="2" placeholder="' + escapeHtml(lbl) + '"></textarea></div>';
    }
    el.body.innerHTML = h;

    // seçenekleri bağla
    el.body.querySelectorAll('.afroChoice').forEach(function (row) {
      row.addEventListener('click', function (ev) {
        ev.preventDefault();
        var gi = +row.getAttribute('data-g'), ci = +row.getAttribute('data-c');
        var g = groups[gi], c = g.choices[ci];
        state.sel[g.title || ('__g' + gi)] = { title: g.title || '', label: c.label || '', price_delta: Number(c.price_delta || 0) };
        // aynı gruptaki tüm satırların seçimini güncelle
        el.body.querySelectorAll('.afroChoice[data-g="' + gi + '"]').forEach(function (r2) { r2.classList.remove('sel'); });
        row.classList.add('sel');
        refreshFooter();
      });
    });
    var noteEl = el.body.querySelector('.afroNote');
    if (noteEl) { noteEl.value = state.note || ''; noteEl.addEventListener('input', function () { state.note = noteEl.value; }); }

    // varsayılan seçim: price_delta 0 / "İstemiyorum" varsa onu, yoksa ilk seçenek
    groups.forEach(function (g, gi) {
      var key = g.title || ('__g' + gi);
      var chosen = state.sel[key];
      var idx = -1;
      if (chosen) {
        (g.choices || []).forEach(function (c, ci) { if ((c.label || '') === chosen.label) idx = ci; });
      }
      if (idx < 0) {
        // Varsayılan: "İstemiyorum" (varsa); yoksa gruptaki EN ALTTAKİ seçenek.
        (g.choices || []).forEach(function (c, ci) { if (/istemi/i.test(c.label || '')) idx = ci; });
        if (idx < 0) idx = (g.choices || []).length - 1;
        if (idx < 0) idx = 0;
        var c0 = g.choices[idx];
        state.sel[key] = { title: g.title || '', label: c0.label || '', price_delta: Number(c0.price_delta || 0) };
      }
      var row = el.body.querySelector('.afroChoice[data-g="' + gi + '"][data-c="' + idx + '"]');
      if (row) row.classList.add('sel');
    });
    refreshFooter();
  }

  function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]; }); }

  async function openPanel(id) {
    buildPanel();
    await ensureProducts();
    var p = window.__afroProducts[id];
    if (!p) { // önbellekte yoksa tek ürünü çek
      try {
        var tok = localStorage.getItem('pazar_session_token');
        var r = await fetch(location.origin + '/api/products/' + id, { headers: tok ? { Authorization: 'Bearer ' + tok } : {} });
        p = await r.json(); if (p && p.id) window.__afroProducts[p.id] = p;
      } catch (e) {}
    }
    if (!p) return;
    var b = basket();
    var existing = Number(b[id] || 0) > 0;
    var step = stepFor(p.unit);
    var saved = customs()[id] || {};
    var sel = {};
    (saved.selected_options || []).forEach(function (o) { sel[o.title || ''] = { title: o.title || '', label: o.label || '', price_delta: Number(o.price_delta || 0) }; });
    state = {
      product: p,
      step: step,
      qty: existing ? Number(b[id]) : step,
      existing: existing,
      sel: sel,
      note: saved.note || ''
    };
    renderBody();
    el.wrap.style.display = 'block';
    // stil temasını uygula
    applyThemeVars();
    requestAnimationFrame(function () { el.wrap.classList.add('open'); });
  }

  function applyThemeVars() {
    var dark = isDark();
    el.sheet.style.background = dark ? 'rgb(14,22,17)' : '#ffffff';
    el.sheet.style.color = dark ? '#eafaf2' : '#1a1a1a';
  }

  async function commit() {
    if (!state) return;
    var p = state.product, id = p.id;
    // özelleştirmeleri sakla
    var selArr = Object.keys(state.sel).map(function (k) { return state.sel[k]; }).filter(Boolean);
    var cs = customs();
    if (selArr.length || (state.note && state.note.trim())) {
      cs[id] = { selected_options: selArr, note: (state.note || '').trim() };
    } else { delete cs[id]; }
    jset(CUSTOM_KEY, cs);

    el.add.disabled = true;
    var oldTxt = el.add.textContent; el.add.textContent = 'Ekleniyor...';

    // (1) HER ZAMAN afro_basket'e yaz (kalıcılık garanti; uygulama
    //     ekran focus/mount'ta afro_basket'ten okuyup state'e alır).
    writeBasket(id, state.qty);

    // (2) Kart görünürse uygulamanın KENDİ Ekle/+/− butonlarını programatik
    //     sürerek React state'ini CANLI güncelle (alt "Siparişi Tamamla"
    //     çubuğu anında çıksın). Native sürücü çalışmazsa (1)'deki yazı
    //     bir sonraki focus/mount'ta okunur; her iki yol da kapsanır.
    if (isCartPage()) {
      // Sepette: uygulamanın KENDİ stepper'ını (ikon-glyph −/+) sentetik
      // tıklayarak native adedi hedefe sür. Bu, React state'ini anında
      // günceller -> stepper sayısı, alt yazı, satır + ara/genel toplam ve
      // kampanya indirimi HEPSİ native olarak ve anında tutarlı olur.
      var row = findCartRow(id);
      if (row) { try { await setCartQty(row, p.unit, state.qty); } catch (e) {} }
      try { await syncCartRow(id); } catch (e) {}
      // Görsel emniyet: native tık kaçarsa kısa süre kaynak-doğrusundan yama.
      burstPatchCart();
    } else {
      var found = findCardById(id);
      if (found) { try { await setNativeQty(found.card, id, p.unit, state.qty); } catch (e) {} }
    }

    el.add.disabled = false; el.add.textContent = oldTxt;
    closePanel();
  }

  // afro_basket'i {id:qty} formatında güncelle + meta'yı tazele.
  // (Uygulama parseBasket ile bu objeyi okur; boşsa anahtarı siler.)
  function writeBasket(id, qty) {
    var b = basket();
    if (Number(qty) > 0) b[id] = Number(qty); else delete b[id];
    jset(BASKET_KEY, b);
    try {
      jset('afro_basket_meta', { updatedAt: Date.now(), dayKey: new Date().toISOString().slice(0, 10) });
    } catch (e) {}
    return b;
  }

  function findCardById(id) {
    var name = (window.__afroProducts[id] || {}).name;
    if (!name) return null;
    var names = {}; names[name] = id;
    var cards = document.querySelectorAll('div');
    for (var i = 0; i < cards.length; i++) {
      var c = cards[i];
      var r = c.getBoundingClientRect();
      if (r.width >= 130 && r.width <= 340 && r.height >= 140 && r.height <= 360 && /₺/.test(c.innerText || '')) {
        if (matchProduct(c, names) === id) return { card: c, id: id };
      }
    }
    return null;
  }

  /* ================================================================
     SEPET (/cart) ENTEGRASYONU
     Sepetteki native "Özelleştir" düğmesini bizim panele bağlar.
     Panel kaydedince (Güncelle) afro_custom yazılır (sipariş POST'u
     zaten afro_custom'dan beslenir -> tahsilat DAİMA doğru) ve ek
     olarak native chip'ler/not/adet best-effort programatik sürülerek
     sepetin GÖSTERİMİ (satır + toplam) senkronlanır. Panelimiz grup
     başına TEK seçim yapar (radyo). Sürüş başarısız olsa bile para
     güvenli kalır; sadece gösterim güncellenmeyebilir.
     ================================================================ */
  function isCartPage() { return /\/cart(\?|$)/.test(location.pathname); }
  function gcs(e) { try { return getComputedStyle(e); } catch (x) { return {}; } }
  function normTxt(s) { return (s || '').replace(/\s+/g, ' ').trim(); }

  function cartToggleFromNode(node) {
    var n = node;
    for (var k = 0; k < 5 && n && n !== document.body; k++) {
      if (n.nodeType === 1) {
        var t = normTxt(n.textContent);
        if (t === 'Özelleştir' || t === 'Kapat') return n;
      }
      n = n.parentElement;
    }
    return null;
  }
  function cartRowId(node) {
    var names = productNames();
    var n = node;
    for (var k = 0; k < 14 && n && n !== document.body; k++) {
      if (n.nodeType === 1) { var pid = matchProduct(n, names); if (pid) return pid; }
      n = n.parentElement;
    }
    return null;
  }
  function findCartRow(id) {
    var name = (window.__afroProducts[id] || {}).name;
    if (!name) return null;
    var all = document.querySelectorAll('div'), best = null, bestH = 1e9;
    for (var i = 0; i < all.length; i++) {
      var d = all[i], r = d.getBoundingClientRect();
      if (r.width < 180 || r.height < 56 || r.height > 900) continue;
      var txt = d.innerText || '';
      if (txt.indexOf(name) === -1) continue;
      // Ürünün KENDİ satırı olmalı: birim fiyat kalıbı ("Kg x ₺..") içermeli ve
      // TEK bir ürünü sarmalı. Özelleştir'i olmayan (seçeneksiz) ürünlerde eski
      // /Özelleştir|Kapat/ koşulu komşu satırı da içeren büyük kabı seçip yanlış
      // birim fiyat okumaya yol açıyordu; bunun yerine "x ₺" kalıbını sayıyoruz.
      var mUnit = txt.match(/[x×]\s*₺/g);
      if (!mUnit || mUnit.length !== 1) continue;
      if (r.height < bestH) { bestH = r.height; best = d; }
    }
    return best;
  }
  function findToggleInRow(row) {
    if (!row) return null;
    var els = row.querySelectorAll('*');
    for (var i = 0; i < els.length; i++) {
      var t = normTxt(els[i].textContent);
      if ((t === 'Özelleştir' || t === 'Kapat') && els[i].children.length <= 1) return els[i];
    }
    return null;
  }
  function findChipInRow(row, wantLabel) {
    if (!row) return null;
    var target = normTxt(wantLabel);
    if (!target) return null;
    var els = row.querySelectorAll('*');
    for (var i = 0; i < els.length; i++) {
      var e = els[i];
      if (e.children.length > 2) continue;
      var t = normTxt(e.textContent);
      if (t === target || t.indexOf(target + ' ') === 0 || t.indexOf(target + '+') === 0) {
        var c = e;
        for (var k = 0; k < 4 && c && c !== row; k++) {
          if (gcs(c).cursor === 'pointer') return c;
          c = c.parentElement;
        }
        return e;
      }
    }
    return null;
  }
  function setNativeInput(ta, val) {
    try {
      var proto = window.HTMLTextAreaElement && window.HTMLTextAreaElement.prototype;
      var desc = proto && Object.getOwnPropertyDescriptor(proto, 'value');
      if (desc && desc.set) desc.set.call(ta, val); else ta.value = val;
      ta.dispatchEvent(new Event('input', { bubbles: true }));
      ta.dispatchEvent(new Event('change', { bubbles: true }));
    } catch (e) {}
  }
  // NOT: Artık native React çiplerini sentetik tıklamayla SÜRMÜYORUZ (güvenilmez
  // ve "olmadı" hatasının kaynağıydı). Seçimler afro_custom'da tutulur; gösterim
  // patchCartTotals (birikmeyen toplam düzeltme) + injectOptSummary (kendi
  // kontrolümüzdeki özet satırı) ile yapılır. Bu fonksiyon yalnızca eski
  // çipli native editör açık kaldıysa onu KAPATIR (temizlik).
  async function syncCartRow(id) {
    try {
      if (!isCartPage()) return;
      var row = findCartRow(id);
      if (!row) return;
      var tgl = findToggleInRow(row);
      if (tgl && /Kapat/.test(normTxt(tgl.textContent))) { fireClick(tgl); }
    } catch (e) {}
  }

  // Sepet satırındaki adet (+/-) stepper'ının SATIRIN doğrudan çocuğu olan
  // kabını döndür (tıklama bu bölgeye düşerse native adet değişimine bırakılır).
  function stepperContainer(row) {
    var st = cartStepper(row);
    if (!st || !st.numLeaf) return null;
    var n = st.numLeaf;
    while (n && n.parentElement && n.parentElement !== row) n = n.parentElement;
    return (n && n.parentElement === row) ? n : null;
  }
  // Tıklama NOKTASINDAKI (x,y) sepet ürün satırını çöz. elementFromPoint çoğu
  // zaman tüm "Sepetim" kabını döndürdüğü için DOM'dan ada göre değil, her
  // ürünün satır dikdörtgenini test ederek buluruz; noktayı içeren EN KÜÇÜK
  // (en özgül) satırın ürününü döndür.
  function cartRowIdAtPoint(x, y) {
    var b = basket(), bestId = null, bestArea = 1e18;
    Object.keys(b).forEach(function (id) {
      if (!(Number(b[id]) > 0)) return;
      var row = findCartRow(id);
      if (!row) return;
      var r = row.getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) {
        var area = r.width * r.height;
        if (area < bestArea) { bestArea = area; bestId = id; }
      }
    });
    return bestId;
  }
  // (x,y) satırdaki adet (+/-) stepper bölgesine mi düşüyor?
  function pointInStepper(row, x, y) {
    var st = cartStepper(row);
    if (!st || !st.numLeaf) return false;
    var nr = st.numLeaf.getBoundingClientRect();
    var lo = st.minus ? st.minus.getBoundingClientRect().left : nr.left;
    var hi = st.plus ? st.plus.getBoundingClientRect().right : nr.right;
    return (x >= lo - 6 && x <= hi + 6 && y >= nr.top - 10 && y <= nr.bottom + 10);
  }
  // Sepetteki native "Özelleştir" pilini gizle. Artık seçim menüsü ürün
  // satırına tıklanınca açılıyor; ayrı düğmeye gerek yok. (Her tick yeniden
  // çalışır; native yeniden çizse de tekrar gizlenir.)
  function hideOzellestirButtons() {
    try {
      var all = document.querySelectorAll('*');
      for (var i = 0; i < all.length; i++) {
        var e = all[i];
        if (e.closest && e.closest('[data-afro-panel]')) continue;
        var t = normTxt(e.textContent);
        if (!/Özelleştir/.test(t) || t.length > 16) continue;
        // pointer (tıklanabilir) olan en dış küçük kabı bul ve gizle
        var host = e, cand = e;
        for (var k = 0; k < 4 && cand && cand !== document.body; k++) {
          var ct = normTxt(cand.textContent);
          if (!/Özelleştir/.test(ct) || ct.length > 16) break;
          try { if (getComputedStyle(cand).cursor === 'pointer') host = cand; } catch (x) {}
          cand = cand.parentElement;
        }
        if (host.style.display !== 'none') host.style.display = 'none';
        host.setAttribute('data-afro-ozhidden', '1');
      }
    } catch (e) {}
  }

  /* ================================================================
     TIKLAMA YAKALAMA (capture): ürün kartına / sepet ürün satırına
     tıklamayı yakala, native davranışı engelle, paneli aç.
     ================================================================ */
  function onClickCapture(ev) {
    try {
      // Sentetik (programatik) tıklamaları yok say -> re-entrancy önle.
      // (syncCartRow/setNativeQty'nin fireClick'leri buraya düşmesin.)
      if (!ev.isTrusted) return;
      if (ev.target && ev.target.closest && ev.target.closest('[data-afro-panel]')) return; // panelin kendisi

      // SEPET: native "Özelleştir"/"Kapat" -> bizim panel.
      // Bir sepet toggle'ına tıklandıysa native inline editörü ASLA açtırma;
      // her koşulda engelle, ürünü çözüp kendi panelimizi aç (önbellek boşsa

      var e = all[i];
      if (e.children.length !== 0) continue;
      var t = (e.textContent || '').trim();
      if (t === 'Eve Servis Saati') eve = true;
      // DİKKAT: "Minimum" TAM etiket olarak eşleşmeli ("Minimum Sipariş Tutarı").
      // /^Minimum/ kullanmak alttaki "Minimum sipariş tutarına ulaşmak için X TL
      // daha ürün eklemelisiniz." uyarısını da yakalıyor, valueLeafFor onun için
      // Toplam'ın ₺ değerini döndürüyor ve minimum YANLIŞ okunuyordu
      // (ör. min=420 sanılıp Kalan Tutar 130 yerine 50 yazılıyordu).
      if (/^Ara Toplam$/i.test(t) || /^Toplam$/i.test(t) || /^Teslimat$/i.test(t) ||
          /^Kalan Tutar$/i.test(t) || /^İndirim$/i.test(t) || /^Minimum Sipariş Tutarı$/i.test(t)) {
        labels.push({ leaf: e, t: t });
      }
    }
    if (!labels.length) return;
    var st = window.__afroSettings || {};
    // 1) minimum sipariş tutarını oku (Kalan Tutar hesabı için)
    var minimum = null;
    labels.forEach(function (o) {
      if (!/^Minimum/i.test(o.t)) return;
      var vl = valueLeafFor(o.leaf); if (!vl) return;
      var v = parseTL(vl.textContent); if (v != null) minimum = v;
    });
    if (minimum == null) {
      var mn = Number(eve ? (st.min_delivery_amount != null ? st.min_delivery_amount : 0)
                          : (st.min_pickup_amount != null ? st.min_pickup_amount : 0));
      if (mn > 0) minimum = mn;
    }
    // 2) indirim (kupon) satırını oku — SAYFADAKİ TEK NEGATİF ₺ DEĞERİNİ tara.
    // FLICKER KÖK NEDENİ: eskiden İndirim etiketinden valueLeafFor ile okunuyordu;
    // valueLeafFor bazen İndirim yerine Toplam'ın ₺ değerini (ör. ₺1000) yakalıyor,
    // Toplam = grand+fee-1000 = ~100 hesaplanıyor, native hemen 1000 geri yazıyor
    // -> "100 <-> 1000" titremesi. Kupon indirimi özet kutusundaki TEK negatif ₺

    // Kupon yoksa negatif değer yoktur -> discount 0 kalır (doğru).
    var discount = 0;
    for (var di = 0; di < all.length; di++) {
      var de = all[di];
      if (de.children.length !== 0) continue;
      var dt = (de.textContent || '').trim();
      if (/^-\s*₺\s*[\d.,]+$/.test(dt)) { var dv = parseTL(dt); if (dv != null) { discount = Math.abs(dv); break; } }
    }
    // 3) teslimat ücretini AYARLARDAN hesapla (bundle ile birebir aynı kural)
    var feeBase = Number(st.delivery_fee != null ? st.delivery_fee : 40);
    var freeMin = Number(st.free_delivery_min_amount != null ? st.free_delivery_min_amount : 1000);
    var fee = (eve && grand > 0 && (freeMin <= 0 || grand < freeMin)) ? Math.max(0, feeBase) : 0;
    // 4) değerleri kaynak-doğrusundan yaz
    labels.forEach(function (o) {
      if (/^Minimum/i.test(o.t) || /^İndirim$/i.test(o.t)) return; // dokunma
      if (/^Teslimat$/i.test(o.t)) {
        var tl = valueLeafForX(o.leaf); if (!tl) return;
        var want = fee === 0 ? 'Ücretsiz' : ('₺' + fee.toFixed(2));
        if ((tl.textContent || '').trim() !== want) tl.textContent = want;
        return;
      }
      var vl = valueLeafFor(o.leaf); if (!vl) return;
      if (/^Kalan Tutar$/i.test(o.t)) {
        if (minimum != null) {
          var remMin = Math.max(0, Math.round((minimum - grand) * 100) / 100);
          setLeafAbs(vl, remMin);
          // KULLANICI İSTEĞİ: Kalan Tutar 0 ise (minimum sağlandı) satırı gizle.
          // GÜVENLİK: yalnız SADECE 'Kalan Tutar' değerini içeren KÜÇÜK satır
          // kapsayıcısını gizle. body/html'e veya 'Ara Toplam/Teslimat/Toplam/
          // Sepetim/Kupon/Sipariş' içeren BÜYÜK kapsayıcıya ASLA display:none
          // verme; aksi halde tüm sayfa kaybolur (kritik hata).
          try {
            var krow = o.leaf.parentElement, found = null;
            for (var ku = 0; ku < 5 && krow; ku++) { if (krow.contains(vl)) { found = krow; break; } krow = krow.parentElement; }
            if (found && found !== document.body && found !== document.documentElement) {
              var ftxt = (found.innerText || '');
              var big = ftxt.length > 40 || /Ara Toplam|Teslimat|Sepetim|Kupon|Sipari/i.test(ftxt);
              if (!big) { var wantD = (remMin <= 0) ? 'none' : ''; if (found.style.display !== wantD) found.style.display = wantD; }
            }
          } catch (ek) {}
        }
      } else if (/^Ara Toplam$/i.test(o.t)) {
        setLeafAbs(vl, grand);
      } else {                                            // Toplam
        setLeafAbs(vl, Math.max(0, Math.round((grand + fee - discount) * 100) / 100));
      }
    });
    // 5) Ücretsiz teslimat sayacı: "Ücretsiz teslimata ulaşmak için X TL daha ekle."
    // Bundle bu satırı eve servis + ürün varken HER ZAMAN render eder; görünürlüğünü
    // ve X değerini overlay yönetir (native er koşulu bayat kalabildiği için güvenilmez):
    // minimum SAĞLANDIYSA ve grand < freeMin ise göster (kalan = freeMin - grand),
    // aksi halde satırı gizle. Böylece min altındayken "minimum ürün ekleyin" uyarısıyla
    // çakışmaz, ücretsiz eşiğe ulaşınca sayaç kendiliğinden kaybolur.
    try {
      var showFree = eve && freeMin > 0 && grand < freeMin && (minimum == null || grand >= minimum);
      var remFree = Math.max(0, Math.round((freeMin - grand) * 100) / 100);
      for (var z = 0; z < all.length; z++) {
        var le = all[z];
        var lt = le.textContent || '';
        if (lt.indexOf('TL daha ekle') === -1) continue;
        // en iç (value) düğüm: hiçbir element-çocuğu bu metni içermiyorsa burasıdır
        var inner = true;
        for (var ci = 0; ci < le.children.length; ci++) {
          if ((le.children[ci].textContent || '').indexOf('TL daha ekle') !== -1) { inner = false; break; }
        }
        if (!inner) continue;
        // satır kapsayıcısını bul: "teslimata ula" (label) içeren en yakın üst düğüm
        var frow = le;
        for (var up = 0; up < 5 && frow; up++) {
          if ((frow.textContent || '').indexOf('teslimata ula') !== -1) break;
          frow = frow.parentElement;
        }
        if (!frow) frow = le.parentElement || le;
        if (showFree) {
          if (frow.style.display === 'none') frow.style.display = '';
          var wantFree = remFree.toFixed(2) + ' TL daha ekle.';
          if (lt.trim() !== wantFree) le.textContent = wantFree;
        } else {
          if (frow.style.display !== 'none') frow.style.display = 'none';
        }
      }
    } catch (e2) {}
    // 6) "Minimum sipariş tutarına ulaşmak için X TL daha ürün eklemelisiniz."
    //    uyarısındaki X'i de kaynak-doğrusundan yaz (native değer bayat kalabilir).
    try {
      if (minimum != null) {
        var rem2 = Math.max(0, Math.round((minimum - grand) * 100) / 100);
        var minMet = grand >= minimum;
        for (var z2 = 0; z2 < all.length; z2++) {
          var le2 = all[z2];
          if (le2.children.length !== 0) continue;
          var lt2 = le2.textContent || '';
          if (lt2.indexOf('TL daha ürün eklemelisiniz') === -1 || !/^Minimum/i.test(lt2)) continue;
          // BUG #2: minimum SAĞLANDIĞINDA native bu uyarıyı bayat bırakıp
          // "...için 0.00 TL daha..." gösteriyordu. Min sağlandıysa gizle,
          // sağlanmadıysa görünür yap + kalan tutarı kaynak-doğrusundan yaz.
          if (minMet) {
            if (le2.style.display !== 'none') le2.style.display = 'none';
          } else {
            if (le2.style.display === 'none') le2.style.display = '';
            var nlt2 = lt2.replace(/için\s*[\d.,]+\s*TL/, 'için ' + rem2.toFixed(2) + ' TL');
            if (nlt2 !== lt2) le2.textContent = nlt2;

  }
  // "N çeşit ürün • ₺X" başlığı TEK birleşik metin düğümü ("1 çeşit ürün • ₺50.00").
  // İçindeki ₺ değerini grand ile değiştir (sayı-etiketi metin içinde gömülü).
  function patchCesitHeaders(grand) {
    var g = '₺' + (Math.round((grand || 0) * 100) / 100).toFixed(2);
    var all = document.querySelectorAll('*');
    for (var i = 0; i < all.length; i++) {
      var e = all[i];
      if (e.children.length !== 0) continue;
      var t = e.textContent || '';
      if (t.indexOf('çeşit ürün') === -1 || !/₺\s*[\d.,]+/.test(t)) continue;
      var nt = t.replace(/₺\s*[\d.,]+/, g);
      if (nt !== t) e.textContent = nt;
    }
  }

  // ÜRÜNLER SAYFASI ALT BARI: /(tabs)/products sayfasındaki alttan çıkan
  // "Siparişi Tamamla ₺XX" çubuğunun toplamını seçim ek ücretlerini içerecek
  // şekilde düzelt. patchCartTotals() eskiden yalnızca /cart'ta özet/bar
  // yamalıyordu; ürünler sayfasındaki bar seçim ücretlerini yansıtmıyordu
  // (kullanıcı: "seçim tutarları sepete işlemiyor"). Yalnızca "Siparişi
  // Tamamla" ibaresini taşıyan çubuğu hedefleriz -> Kuponlar/Ödeme gibi
  // diğer sayfalardaki ₺ değerlerine ASLA dokunmaz (güvenli, dar kapsam).
  function patchOrderBar(grand) {

      var hosts = Array.prototype.slice.call(document.querySelectorAll('*')).filter(function (e) {
        var t = normTxt(e.textContent || '');
        if (!/Sipari[şs]i\s*Tamamla/i.test(t)) return false;
        if (e.children.length > 12) return false;

      });

          seen.push(l);

  }

  function patchCartTotals() {
    try {
      pruneStaleCustoms();
      var b = basket();
      var grand = 0, anyExtra = false, qtyDiff = false, onCart = isCartPage();
      if (onCart) { closeStrayNativeEditors(); hideOzellestirButtons(); }
      Object.keys(b).forEach(function (id) {
        var qty = Number(b[id] || 0); if (qty <= 0) return;
        var extra = optExtraFor(id); if (extra > 0) anyExtra = true;
        var row = onCart ? findCartRow(id) : null;
        var unit = unitPriceOf(id, row, extra);
        var line = Math.round((unit + extra) * qty * 100) / 100;
        grand += line;
        if (row) {
          row.setAttribute('data-afro-cartrow', '1');
          var pu = (window.__afroProducts[id] || {}).unit;
          // Özelleştirilebilir ürün satırını tıklanabilir göster (menü açılır).

            // (~1.6sn) native LİDER kabul edilir; afro_basket native değere uydurulur
            // (böylece adet gerçekten değişir, sipariş butonu kilidi açılır). Grace
            // dışında ESKİ davranış: afro_basket doğruluk kaynağı, native ona sürülür.
            if (Date.now() - (window.__afroInlineEdit || 0) < 1600) {

              patchStepperQty(row, nq, pu);
            } else {
            qtyDiff = true;
            patchStepperQty(row, qty, pu); // görsel köprü (sürüş bitene kadar)

              })(row, pu, qty);
            }
            }

          if (extra > 0) patchQtyLabel(row, qty, pu, extra, basePrice(prod));

          if (lineLeaf) setLeafAbs(lineLeaf, line);

      grand = Math.round(grand * 100) / 100;
      // MIN-GATE KAYNAĞI: bundle'daki checkout "Ara Toplam" (Tt) değişkeni bunu

  // Yoğun yeniden-yama penceresi: "Güncelle"den sonra HER ekran karesinde

  function burstPatchCart(ms) {

    if (_burstRunning) return;

  /* ================================================================
     TESLİMAT TERCİHLERİ PANELİ — Sepet sayfasında fixed overlay
     React'ın scroll container'ından bağımsız çalışsın diye position:fixed.

  function injectDeliveryInline() {
    // Sepet sayfası dışındaysa inline bloğu kaldır
    if (!isCartPage()) {
      var oldInline = document.getElementById('afro-delivery-inline');
      if (oldInline) oldInline.remove();

      var oldFab = document.getElementById('afro-delivery-fab');

    var labelColor = dark ? '#9ccbb8'                  : '#7a4520';
    var inputBg  = dark ? '#0a2518'                    : '#fff';
    var inputBorder = dark ? 'rgba(20,182,126,0.4)'    : '#f5c89e';

    var existing = document.getElementById('afro-delivery-inline');

      existing.style.background = bg;
      existing.style.borderColor = border;
      var hdr = existing.querySelector('#afro-dil-hdr');
      if (hdr) hdr.style.color = txtColor;
      var rows = existing.querySelectorAll('.afro-dil-row');
      for (var ri = 0; ri < rows.length; ri++) {
        rows[ri].style.background = inputBg;
        rows[ri].style.borderColor = inputBorder;
      }
      var labels = existing.querySelectorAll('.afro-dil-lbl');
      for (var li = 0; li < labels.length; li++) labels[li].style.color = txtColor;
      var sublbls = existing.querySelectorAll('.afro-dil-sub');
      for (var si = 0; si < sublbls.length; si++) sublbls[si].style.color = labelColor;
      var noteLblEl = existing.querySelector('#afro-dil-notelbl');
      if (noteLblEl) noteLblEl.style.color = labelColor;
      var noteEl = existing.querySelector('#afro-dil-note');
      if (noteEl) {
        noteEl.style.background = inputBg;
        noteEl.style.borderColor = inputBorder;
        noteEl.style.color = txtColor;
      }
      var chks = existing.querySelectorAll('input[type=checkbox]');
      for (var ci = 0; ci < chks.length; ci++) chks[ci].style.accentColor = accentCol;
      return;
    }

    // Sepet özet bölümünü bul: "Ara Toplam" metnini içeren kısa yaprak elemanı,
    // ardından full-width kapsayıcı section'ı al → teslimat bloğu ÖNÜNE girer
    // (Kuponlar ile Özet arasında kalır).
    var summaryAnchor = null;
    var allDivs = document.body.querySelectorAll('div');
    for (var i = 0; i < allDivs.length; i++) {
      var el2 = allDivs[i];
      var t2 = (el2.textContent || '').replace(/\s+/g, ' ').trim();
      // "Ara Toplam" her zaman sepet özet bölümünde geçer
      if (t2 !== 'Ara Toplam' && t2.indexOf('Ara Toplam') !== 0) continue;
      if (t2.length > 80) continue; // sadece yaprak etiket
      var r2 = el2.getBoundingClientRect();
      if (r2.top < 0) continue; // viewport dışı

      var section = el2;
      var par = el2.parentElement;
      for (var kk = 0; kk < 10 && par && par !== document.body; kk++) {
        var pr2 = par.getBoundingClientRect();
        if (pr2.width >= window.innerWidth * 0.80) { section = par; break; }
        par = par.parentElement;
      }
      summaryAnchor = section;
      break;
    }
    // Fallback: "Sipariş Tamamlama" başlığını dene
    if (!summaryAnchor) {
      for (var ii = 0; ii < allDivs.length; ii++) {
        var tt = (allDivs[ii].textContent || '').trim();
        if (tt !== 'Sipariş Tamamlama') continue;
        var rr = allDivs[ii].getBoundingClientRect();
        if (rr.top < 0) continue;
        var sec2 = allDivs[ii];
        var par2 = allDivs[ii].parentElement;
        for (var kk2 = 0; kk2 < 8 && par2 && par2 !== document.body; kk2++) {
          var pr3 = par2.getBoundingClientRect();
          if (pr3.width >= window.innerWidth * 0.80) { sec2 = par2; break; }
          par2 = par2.parentElement;
        }
        summaryAnchor = sec2;
        break;
      }
    }
    if (!summaryAnchor || !summaryAnchor.parentElement) return;

    // Inline blok oluştur
    var block = document.createElement('div');
    block.id = 'afro-delivery-inline';
    block.style.cssText = [
      'margin:8px 12px 4px',
      'border-radius:14px',
      'background:' + bg,
      'border:1.5px solid ' + border,
      'padding:14px 14px 10px',
      'box-sizing:border-box'
    ].join(';');

    // Başlık
    var hdr2 = document.createElement('div');
    hdr2.id = 'afro-dil-hdr';
