<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta httpEquiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta httpEquiv="Pragma" content="no-cache" />
    <meta httpEquiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Afro Gıda</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }

      /* Admin input renk düzeltmesi JS ile yapılır (fixAdminInputColors).
         color-scheme:light global olarak KONMAZ — React Native Web'i
         light moda çekip admin sayfasını bembeyaz yapıyor. */

      /* ================================================================
         AFRO GIDA - SABİT DUVAR KAĞIDI (Telegram tarzı)
         Hem DARK hem LIGHT MODE + MÜŞTERİ kısmında aktif.
         ÖNEMLİ: Sayfa katmanlarını ŞEFFAF yapmıyoruz (bu, eski sayfaların
         iç içe görünmesine yol açıyordu). Bunun yerine tam-ekran sayfa
         katmanlarının arka planına duvar kağıdını SABİT resim olarak
         basıyoruz. Sayfalar opak kalır (arkadakini gizler), duvar kağıdı
         kartların arasındaki boşluklarda görünür ve kaydırınca sabit kalır.
         ================================================================ */
      /* KOYU MOD DUVAR KAĞIDI */
      html.afro-wp.afro-dark [data-afro-wp="1"] {
        background-color: #0d0d0d !important;
        background-image: url(/afro_wallpaper_dark.jpg) !important;
        background-position: center top !important;
        background-size: cover !important;
        background-repeat: no-repeat !important;
        background-attachment: fixed !important;
      }
      /* AÇIK MOD DUVAR KAĞIDI */
      html.afro-wp.afro-light [data-afro-wp="1"] {
        background-color: #e2b676 !important;
        background-image: url(/afro_wallpaper_light_v3.jpg) !important;
        background-position: center top !important;
        background-size: cover !important;
        background-repeat: no-repeat !important;
        background-attachment: fixed !important;
      }

      /* ================================================================
         BUZLU CAM (frosted glass) - AÇIK MODDAKİ BEYAZ KART/PANELLER
         Beyaz alanları yarı şeffaf + arka bulanıklık yapar; böylece
         duvar kağıdı kartların arkasından bulanık şekilde görünür.
         ================================================================ */
      html.afro-wp.afro-light [data-afro-glass="1"] {
        background-color: rgba(255, 255, 255, 0.45) !important;
        -webkit-backdrop-filter: blur(14px) saturate(1.3) !important;
        backdrop-filter: blur(14px) saturate(1.3) !important;
      }

      /* KULLANICI İSTEĞİ: bilgi kutucukları (Pazar/Gel-Al saati) ve ana/alt
         kategori butonlarının ARKASINDAKİ geniş beyaz-buzlu bandı KALDIR.
         Bu bantlar tamamen şeffaf olur; böylece duvar kağıdı butonların
         arkasından net görünür (butonların kendisi dokunulmadan kalır). */
      html.afro-wp.afro-light [data-afro-glass-clear="1"] {
        background-color: rgba(255, 255, 255, 0.12) !important;
        background-image: none !important;
        -webkit-backdrop-filter: blur(10px) saturate(1.25) !important;
        backdrop-filter: blur(10px) saturate(1.25) !important;
        box-shadow: none !important;
      }

      /* KULLANICI İSTEĞİ: KOYU MODDA da kategori/bilgi bantlarını şeffaflaştır */
      html.afro-wp.afro-dark [data-afro-dark-clear="1"] {
        background-color: transparent !important;
        background-image: none !important;
        box-shadow: none !important;
      }

      /* ================================================================
         KULLANICI İSTEĞİ: ÜRÜNLER SAYFASI BÖLÜM BAŞLIĞI BANTLARI
         ("Çok al az öde", "Domates", "Biber" ... = ana kategori isimleri)
         Bu bantların arkasındaki buzlu-şeffaf zemin kaydırınca kayboluyordu
         (uygulama onları saydam render ediyor, genel painter ise ancak soluk
         renkli düğümleri yakaladığı için tutarsızdı). Özel painter ile HER
         bant işaretlenir (data-afro-secband) -> zemin STABİL kalır + etrafına
         turuncu (koyu temada yeşil) kenarlık eklenir. Bu blok tamamen geri
         alınabilir: yedek index_wallpaper.html.bak-secband-* dosyalarında.
         ================================================================ */
      html.afro-wp.afro-light [data-afro-secband="1"] {
        background-color: rgba(255, 255, 255, 0.45) !important;
        -webkit-backdrop-filter: blur(14px) saturate(1.3) !important;
        backdrop-filter: blur(14px) saturate(1.3) !important;
        border: 1.5px solid rgb(251, 140, 60) !important;
        border-radius: 9px !important;
      }
      html.afro-wp.afro-dark [data-afro-secband="1"] {
        background-color: rgba(18, 40, 30, 0.38) !important;
        -webkit-backdrop-filter: blur(14px) saturate(1.2) !important;
        backdrop-filter: blur(14px) saturate(1.2) !important;
        border: 1.5px solid rgb(20, 182, 126) !important;
        border-radius: 9px !important;
      }

      /* ================================================================
         TURUNCU BUTONLAR (HER İKİ MOD) - yeşil marka butonlarını
         uygulamanın turuncu aksanına (rgb(251,140,60)) çevirir. Hem açık
         hem koyu modda uygulanır.
         ================================================================ */
      /* AÇIK TEMA: dolu yeşil butonlar -> turuncu */
      html.afro-wp.afro-light [data-afro-orange="1"] {
        background-color: rgb(251, 140, 60) !important;
        border-color: rgb(251, 140, 60) !important;
      }
      /* KOYU TEMA: dolu yeşil butonlar -> parlak yeşil */
      html.afro-wp.afro-dark [data-afro-orange="1"] {
        background-color: rgb(20, 182, 126) !important;
        border-color: rgb(20, 182, 126) !important;
      }
      
      /* HER İKİ MODDA TÜM YEŞİL YAZILARI/İKONLARI/KENARLIKLARI TURUNCU YAP */
      /* AÇIK TEMA: yeşiller -> turuncu */
      html.afro-wp.afro-light [data-afro-green-text="1"] {
        color: rgb(251, 140, 60) !important;
      }
      html.afro-wp.afro-light [data-afro-green-border="1"] {
        border-color: rgb(251, 140, 60) !important;
      }
      html.afro-wp.afro-light [data-afro-green-fill="1"] {
        fill: rgb(251, 140, 60) !important;
      }
      /* KOYU TEMA: yeşiller -> parlak yeşil (farklı ton) */
      html.afro-wp.afro-dark [data-afro-green-text="1"] {
        color: rgb(20, 182, 126) !important;
      }
      html.afro-wp.afro-dark [data-afro-green-border="1"] {
        border-color: rgb(20, 182, 126) !important;
      }
      html.afro-wp.afro-dark [data-afro-green-fill="1"] {
        fill: rgb(20, 182, 126) !important;
      }
      /* KOYU TEMA: uygulamanın KENDİ turuncu rengini (rgb(251,140,60))
         kullanan elemanları (aktif alt kategori çipi, "Siparişi Tamamla"
         çubuğu vb.) parlak yeşile çevir. Bunlar build'e özgü atomik css
         class'ları (.r-1s5ja4 vb.) olduğu için runtime taramayla işaretlenir. */
      html.afro-wp.afro-dark [data-afro-d2g~="bg"] {
        background-color: rgb(20, 182, 126) !important;
      }
      html.afro-wp.afro-dark [data-afro-d2g~="border"] {
        border-color: rgb(20, 182, 126) !important;
      }
      html.afro-wp.afro-dark [data-afro-d2g~="text"] {
        color: rgb(20, 182, 126) !important;
      }
      /* ==== AKSAN RENGİ BİRLEŞTİRME (STATİK - FLICKER YOK) ====
         Uygulama; turuncu ve yeşil aksan renklerini derlenmiş ATOMİK css
         class'larıyla uyguluyor (.r-1s5ja4 gibi). Bu class'ları doğrudan
         statik CSS ile ezersek renk HER render'da anında doğru olur; JS
         taramasının gecikmesinden kaynaklanan turuncu<->yeşil parlaması
         (flicker) tamamen ortadan kalkar.
         TEMA KURALI: AÇIK = turuncu rgb(251,140,60); KOYU = parlak yeşil
         rgb(20,182,126). NOT: build yenilenirse class adları değişebilir;
         JS tarayıcılar yedek olarak kalır. */

      /* -- Uygulamanın TURUNCU atomik class'ları -- */
      /* Açık tema: turuncu kalsın (uygulamanın kendi değeri zaten turuncu,
         ama farklı turuncu tonlarını -255,165,0 / 249,115,22- tek tona
         sabitlemek için açıkça yazıyoruz). */
      html.afro-wp.afro-light .r-1s5ja4,
      html.afro-wp.afro-light .r-u92y06 { background-color: rgb(251, 140, 60) !important; }
      html.afro-wp.afro-light .r-15tdvqa,
      html.afro-wp.afro-light .r-1ytj54j { color: rgb(251, 140, 60) !important; }
      html.afro-wp.afro-light .r-rs0cj0,
      html.afro-wp.afro-light .r-3nu3je { border-color: rgb(251, 140, 60) !important; }
      /* Koyu tema: turuncu -> parlak yeşil */
      html.afro-wp.afro-dark .r-1s5ja4,
      html.afro-wp.afro-dark .r-u92y06 { background-color: rgb(20, 182, 126) !important; }
      html.afro-wp.afro-dark .r-15tdvqa,
      html.afro-wp.afro-dark .r-1ytj54j { color: rgb(20, 182, 126) !important; }
      html.afro-wp.afro-dark .r-rs0cj0,
      html.afro-wp.afro-dark .r-3nu3je { border-color: rgb(20, 182, 126) !important; }

      /* -- INLINE STYLE ile gelen turuncu (SEPET uyarı yazıları) --
         "Minimum Sipariş Tutarı", "Kalan Tutar" ve "Sepetinizde teslimata
         uygun olmayan ürünler var." React'te style={{color: theme.orange}}
         şeklinde INLINE basılıyor; atomik class DEĞİL. JS boyayıcı (d2g) bunu
         yakalıyor ama rAF gecikmesiyle önce turuncu kare görünüp sonra yeşile
         dönüyordu -> flicker. Tarayıcı inline rengi "rgb(251, 140, 60)"
         biçiminde normalize eder; bu saf-CSS kuralı HER paint'te anında
         uygulanır, React re-render'ı bunu kaldıramaz -> flicker tamamen biter.
         Not: sadece color ezilir; inline turuncu arka planlı bir eleman olsa
         bile yalnız yazı rengini etkiler (güvenli). */
      html.afro-wp.afro-dark [style*="251, 140, 60"] { color: rgb(20, 182, 126) !important; }
      html.afro-wp.afro-dark [style*="251,140,60"]   { color: rgb(20, 182, 126) !important; }

      /* -- Uygulamanın YEŞİL atomik class'ları (20,182,126 / 37,211,102) -- */
      /* Açık tema: yeşil -> turuncu */
      html.afro-wp.afro-light .r-4bxdpc,
      html.afro-wp.afro-light .r-1t70e42 { background-color: rgb(251, 140, 60) !important; }
      html.afro-wp.afro-light .r-1oh7245 { color: rgb(251, 140, 60) !important; }
      html.afro-wp.afro-light .r-1syw04g { border-color: rgb(251, 140, 60) !important; }
      /* Koyu tema: uygulamanın yeşilini parlak yeşile (20,182,126) sabitle */
      html.afro-wp.afro-dark .r-4bxdpc,
      html.afro-wp.afro-dark .r-1t70e42 { background-color: rgb(20, 182, 126) !important; }
      html.afro-wp.afro-dark .r-1oh7245 { color: rgb(20, 182, 126) !important; }
      html.afro-wp.afro-dark .r-1syw04g { border-color: rgb(20, 182, 126) !important; }

      /* ==== INLINE-YEŞİL ARKA PLANLI BUTONLAR (STATİK - FLICKER YOK) ====
         "Siparişe Başla", "Üye Ol / Giriş Yap" gibi ANA butonlar arka plan
         rengini ATOMİK class ile DEĞİL, React inline style ile basıyor:
         style="background-color: rgb(20, 182, 126)". Overlay JS bunu her
         tick'te turuncuya boyuyordu; ama site içinde gezinirken (yeniden
         render) React inline yeşili yeniden basıp overlay tekrar boyayana
         kadar buton bir an YEŞİL/soluk kalıyordu = "renk açımı" titremesi.
         Bu saf-CSS kuralı inline yeşil arka planı HER paint'te anında turuncuya
         çevirir -> titreme tamamen biter. NOT: sadece inline "background-color"
         eşleşir (inline "color: rgb(20,182,126)" olan yazılar ETKİLENMEZ).
         "Sipariş Oluştur" (data-afro-order-btn) kuralı dosyada DAHA SONRA
         geldiği için o buton yeşil kalmaya devam eder. */
      html.afro-wp.afro-light [style*="background-color: rgb(20, 182, 126)"],
      html.afro-wp.afro-light [style*="background-color: rgb(37, 211, 102)"],
      html.afro-wp.afro-light [style*="background-color:rgb(20, 182, 126)"] {
        background-color: rgb(251, 140, 60) !important;
      }
      /* Koyu tema: aynı butonların yeşilini parlak marka yeşiline SABİTLE
         (koyu temada da olası titremeyi önler; değer zaten yeşil). */
      html.afro-wp.afro-dark [style*="background-color: rgb(20, 182, 126)"],
      html.afro-wp.afro-dark [style*="background-color: rgb(37, 211, 102)"] {
        background-color: rgb(20, 182, 126) !important;
      }

      /* KULLANICI İSTEĞİ: AÇIK MODDA yükleniyor spinner'ı (yeşil daire)
         TURUNCU olsun. React ActivityIndicator merkez konumlu (cx=16 cy=16)
         svg circle'larını hedefler; tüm boyutlarda (r değeri farketmez) geçerli.
         Ürün ikonları farklı geometride (merkez offset) olduğu için etkilenmez.
         Koyu modda yeşil kalır. */
      html.afro-wp.afro-light svg circle[cx="16"][cy="16"] {
        stroke: rgb(251, 140, 60) !important;
      }
      html.afro-wp.afro-dark svg circle[cx="16"][cy="16"] {
        stroke: rgb(20, 182, 126) !important;
      }

      /* KULLANICI İSTEĞİ: SEPET SAYFASINDA turuncu dolu butonları ve sarımtırak
         kutuları ŞEFFAF BUZLU yap (içi boş outline style, arkadan duvar kağıdı
         görünsün). Buna dahil: "Pazardan Gel-Al", "Tezgahta Nakit/Pos" butonları,
         "Teslim Alma Saati" kutusu, "Ara Toplam" özet kutusu. Profil/ürünler
         sayfasındaki butonlar normal kalsın (sadece sepette uygula). */
      html.afro-wp.afro-light [data-afro-cart-outline="1"] {
        background-color: rgba(255, 255, 255, 0.65) !important;
        border: 2px solid rgb(251, 140, 60) !important;
        -webkit-backdrop-filter: blur(12px) saturate(1.2) !important;
        backdrop-filter: blur(12px) saturate(1.2) !important;
        color: rgb(251, 140, 60) !important;
      }
      /* KULLANICI İSTEĞİ: Sepette arka planı ŞEFFAF olup duvar kağıdı direkt
         geçtiği için yazısı okunmayan bloklara ŞEFFAF BUZLU-CAM panel ekle
         (renk yok; yarı şeffaf beyaz + güçlü blur, duvar kağıdı hafif geçsin).
         İki tip: (frost) = tam panel (şeffaf bare bloklar: Sipariş Tamamlama +
         üst başlık); (fill) = app'in zayıf beyaz kartlarına (özet/adres/
         mahalleler) güçlü blur ekleyip buzlu cam yap, köşe/padding'i korunur. */
      html.afro-wp.afro-light [data-afro-cart-frost="1"] {
        background-color: rgba(255, 255, 255, 0.5) !important;
        -webkit-backdrop-filter: blur(18px) saturate(1.25) !important;
        backdrop-filter: blur(18px) saturate(1.25) !important;
        border-radius: 12px !important;
        padding: 12px 14px !important;
      }
      html.afro-wp.afro-light [data-afro-cart-fill="1"] {
        background-color: rgba(255, 255, 255, 0.45) !important;
        -webkit-backdrop-filter: blur(18px) saturate(1.25) !important;
        backdrop-filter: blur(18px) saturate(1.25) !important;
      }
      /* Aktif teslimat/ödeme butonlarının (Eve Servis, Kapıda Nakit) iç yazısı
         BEYAZdı, açık buzlu zeminde okunmuyordu -> turuncuya çevir (okunur). */
      html.afro-wp.afro-light [data-afro-cart-outline="1"],
      html.afro-wp.afro-light [data-afro-cart-outline="1"] * {
        color: rgb(224, 108, 24) !important;
      }
      /* Üst başlık alt satırı ("X çeşit ürün • ₺..") soluk gri -> koyu okunur. */
      html.afro-wp.afro-light [data-afro-cart-darktext="1"],
      html.afro-wp.afro-light [data-afro-cart-darktext="1"] * {
        color: rgb(40, 62, 50) !important;
      }
      /* Sipariş Oluştur butonu -> YEŞİL (yazı beyaz, okunur). */
      html.afro-wp.afro-light [data-afro-order-btn="1"] {
        background-color: rgb(20, 182, 126) !important;
        border-color: rgb(20, 182, 126) !important;
        -webkit-backdrop-filter: none !important;
        backdrop-filter: none !important;
      }
      html.afro-wp.afro-light [data-afro-order-btn="1"] * {
        color: rgb(255, 255, 255) !important;
      }
      /* Alt menü çubuğu -> YÜZEN pill/ada: absolute konumla akıştan çıkar,
         böylece kaydırma kabı tüm yüksekliği kaplar ve içerik/butonlar pill'in
         ALTINDAN geçer (kesik bant kalkar). Her iki temada da geçerli konum. */
      html.afro-wp [data-afro-navpill="1"] {
        position: fixed !important;
        transform: translateZ(0) !important;
        -webkit-transform: translateZ(0) !important;
        will-change: transform !important;
        left: 0 !important;
        right: 0 !important;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 8px) !important;
        width: calc(100% - 28px) !important;
        max-width: 470px !important;
        margin: 0 auto !important;
        border-radius: 32px !important;
        box-shadow: 0 8px 26px rgba(70, 35, 0, 0.28) !important;
        overflow: hidden !important;
        /* Etiket satırı kırpılır, ikonlar tam ortada kalır */
        height: 54px !important;
        max-height: 54px !important;
        z-index: 40 !important;
        border: none !important;
        background-color: rgba(249, 115, 22, 0.10) !important;
        background: rgba(249, 115, 22, 0.10) !important;
        background-image: none !important;
        -webkit-backdrop-filter: blur(22px) !important;
        backdrop-filter: blur(22px) !important;
        box-shadow: 0 4px 18px rgba(0,0,0,0.15) !important;
        border: 1.5px solid rgba(249, 115, 22, 1.00) !important;
      }
      /* Koyu sistem tercihi: class gelmeden önce de doğru renk */
      @media (prefers-color-scheme: dark) {
        html.afro-wp [data-afro-navpill="1"] {
          border: 1.5px solid rgba(20, 182, 126, 1.00) !important;
          background-color: rgba(14, 18, 16, 0.72) !important;
          background-image: none !important;
        }
      }
      /* AÇIK tema pill: buzlu turuncu cam */
      html.afro-wp.afro-light [data-afro-navpill="1"] {
        border: 1.5px solid rgba(249, 115, 22, 1.00) !important;
        background-color: rgba(249, 115, 22, 0.10) !important;
        background-image: none !important;
        background: rgba(249, 115, 22, 0.10) !important;
        -webkit-backdrop-filter: blur(22px) !important;
        backdrop-filter: blur(22px) !important;
        box-shadow: 0 4px 18px rgba(0,0,0,0.15) !important;
      }
      /* KOYU tema pill: yarı şeffaf koyu zemin + yeşil kenar */
      html.afro-wp.afro-dark [data-afro-navpill="1"] {
        border: 1.5px solid rgba(20, 182, 126, 1.00) !important;
        background-color: rgba(14, 18, 16, 0.72) !important;
        background-image: none !important;
        -webkit-backdrop-filter: blur(22px) !important;
        backdrop-filter: blur(22px) !important;
      }
      /* NavPill üzerinde cartbar çizgi deseni gözükmesin: iki özellik birlikte olursa navpill kazanır */
      html.afro-wp [data-afro-navpill="1"][data-afro-cartbar] {
        background-image: none !important;
        background: transparent !important;
      }
      /* NavPill kapsayıcısı: cam/bant YOK (JS işareti + :has yedeği) */
      html.afro-wp [data-afro-navparent="1"],
      html.afro-wp :has(> [data-afro-navpill="1"]) {
        background: transparent !important;
        background-color: transparent !important;
        background-image: none !important;
        -webkit-backdrop-filter: none !important;
        backdrop-filter: none !important;
        box-shadow: none !important;
        border: none !important;
      }
      /* NavPill parent + kardeşleri — altındaki bant görünmesin */
      html.afro-wp [data-afro-navpill="1"] ~ * {
        background-color: transparent !important;
        background: transparent !important;
        background-image: none !important;
      }
      /* Kaydırma kabına alt boşluk: son satır pill'in altında kalmasın. */
      html.afro-wp [data-afro-navpad="1"] {
        padding-bottom: 120px !important;
        box-sizing: border-box !important;
      }
      /* Siparişi Tamamla çubuğu aktifken ekstra boşluk (çubuk ~64px + pill 70px) */
      html.afro-wp [data-afro-navpad="1"]:has(~ [data-afro-cartbar="1"]),
      html.afro-wp.has-cartbar [data-afro-navpad="1"] {
        padding-bottom: 196px !important;
      }
      /* /markets (Olduğumuz Pazarlar) sayfasında: tab bar + navpad gizle */
      html.afro-wp[data-afro-markets-page] [data-afro-navpill="1"] {
        display: none !important;
        pointer-events: none !important;
      }
      html.afro-wp[data-afro-markets-page] [data-afro-navpad="1"] {

      /* ================================================================
         PAZAR BAZLI ÜRÜN FİLTRESİ (fetch interceptor)
         Müşteri bir pazar seçtiğinde uygulama pazar adını localStorage'a
         'selected_market_name' olarak yazıyor ama /api/products çağrısına
         eklemiyordu; bu yüzden backend pazara göre filtreleyemiyordu.
         Burada window.fetch'i sarıp müşteri ürün listeleme çağrılarına
         (GET /products) seçili pazar adını 'market=' parametresi olarak
         ekliyoruz. Backend bu pazarda satmayan tedarikçilerin ürünlerini
         gizliyor. Tek ürün (/products/{id}), show_all ve zaten market içeren
         çağrılara dokunulmaz. defer'li app bundle'ından ÖNCE kurulur. */
      (function () {
        if (window.__afroFetchPatched) return;
        window.__afroFetchPatched = 1;
        var origFetch = window.fetch;
        if (typeof origFetch !== 'function') return;
        function afroUrl(u) {
          try {
            if (!/\/products(\?|$)/.test(u)) return u;              // sadece liste ucu
            if (/\/admin\//.test(u)) return u;                     // admin hariç
            if (/\/products\/[^?]/.test(u)) return u;              // tek ürün /products/{id} hariç
            var mkt = '';
            try { mkt = localStorage.getItem('selected_market_name') || ''; } catch (e) {}
            if (!mkt) return u;                                    // pazar seçili değilse dokunma
            var abs = new URL(u, location.origin);
            if (abs.searchParams.get('market')) return u;          // zaten market var
            // ÖNEMLİ: yönetici görünümünde uygulama show_all=true gönderiyor ve
            // bu backend'de pazar filtresini TAMAMEN kapatıyordu (ürün her pazarda
            // görünüyordu). show_all'ı kaldırıp seçili pazarı ekliyoruz ki tedarikçi
            // ataması olmayan pazarlarda ürün gizlensin.
            abs.searchParams.delete('show_all');
            abs.searchParams.set('market', mkt);
            return /^https?:\/\//.test(u) ? abs.toString() : (abs.pathname + abs.search);
          } catch (e) { return u; }
        }
        window.fetch = function (input, init) {
          try {
            var isGet = !init || !init.method || String(init.method).toUpperCase() === 'GET';

                var nu = afroUrl(input.url);
                if (nu !== input.url) input = new Request(nu, input);
              }
            }
          } catch (e) {}
          return origFetch.call(this, input, init);
        };

            if (el.getAttribute(WP_ATTR) === '1') continue;
            var r = el.getBoundingClientRect();
            // SADECE gerçek sayfa arka planı: neredeyse tüm ekranı kaplayan
            // VE köşesiz (radius<8) katmanlar. Yuvarlak köşeli kartlar (menü
            // kartı gibi) uzun olsalar bile buraya girmez -> onlara duvar
            // kağıdı basılmaz (aksi halde kartın içinde çizimler görünüyordu).
            if (r.width >= vw * 0.85 && r.height >= vh * 0.7) {
              var cs0 = getComputedStyle(el);
              if ((parseFloat(cs0.borderRadius) || 0) >= 8) continue; // yuvarlak kart -> atla
              var bg = cs0.backgroundColor;
              // sadece opak (dolu) arka planı olan tam-ekran katmanlar
              if (bg && bg !== 'rgba(0, 0, 0, 0)' && bg !== 'transparent') {
                el.setAttribute(WP_ATTR, '1');
              }
            }
          }
        }

        // Açık moddaki BEYAZ/SOLUK kart/panel/bar elemanlarını buzlu cam yap.
        // Tam ekran kaplamayan, beyazımsı/soluk opak arka planı olan ve yeterince
        // büyük yüzeyler işaretlenir (küçük butonlar hariç).
        function paintGlassLayers() {
          var vw = window.innerWidth, vh = window.innerHeight;
          // #root DEĞİL, TÜM body taranır: modallar/popuplar (Şifre Değiştir,
          // Şikayet ve Öneri, Haritadan Seç vb.) #root DIŞINDA ayrı bir portal
          // katmanına render edildiği için body üzerinden yakalamak gerekir.
          var root = document.body;
          if (!root) return;
          var nodes = root.querySelectorAll('*');
          for (var i = 0; i < nodes.length; i++) {
            var el = nodes[i];
            if (el.getAttribute(GLASS_ATTR) === '1') continue;
            // NavPill ve kapsayıcıları cam olmasın (arkada bant oluşturuyor)
            if (el.getAttribute('data-afro-navpill') === '1' ||
                el.getAttribute('data-afro-navparent') === '1' ||
                el.querySelector('[data-afro-navpill="1"]')) continue;
            var r = el.getBoundingClientRect();
            var cs = getComputedStyle(el);
            var rad = parseFloat(cs.borderRadius) || 0;
            // SADECE gerçek sayfa arka planını atla (köşesiz + neredeyse tam ekran).
            // Yuvarlak köşeli büyük kartlar (mobildeki uzun menü kartı gibi) cam
            // efekti ALIR; böylece mobilde de duvar kağıdı bulanık görünür.
            if (rad < 8 && r.width >= vw * 0.85 && r.height >= vh * 0.7) continue;
            // Uygun yüzeyler:
            //  (A) kart/panel: yeterince büyük (>=200x50)
            //  (B) geniş ama İNCE başlık/satır barları (tam genişliğe yakın, kısa)
            //  (C) ürün kartı içindeki SOLUK alanlar (yeşil ikon bölgesi, beyaz bilgi):
            //      boyut >=100x40 (ikon/bilgi alanı boyutları)
            var isCard = (r.width >= 200 && r.height >= 50);
            var isStrip = (r.width >= vw * 0.6 && r.height >= 18 && r.height < 50);
            var isCardInner = (r.width >= 100 && r.height >= 40); // kart içi alanlar
            // küçük çip/pill/saat butonu (Pazar saati, Gel-Al, Sebze etiketi,
            // Ürünleri Göster, saat butonları vb.) -> bunlar da buzlu cam olur
            var isChip = (r.width >= 40 && r.height >= 20);
            // yuvarlak ikon rozetleri (menü/profil satırlarındaki ~38px daireler):
            // neredeyse kare + büyük köşe yarıçapı (daire) -> soluk yeşil arka planlı
            // olanlar da buzlu cam olur (içindeki turuncu simge kalır).
            var minSide = Math.min(r.width, r.height);
            var isIconCircle = (r.width >= 20 && r.width <= 64 &&
                                Math.abs(r.width - r.height) <= 8 &&
                                rad >= minSide * 0.35);
            // İNCE SEPARATOR: tam ekran genişliğinde ama çok kısa (1-17px) elementler.
            // React Native banner ile scroll view arasındaki beyaz çizgiler bunlar.
            var isSeparator = (r.width >= vw * 0.85 && r.height >= 1 && r.height < 18);
            if (!isCard && !isStrip && !isCardInner && !isChip && !isIconCircle && !isSeparator) continue;
            var bg = cs.backgroundColor;
            var m = bg && bg.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/);
            if (!m) continue;
            var rr = +m[1], gg = +m[2], bb = +m[3], a = (m[4] === undefined ? 1 : +m[4]);
            // SOLUK (açık) renkler: beyaz (r,g,b>=230) VEYA soluk yeşil/bej (her RGB>=180).
            // Yarı şeffaf da olsa yakala (a>=0.2). Tamamen görünmez (a<0.2) atla.
            var isPale = ((rr >= 230 && gg >= 230 && bb >= 230) || (rr >= 180 && gg >= 180 && bb >= 180)) && a >= 0.2;
            if (isPale) {
              el.setAttribute(GLASS_ATTR, '1');
            }
          }
        }

        // KULLANICI İSTEĞİ: bilgi kutucukları (Pazar/Gel-Al saati) ve ana/alt
        // kategori butonlarının ARKASINDAKİ geniş beyaz-buzlu bandı şeffaflaştır.
        // Sadece GENİŞ kapsayıcı bantları hedefler (bireysel butonlara dokunmaz).
        function clearNavGlass() {
          var vw = window.innerWidth;
          var g = document.querySelectorAll('[' + GLASS_ATTR + '="1"]');
          for (var i = 0; i < g.length; i++) {
            var el = g[i];
            var r = el.getBoundingClientRect();
            // Yalnızca geniş bantlar (>= ekran genişliğinin %50'si)
            if (r.width < vw * 0.5) continue;
            var t = el.innerText || '';
            // Ana kategori: en az 2 ana kategori kelimesi içeriyorsa
            var catHits = 0;
            if (t.indexOf('İNDİRİMLİ') > -1) catHits++;
            if (t.indexOf('Sebze') > -1) catHits++;
            if (t.indexOf('Meyve') > -1) catHits++;
            if (t.indexOf('Yeşillik') > -1) catHits++;
            if (t.indexOf('Zeytin') > -1) catHits++;
            // Alt kategori: en az 2 alt kategori kelimesi içeriyorsa
            var subHits = 0;
            if (t.indexOf('Domates') > -1) subHits++;
            if (t.indexOf('Kabak') > -1) subHits++;
            if (t.indexOf('Patlıcan') > -1) subHits++;
            if (t.indexOf('Biber') > -1) subHits++;
            if (t.indexOf('Diğer') > -1) subHits++;
            var hasInfo = (t.indexOf('Pazar saati') > -1 || t.indexOf('Gel-Al') > -1);
            // Üst başlık ("Ürünler"/"Fiyatlar" + market adı) bandı: sayfanın en
            // üstünde (top<70) yer alan geniş ama kısa (<=90px) buzlu cam bandı.
            // KULLANICI İSTEĞİ: koyu moddaki gibi şeffaf olsun, arkadan duvar
            // kağıdı görünsün.
            var isHeader = (r.top < 70 && r.height <= 90);
            // İnce separator (< 18px): içerik yoksa tam şeffaf yap (background gizle)
            var isVeryThinSep = (r.height < 18 && r.width >= vw * 0.85 && !(el.innerText || '').trim());
            if (catHits >= 2 || subHits >= 2 || hasInfo || isHeader || isVeryThinSep) {
              el.removeAttribute(GLASS_ATTR);
              if (isVeryThinSep) {
                // Separator: tam şeffaf
                el.style.setProperty('background-color', 'transparent', 'important');
                el.style.setProperty('background-image', 'none', 'important');
                el.style.setProperty('box-shadow', 'none', 'important');
                el.style.setProperty('border-bottom-color', 'transparent', 'important');
                el.style.setProperty('border-top-color', 'transparent', 'important');
                el.setAttribute('data-afro-sep-fixed', '1');
              } else {
                el.setAttribute(GLASS_CLEAR_ATTR, '1'); // şeffaf olarak işaretle
              }
            }
          }
        }

        function unpaintNavGlass() {
          var c = document.querySelectorAll('[' + GLASS_CLEAR_ATTR + ']');
          for (var i = 0; i < c.length; i++) c[i].removeAttribute(GLASS_CLEAR_ATTR);
        }

        function unpaintSectionBands() {
          var s = document.querySelectorAll('[' + SEC_BAND_ATTR + ']');
          for (var i = 0; i < s.length; i++) s[i].removeAttribute(SEC_BAND_ATTR);
        }

        // KULLANICI İSTEĞİ: ürünler sayfasındaki bölüm başlığı bantlarını
        // ("Çok al az öde", "Domates", "Biber" ... = ana kategori isimleri)
        // HER taramada yeniden işaretle. Uygulama bu bantları saydam render
        // ediyor; genel paintGlassLayers yalnızca SOLUK renkli düğümleri
        // yakaladığı için bantlar kaydırma/geri-dönüşüm sırasında tutarsız
        // görünüyordu (buzlu zemin "siliniyor"du). Burada bantları build'e özgü
        // atomik class + geometri ile kesin olarak seçip stabil frost + turuncu
        // kenarlık uyguluyoruz. unpaint-then-rescan deseni: her taramada önce
        // tüm işaretleri kaldır, sonra o anki bantları yeniden işaretle ->
        // sticky/yeniden-oluşturulan başlık düğümleri de anında yakalanır,
        // ekranda titreme olmaz (scroll + mutation + interval'da çalışır).
        function paintSectionBands() {
          // Sadece ürünler/fiyatlar sayfasında uygula
          if (window.location.pathname.indexOf('/products') === -1) { unpaintSectionBands(); return; }
          unpaintSectionBands();
          var vw = window.innerWidth;
          // r-184en5c: bu build'de bölüm başlığı bandına özgü atomik class
          // (SectionList başlık kapsayıcısı). Geometri ile doğrulanır.
          var cands = document.querySelectorAll('.r-184en5c');
          for (var i = 0; i < cands.length; i++) {
            var el = cands[i];
            var r = el.getBoundingClientRect();
            // Geniş (>=%50 ekran) + kısa (18-44px) bant; ürün kartları/uzun
            // kapsayıcılar elenir. İçinde tek başlık düğümü bulunur.
            if (r.width < vw * 0.5) continue;
            if (r.height < 18 || r.height > 44) continue;
            // Genel glass/glass-clear/dark-clear işaretleri varsa temizle ki
            // yalnızca secband kuralı geçerli olsun (çakışma önlenir).
            el.removeAttribute(GLASS_ATTR);
            el.removeAttribute(GLASS_CLEAR_ATTR);
            el.removeAttribute(DARK_CLEAR_ATTR);
            el.setAttribute(SEC_BAND_ATTR, '1');
          }
        }

        // KULLANICI İSTEĞİ: KOYU MODDA tüm "chrome" bantlarını (üst başlık,
        // bilgi kutucukları, ana/alt kategori satırları ve "Çok al az öde"/
        // "Domates" gibi bölüm başlıkları) ŞEFFAFLAŞTIR. Böylece açık moddaki
        // gibi arkadan duvar kağıdı net görünür. Solid koyu-yeşil (rgb 2,7,3)
        // GENİŞ ama KISA bantları hedefler; ürün kartları (uzun) ve tam sayfa
        // kapsayıcıları (zaten şeffaf / çok geniş) dokunulmaz.
        function clearNavDark() {
          var vw = window.innerWidth;
          var all = document.body.querySelectorAll('div');
          for (var i = 0; i < all.length; i++) {
            var el = all[i];
            var r = el.getBoundingClientRect();
            // Geniş bantlar (>= ekran genişliğinin %50'si). Mobilde bantlar
            // tam ekran genişliğinde olabildiği için ÜST genişlik sınırı YOK;
            // sayfa arka planını yükseklik filtresi eler.
            if (r.width < vw * 0.5) continue;
            // Bantlar (header/başlık/nav satırları/bilgi kutucuğu kapsayıcısı):
            // 18-220px. Bilgi kutucukları kapsayıcısı ~140px olabiliyor. Ürün
            // kartları ve tam sayfa arka planı çok daha uzun olduğu için ELENİR.
            if (r.height < 18 || r.height > 220) continue;
            var cs = getComputedStyle(el);
            var bg = cs.backgroundColor;
            if (!bg || bg.indexOf('rgb') === -1) continue;
            var m = bg.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/);
            if (!m) continue;
            var rr = +m[1], gg = +m[2], bb = +m[3];
            var a = (m[4] === undefined ? 1 : +m[4]);
            if (a < 0.2) continue; // zaten görünmez -> atla
            // Solid koyu yeşil/siyah ton (rgb 2,7,3 ve yakını): tüm kanallar düşük
            var isDarkGreen = (rr <= 12 && gg <= 18 && bb <= 12);
            if (!isDarkGreen) continue;
            el.setAttribute(DARK_CLEAR_ATTR, '1');
          }
        }

        function unpaintNavDark() {
          var c = document.querySelectorAll('[' + DARK_CLEAR_ATTR + ']');
          for (var i = 0; i < c.length; i++) c[i].removeAttribute(DARK_CLEAR_ATTR);
        }

        // KULLANICI İSTEĞİ: SEPET SAYFASINDA (/cart) turuncu dolu butonları ve
        // sarımtırak kutuları ŞEFFAF-BUZLU OUTLINE style'a çevir. Buna dahil:
        // "Pazardan Gel-Al", "Tezgahta Nakit/Pos" butonları, "Teslim Alma Saati"
        // kutusu, "Ara Toplam" özet kutusu. Sadece AÇIK modda + sepet sayfasında.
        function paintCartOutline() {
          // Sadece sepet sayfasında uygula
          if (window.location.pathname.indexOf('/cart') === -1) return;
          // ÖNEMLİ (buton aktif/pasif takılması düzeltmesi): her taramada önce
          // mevcut işaretleri KALDIR. Böylece override kalkar, getComputedStyle
          // uygulamanın GERÇEK rengini döndürür; sadece ŞU AN turuncu (aktif) olan
          // buton yeniden işaretlenir. Pasif hale gelen buton (surface rengi)
          // artık işaretlenmez -> rengi "sönmüyor" bug'ı biter. Tümü senkron
          // tek geçişte olduğu için ekranda titreme görünmez.
          unpaintCartOutline();
          var vw = window.innerWidth;
          var all = document.body.querySelectorAll('div');
          for (var i = 0; i < all.length; i++) {
            var el = all[i];
            if (el.getAttribute(CART_OUTLINE_ATTR) === '1') continue; // zaten işaretli
            var r = el.getBoundingClientRect();
            // Buton/kutu boyutunda: min 150px genişlik, 35-150px yükseklik.
            // Dev sayfa kapsayıcılarını (>150px yükseklik) atla.
            if (r.width < 150 || r.height < 35 || r.height > 150) continue;
            var cs = getComputedStyle(el);
            var bg = cs.backgroundColor;
            if (!bg || bg.indexOf('rgb') === -1) continue;
            var m = bg.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/);
            if (!m) continue;
            var rr = +m[1], gg = +m[2], bb = +m[3];
            var a = (m[4] === undefined ? 1 : +m[4]);
            if (a < 0.6) continue; // zaten yarı şeffaf olanları atla
            // TURUNCU DOLU (rgb 251,140,60 ± tolerans) VEYA SARIMTRAK DOLU
            // (rgb 255,235,210 civarı - özet kutusu) butonları/kutuları yakala
            var isOrange = (rr > 240 && gg > 120 && gg < 160 && bb > 40 && bb < 80);
            var isBeige = (rr > 240 && gg > 220 && bb > 190);
            if (isOrange || isBeige) {
              // Önce turuncu dolu stilini kaldır, sonra outline stilini uygula
              el.removeAttribute('data-afro-orange');
              el.setAttribute(CART_OUTLINE_ATTR, '1');
            }
          }
        }

        function unpaintCartOutline() {
          var c = document.querySelectorAll('[' + CART_OUTLINE_ATTR + ']');
          for (var i = 0; i < c.length; i++) c[i].removeAttribute(CART_OUTLINE_ATTR);
        }

        // KULLANICI İSTEĞİ: Sepette arka planı ŞEFFAF olup duvar kağıdı direkt
        // görünen, bu yüzden yazısı okunmayan bloklara BUZLU-CAM panel ekle.
        // Hedef: "Sipariş Tamamlama" bloğu (başlık + açıklama + sözleşme onay
        // satırını kapsayan sarmalayıcı). Sadece AÇIK mod + sepet sayfası.
        function paintCartFrost() {
          if (window.location.pathname.indexOf('/cart') === -1) return;
          var vw = window.innerWidth;
          var headerDone = false;
          var all = document.body.querySelectorAll('div');
          for (var i = 0; i < all.length; i++) {
            var el = all[i];
            if (el.getAttribute(CART_FROST_ATTR) === '1' || el.getAttribute(CART_FILL_ATTR) === '1') continue;
            var t = (el.innerText || '').replace(/\s+/g, ' ').trim();
            if (!t) continue;
            var r = el.getBoundingClientRect();
            // Üst başlık alt satırı ("X çeşit ürün • ₺..") soluk gri-yeşil ->
            // duvar kağıdı üstünde okunması için KOYU renge çevir (genişlik kapısından önce).
            if (/^\d+ çeşit ürün/.test(t) && r.top < 210 && r.height <= 40) {
              el.setAttribute('data-afro-cart-darktext', '1');
            }
            if (r.width < 150) continue;
            // Sipariş oluştur butonu -> YEŞİL yap (yazısı beyaz/okunur olsun).
            if (t.indexOf('Siparişi Oluştur') > -1 && r.width > 300 && r.height >= 40 && r.height <= 90) {
              el.setAttribute('data-afro-order-btn', '1');
              continue;
            }
            var role = ''; // 'panel' = tam buzlu panel, 'fill' = kartı buzlu-cam doldur
            // App'in zayıf yarı-şeffaf beyaz kartı mı? (rgba(255,255,255,~0.45))
            var cs = getComputedStyle(el);
            var m = cs.backgroundColor.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/);
            var isWhiteCard = false;
            if (m) {
              var rr = +m[1], gg = +m[2], bb = +m[3], aa = (m[4] === undefined ? 1 : +m[4]);
              isWhiteCard = (rr >= 250 && gg >= 250 && bb >= 250 && aa >= 0.3 && aa <= 0.6);
            }
            // A) Sözleşme bloğu (Sipariş Tamamlama başlık+açıklama+onay) -> tam panel.
            //    "Sipariş Oluştur" butonunu da kapsayan büyük blokları atla.
            if (t.indexOf('Sipariş Tamamlama') === 0 && t.indexOf('okudum ve kabul') > -1) {
              if (r.height >= 50 && r.height <= 200) role = 'panel';
            }
            // (Üst "Sepetim" başlığı KULLANICI İSTEĞİYLE artık frost YAPILMIYOR;
            //  duvar kağıdı görünsün diye şeffaf bırakılıyor.)
            // C) SADECE istenen içerik kartlarını buzlu-cam doldur (buton/alt menü/
            //    kupon gibi kontrollere DOKUNMA). Kart = zayıf beyaz arka planlı olan.
            else if (isWhiteCard && r.height >= 30 && r.height <= 320) {
              if (t.indexOf('Ara Toplam') > -1) role = 'fill';                        // özet kutusu
              else if (t.indexOf('Eve servis verilen mahalleler') > -1) role = 'fill'; // mahalleler kutusu
              else if (t.indexOf('Ürünleri Göster') > -1 && t.indexOf('çeşit ürün') > -1) role = 'fill'; // üst özet kartı
              else if (r.height <= 120 && /(Mah\.|Mah |Sok|Sk\.|Cad|Cd\.|No:|Kat:|Daire)/i.test(t)) role = 'fill'; // adres kutusu
            }
            if (!role) continue;
            // İç içe eşleşmeleri önle: bir atası zaten panel/fill olduysa atla
            // (çift panel / çift blur olmasın, sadece en dıştaki işaretlensin).
            var anc = el.parentElement, skip = false;
            while (anc) {
              if (anc.getAttribute && (anc.getAttribute(CART_FROST_ATTR) === '1' ||
                  anc.getAttribute(CART_FILL_ATTR) === '1')) { skip = true; break; }
              anc = anc.parentElement;
            }
            if (skip) continue;
            el.setAttribute(role === 'panel' ? CART_FROST_ATTR : CART_FILL_ATTR, '1');
          }
        }

        function unpaintCartFrost() {
          var c = document.querySelectorAll('[' + CART_FROST_ATTR + '], [' + CART_FILL_ATTR + '], [data-afro-order-btn], [data-afro-cart-darktext]');
          for (var i = 0; i < c.length; i++) {
            c[i].removeAttribute(CART_FROST_ATTR);
            c[i].removeAttribute(CART_FILL_ATTR);
            c[i].removeAttribute('data-afro-order-btn');
            c[i].removeAttribute('data-afro-cart-darktext');
          }
        }

        // KULLANICI İSTEĞİ: Alttaki menü çubuğunu (Pazarlar/Fırsatlar/Sepet/
        // Kuponlar/Profil) YÜZEN bir "ada/pill" şekline çevir (yuvarlak köşe,
        // kenarlardan boşluk, gölge, buzlu cam). Tüm sayfalarda çalışır.
        function paintNavPill() {
          var all = document.body.querySelectorAll('div');
          var pill = null;
          var fallbackPill = null; // uygulama teması henüz yüklenmediyse şeffaf pill
          for (var i = 0; i < all.length; i++) {
            var el = all[i];
            if (el.getAttribute('data-afro-navpill') === '1') { pill = el; continue; }
            // textContent: display:none elementleri de okur (Pazarlar gizliyken de çalışır)
            var t = (el.textContent || el.innerText || '').replace(/\s+/g, ' ').trim();
            if (t.length > 150) continue; // textContent biraz daha uzun olabilir
            if (t.indexOf('Sepet') === -1 || t.indexOf('Profil') === -1) continue;
            var r = el.getBoundingClientRect();
            // Menü çubuğunun kendisi: kısa (yükseklik ~45-120), geniş.
            // 95→120: bazı cihazlarda tema yüklenince yükseklik artabiliyor.
            if (r.height < 45 || r.height > 120 || r.width < 300) continue;
            var cs = getComputedStyle(el);
            var m = cs.backgroundColor.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/);
            var aa = m ? (m[4] === undefined ? 1 : +m[4]) : 0;
            var hasBorder = parseFloat(cs.borderTopWidth) > 0 || parseFloat(cs.borderBottomWidth) > 0;
            if (aa < 0.1 && !hasBorder) {
              // İlk render: tema henüz yüklenmediyse tab bar şeffaf olabilir.
              // Metin+boyut eşleşmesi çok güçlü → fallback olarak kaydet,
              // opak bir tane bulamazsak onu kullan.
              if (!fallbackPill) fallbackPill = el;
              continue;
            }
            el.setAttribute('data-afro-navpill', '1');
            pill = el;
          }
          // Opak pill bulunamadıysa şeffaf fallback'i kullan (ilk yükleme senaryosu).
          // Atribüt eklenince CSS cream arka planını hemen uygular → beyaz flaş ortadan kalkar.
          if (!pill && fallbackPill) {

          // Pill'i YÜZEN yap (absolute) + kardeş kaydırma kabına alt boşluk ekle ki

          if (pill) {
            // RN inline style'ı ezmek için doğrudan setProperty ile uygula
            var _isDark = document.documentElement.classList.contains('afro-dark') ||

               window.matchMedia('(prefers-color-scheme: dark)').matches);

            // Pill stilini doğrudan yaz (setInterval ile 120ms'de bir zorlanıyor — en güvenilir yöntem)
            if (_isDark) {
              pill.style.setProperty('background-color', 'rgba(14,18,16,0.72)', 'important');

            } else {
              pill.style.setProperty('background-color', 'rgba(249,115,22,0.10)', 'important');
              pill.style.setProperty('background', 'rgba(249,115,22,0.10)', 'important');
              pill.style.setProperty('border', '1.5px solid rgba(249,115,22,0.50)', 'important');
            }
            pill.style.setProperty('background-image', 'none', 'important');
            pill.style.setProperty('-webkit-backdrop-filter', 'blur(22px)', 'important');
            pill.style.setProperty('backdrop-filter', 'blur(22px)', 'important');
            pill.style.setProperty('box-shadow', '0 4px 18px rgba(0,0,0,0.15)', 'important');
            pill.style.setProperty('border-top', 'none', 'important');
            pill.style.setProperty('border-radius', '32px', 'important');
            pill.style.setProperty('overflow', 'hidden', 'important');
            // navpill hiçbir zaman cartbar etiketini taşımasın
            pill.removeAttribute('data-afro-cartbar');
            var col = pill.parentElement;
            if (col && !col.querySelector('[data-afro-navpad="1"]')) {
              // Kardeş kaydırma kabını bul: önce pill'in kardeşlerine bak,
              // sonra onların torunlarında (tüm derinlikte) ara.
              // scrollHeight koşulu YOK — içerik kısa bile olsa pad ekle
              // (Çıkış Yap gibi son butonlar pill arkasında kalmasın).
              for (var c = 0; c < col.children.length; c++) {
                var kid = col.children[c];
                if (kid === pill) continue;
                var found = null;
                var kcs = getComputedStyle(kid);
                if (kcs.overflowY === 'auto' || kcs.overflowY === 'scroll') {
                  found = kid;
                } else {
                  var inner = kid.querySelectorAll('div');
                  for (var s = 0; s < inner.length; s++) {
                    var e2cs = getComputedStyle(inner[s]);
                    if (e2cs.overflowY === 'auto' || e2cs.overflowY === 'scroll') {
                      found = inner[s]; break;
                    }
                  }
                }
                if (found) { found.setAttribute('data-afro-navpad', '1'); break; }
              }
              // Kardeşte bulunamadıysa pill'in ebeveynine (col) bak
              if (!col.querySelector('[data-afro-navpad="1"]')) {

                if (colcs.overflowY === 'auto' || colcs.overflowY === 'scroll') {
                  col.setAttribute('data-afro-navpad', '1');
                }

        // Window'a eriş: ikinci script bloğu da buraya ulaşabilsin
        window._afroRepaintNavPill = paintNavPill;
        function unpaintNavPill() {

            c[i].removeAttribute('data-afro-navpad');

        // Alt menü (tab bar) ikonları/etiketleri: PASİF sekmeler eski gri-yeşil
        // rgb(120,144,130) renkte kalıyordu. Bunları temaya uygun MAT TURUNCU yap.
        // AKTİF sekme uygulamanın parlak turuncusunda (251,140,60) kalsın ki
        // hangi sekmede olduğumuz belli olsun. Her tick'te önce temizleyip yeniden
        // boyar; böylece sekme değişince aktif/pasif doğru güncellenir.
        function paintNavIcons() {
          unpaintNavIcons();
          var all = document.body.querySelectorAll('div');
          var pill = null;
          for (var i = 0; i < all.length; i++) {
            var t = (all[i].textContent || all[i].innerText || '').replace(/\s+/g, ' ').trim();
            if (t.indexOf('Sepet') > -1 && t.indexOf('Profil') > -1) {
              var r = all[i].getBoundingClientRect();
              if (r.height > 40 && r.height < 110 && r.width > 300) { pill = all[i]; break; }
            }
          }
          if (!pill) return;
          var els = pill.querySelectorAll('*');
          for (var j = 0; j < els.length; j++) {
            var e = els[j];
            if (e.children.length > 0) continue;      // sadece yaprak (glyph/etiket)
            if (!(e.textContent || '').trim()) continue;
            var m = getComputedStyle(e).color.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
            if (!m) continue;
            var R = +m[1], G = +m[2], B = +m[3];
            // AKTİF sekme = parlak turuncu -> dokunma; gerisi (siyah/gri-yeşil vs.) mat turuncu
            var isActive = (R >= 235 && G >= 110 && G <= 170 && B <= 95);

            e.setAttribute('data-afro-navicon', '1');

        // Ürün sayfasında sepete ürün eklenince alttan çıkan turuncu

        function paintCartBar() {
          var nodes = document.body.querySelectorAll('div');
          for (var i = 0; i < nodes.length; i++) {
            var el = nodes[i];
            if (el.getAttribute('data-afro-cartbar') === '1') continue;
            if (el.getAttribute('data-afro-navpill') === '1') continue; // navpill'e cartbar etiketi yapışmasın
            var t = (el.innerText || '').replace(/\s+/g, ' ').trim();
            if (t.indexOf('Siparişi Tamamla') === -1) continue;
            if (t.length > 55) continue; // sadece çubuk etiketi + tutar
            var node = el, bar = null;
            for (var k = 0; k < 6 && node; k++) {
              var cs = getComputedStyle(node);
              var r = node.getBoundingClientRect();
              if ((cs.position === 'absolute' || cs.position === 'fixed') &&
                  r.width > window.innerWidth * 0.5 && r.height < 130) {
                bar = node; break;
              }
              node = node.parentElement;
            }
            if (bar && bar.getAttribute('data-afro-navpill') !== '1') {

        var INFO_CHIP_KEYS = ['Pazar saati', 'Gel-Al saati', 'Gel-Al minimum',
          'Eve Servis Saati', 'Eve Servis minimum'];
        function paintInfoChips() {
          var divs = document.body.querySelectorAll('div');
          for (var i = 0; i < divs.length; i++) {
            var e = divs[i];
            var t = (e.innerText || '').replace(/\s+/g, ' ').trim();
            var hit = false;
            for (var q = 0; q < INFO_CHIP_KEYS.length; q++) {
              if (t.indexOf(INFO_CHIP_KEYS[q]) === 0 && t.length < 40) { hit = true; break; }
            }
            if (!hit) continue;
            // metin düğümünden yukarı çıkıp arka planı olan "pill"i bul
            var node = e, chip = null;
            for (var k = 0; k < 5 && node; k++) {
              var cs = getComputedStyle(node);
              var r = node.getBoundingClientRect();
              var m = cs.backgroundColor.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/);
              var aa = m ? (m[4] === undefined ? 1 : +m[4]) : 0;
              if (aa > 0.05 && r.height > 20 && r.height < 60 &&
                  parseFloat(cs.borderTopLeftRadius) > 8) { chip = node; break; }

        function unpaintInfoChips() {

        // "Çok al az öde" başlığına tıklanınca ürün listesini EN ÜSTE kaydır.
        // (Diğer kategori çipleri kendi bölümüne kaydırıyor; bu başlık en üste
        // dönmeyi sağlar.) Enjekte edilmiş, geri alınabilir bir davranış.
        function findMainScroll() {
          var sc = null;
          var all = document.querySelectorAll('*');
          for (var i = 0; i < all.length; i++) {
            var e = all[i]; var cs = getComputedStyle(e);
            if ((cs.overflowY === 'auto' || cs.overflowY === 'scroll') &&
                e.scrollHeight > e.clientHeight + 40) {
              if (!sc || e.clientHeight > sc.clientHeight) sc = e;
            }
          }
          return sc;
        }
        function wireScrollTop() {
          var divs = document.body.querySelectorAll('div');
          for (var i = 0; i < divs.length; i++) {
            var e = divs[i];
            if (e.getAttribute('data-afro-scrolltop') === '1') continue;
            var t = (e.innerText || '').replace(/\s+/g, ' ').trim();
            if (t !== 'Çok al az öde') continue;
            var r = e.getBoundingClientRect();
            if (r.height < 12 || r.height > 40 || r.width > 220) continue;
            e.setAttribute('data-afro-scrolltop', '1');
            e.addEventListener('click', function (ev) {
              var sc = findMainScroll();
              if (sc) { try { sc.scrollTo({ top: 0, behavior: 'smooth' }); } catch (x) { sc.scrollTop = 0; } }
            }, true);

        function unwireScrollTop() {

        // Profil/Ayarlar sayfasındaki opak kartları bul (menü satırları, bildirim,

        // Koyu temada kartlar opak rgb(8,18,12); açık temada zaten yarı-şeffaf beyaz.
        function paintGlassCards() {
          // Profil/Ayarlar sayfalarındaki kartlar
          var isProfileOrSettings = (location.pathname.indexOf('profile') > -1 ||
                                      location.pathname.indexOf('settings') > -1);
          // Teslimat adresi yönetim sayfası
          var isAddressManager = (location.pathname.indexOf('address-manager') > -1 ||
                                   location.pathname.indexOf('address') > -1);
          
          if (!isProfileOrSettings && !isAddressManager) return;
          
          var divs = document.body.querySelectorAll('div');
          for (var i = 0; i < divs.length; i++) {
            var e = divs[i];
            if (e.getAttribute('data-afro-glasscard') === '1') continue;
            var cs = getComputedStyle(e);
            var br = parseFloat(cs.borderTopLeftRadius) || 0;
            if (br < 12) continue; // yuvarlak köşeli kartlar (12px+ radius)
            var r = e.getBoundingClientRect();
            if (r.width < 280 || r.width > 660) continue; // içerik kolonu genişliği
            if (r.height < 40) continue;
            var m = cs.backgroundColor.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/);
            if (!m) continue;
            var R = +m[1], G = +m[2], B = +m[3];
            var a = m[4] === undefined ? 1 : +m[4];
            // Koyu tema kartı: neredeyse opak + koyu renk (turuncu başlık/yeşil
            // seçili satır ELENMELİ; onlar koyu değil).
            var isDarkCard = (a > 0.85 && R < 45 && G < 55 && B < 45);
            // Açık tema kartı: yarı-şeffaf VEYA tam opak beyaz (a >= 0.2).
            // Teslimat adresi kartları tam opak (a=1) olabiliyor.
            var isLightCard = (a >= 0.2 && R > 220 && G > 220 && B > 220);
            if (!isDarkCard && !isLightCard) continue;
            e.setAttribute('data-afro-glasscard', '1');
          }

        function unpaintGlassCards() {
          var c = document.querySelectorAll('[data-afro-glasscard]');

        // REQ1: Ürünler/pazar sayfasının üst BAŞLIK satırına (market adı) tam
        // genişlikte şeffaf buzlu panel işaretle.
        function paintHeaderPanel() {
          var TITLES = ['Ürünler', 'Olduğumuz Pazarlar'];
          var divs = document.body.querySelectorAll('div');
          for (var i = 0; i < divs.length; i++) {
            var e = divs[i];
            var t = (e.innerText || '').replace(/\s+/g, ' ').trim();
            if (TITLES.indexOf(t) === -1) continue;
            var n = e;
            for (var k = 0; k < 5 && n; k++) {
              var r = n.getBoundingClientRect();
              if (r.width > window.innerWidth * 0.6 && r.height >= 30 && r.height <= 92) {
                if (n.getAttribute('data-afro-headerpanel') !== '1')
                  n.setAttribute('data-afro-headerpanel', '1');

            }

        // Her sayfada header'daki geri (←) butonunu gizle, yerine "Olduğumuz Pazarlar" koy
        function hideProductsBackBtn() {
          // SVG üzerinden geri tuşunu bul (sol üst, küçük, SVG içerir)
          var vw = window.innerWidth;
          var backEl = null;
          var svgs = document.body.querySelectorAll('svg');
          for (var i = 0; i < svgs.length; i++) {
            var sr = svgs[i].getBoundingClientRect();
            if (sr.top < 0 || sr.top > window.innerHeight * 0.2) continue;
            if (sr.left > vw * 0.30) continue;
            if (sr.width > 50 || sr.height > 50) continue;
            var el = svgs[i].parentElement;
            for (var k = 0; k < 6 && el && el !== document.body; k++) {
              var er = el.getBoundingClientRect();
              if (er.width >= 20 && er.width <= 80 && er.height >= 20 && er.height <= 80) {
                backEl = el; break;
              }
              if (er.width > vw * 0.5) break;
              el = el.parentElement;
            }
            if (backEl) break;
          }
          // Geri tuşu yoksa mevcut FAB'ı da kaldır, çık
          if (!backEl) {
            var old = document.getElementById('afro-header-fab');
            if (old) old.remove();
            return;
          }
          // Geri tuşunu gizle
          if (backEl.getAttribute('data-afro-back-hide') !== '1') {
            backEl.setAttribute('data-afro-back-hide', '1');
          }
          // Konum değişmiş olabilir → her tick'te güncelle
          var br = backEl.getBoundingClientRect();
          var existFab = document.getElementById('afro-header-fab');
          if (existFab) {
            existFab.style.top  = Math.round(br.top)  + 'px';
            existFab.style.left = Math.round(br.left) + 'px';
            existFab.style.width  = Math.round(br.width  || 40) + 'px';
            existFab.style.height = Math.round(br.height || 40) + 'px';
            return;
          }
          var isDark = document.documentElement.classList.contains('afro-dark') ||

          var fabIcon = isDark ? '/fab-market-dark.png' : '/fab-market-light.png';
          var hFab = document.createElement('div');
          hFab.id = 'afro-header-fab';
          hFab.innerHTML = '<img src="' + fabIcon + '" alt="Pazarlar" style="width:100%;height:100%;object-fit:contain;border-radius:50%;display:block;">';
          hFab.title = 'Olduğumuz Pazarlar';
          hFab.style.cssText = [
            'position:fixed',
            'top:' + Math.round(br.top) + 'px',
            'left:' + Math.round(br.left) + 'px',
            'width:' + Math.round(br.width || 40) + 'px',
            'height:' + Math.round(br.height || 40) + 'px',
            'border-radius:50%',
            'background:transparent',
            'display:flex',
            'align-items:center',
            'justify-content:center',
            'cursor:pointer',
            'z-index:99999',
            'overflow:hidden',
            'box-shadow:0 2px 8px rgba(0,0,0,0.20)'
          ].join(';');
          // Tema değişince ikonu güncelle
          var _mq = window.matchMedia('(prefers-color-scheme: dark)');

          hFab.addEventListener('click', function() {
            try {

        function unpaintHeaderPanel() {

        // Kullanıcı isteği: "Ürünler" başlığına DEĞİL, BİLGİ KUTUCUKLARININ
        // olduğu satıra tam genişlikte buzlu panel. Bilgi çipi (glyph + "saati"/
        // "minimum"/"Servis"/"Teslimat") bul, yukarı çıkıp yatay kaydırma
        // (overflowX auto/scroll) satırını işaretle -> CSS onu buzlu panel yapar.
        function paintInfoRowPanel() {
          var all = document.body.querySelectorAll('div');
          var chip = null;
          for (var i = 0; i < all.length; i++) {
            var t = (all[i].innerText || '').replace(/\s+/g, ' ').trim();
            if (!t || t.length > 40) continue;
            if (t.charCodeAt(0) < 0xE000) continue; // ikon glyph ile başlamalı

                t.indexOf('Servis') === -1 && t.indexOf('Teslimat') === -1) continue;

        // REQ2: Profil sayfasındaki en üstteki DOLU (yeşil ya da turuncuya

        function paintMgrCard() {
          if (location.pathname.indexOf('profile') === -1) return;
          var divs = document.body.querySelectorAll('div');
          var best = null, bestTop = 1e9;
          for (var i = 0; i < divs.length; i++) {
            var e = divs[i];
            if (e.getAttribute('data-afro-mgrcard') === '1') return; // zaten işaretli
            var cs = getComputedStyle(e);
            var br = parseFloat(cs.borderTopLeftRadius) || 0;
            if (br < 16) continue;
            var r = e.getBoundingClientRect();
            if (r.width < 260 || r.width > 680) continue;
            if (r.height < 90 || r.height > 230) continue;
            var m = cs.backgroundColor.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/);
            if (!m) continue;
            var R = +m[1], G = +m[2], B = +m[3], a = (m[4] === undefined ? 1 : +m[4]);
            if (a < 0.7) continue;
            var isGreen = (R <= 90 && G >= 120 && B >= 60 && B <= 190 && G > R + 40);

        function unpaintMgrCard() {

        // REQ3: Sepet "Ara Toplam ... Toplam" özet kutusunu bul; CSS onu belirgin

        function paintCartSummary() {
