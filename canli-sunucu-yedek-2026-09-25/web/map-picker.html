<!DOCTYPE html>
<html>
<head>
    <title>Afro Gıda - Konum Seçici</title>
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no, width=device-width, maximum-scale=1.0">
    <meta charset="utf-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: #1a1a1a;
        }
        #map {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100%;
            height: 100%;
            background: #1a1a1a;
        }
        #confirm-btn {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #22C55E;
            color: white;
            padding: 14px 32px;
            border-radius: 30px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.4);
            cursor: pointer;
            display: none;
            z-index: 1000;
            border: none;
            -webkit-tap-highlight-color: transparent;
            white-space: nowrap;
        }
        #confirm-btn:active { transform: translateX(-50%) scale(0.96); }
        #loading-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 16px;
        }
        #top-banner {
            position: fixed;
            top: 8px; left: 8px; right: 8px;
            background: rgba(26,26,26,0.88);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            padding: 10px 14px;
            border-radius: 12px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            z-index: 1000;
            color: #FFA726;
            border: 1px solid rgba(255,167,38,0.3);
        }
        #error-msg {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(26,26,26,0.95);
            color: #ccc;
            padding: 24px;
            border-radius: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
            text-align: center;
            display: none;
            z-index: 3000;
            max-width: 300px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        #error-msg button {
            margin-top: 14px;
            padding: 10px 24px;
            background: #22C55E;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        /* Google Maps dark mode override for controls */
        .gm-style .gm-style-mtc, .gm-style .gm-svpc { display: none !important; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="top-banner">
        📍 Lütfen apartman/ev girişini tam üzerine gelecek şekilde seçiniz.
    </div>
    <button id="confirm-btn">Bu Konumu Onayla</button>
    <div id="loading-overlay">📍 Adres çözülüyor...</div>
    <div id="error-msg">
        <div>⚠️ Harita yüklenemedi.</div>
        <div style="margin-top:8px; font-size:12px; color:#999;">İnternet bağlantınızı kontrol edin.</div>
        <button onclick="location.reload()">Tekrar Dene</button>
    </div>

    <script>
        var map, marker, geocoder;
        var center = { lat: 40.2215, lng: 28.8617 };
        var mapLoadTimeout;

        function initMap() {
            clearTimeout(mapLoadTimeout);
            try {
                geocoder = new google.maps.Geocoder();
                map = new google.maps.Map(document.getElementById('map'), {
                    center: center,
                    zoom: 16,
                    mapTypeControl: false,
                    streetViewControl: false,
                    fullscreenControl: false,
                    zoomControl: true,
                    gestureHandling: 'greedy',
                    styles: [
                        { elementType: 'geometry', stylers: [{ color: '#212121' }] },
                        { elementType: 'labels.text.fill', stylers: [{ color: '#bdbdbd' }] },
                        { elementType: 'labels.text.stroke', stylers: [{ color: '#212121' }] },
                        { featureType: 'road', elementType: 'geometry', stylers: [{ color: '#373737' }] },
                        { featureType: 'road', elementType: 'labels.text.fill', stylers: [{ color: '#9e9e9e' }] },
                        { featureType: 'water', elementType: 'geometry', stylers: [{ color: '#1a3646' }] },
                        { featureType: 'poi', elementType: 'labels.text.fill', stylers: [{ color: '#8a8a8a' }] },
                        { featureType: 'poi.park', elementType: 'geometry', stylers: [{ color: '#1b3a1b' }] },
                        { featureType: 'transit', elementType: 'geometry', stylers: [{ color: '#2f3948' }] }
                    ]
                });

                marker = new google.maps.Marker({
                    map: map,
                    draggable: true,
                    animation: google.maps.Animation.DROP
                });

                map.addListener('click', function(e) {
                    placeMarker(e.latLng);
                });

                marker.addListener('dragend', function() {
                    document.getElementById('confirm-btn').style.display = 'block';
                });

                // Kullanıcı konumunu al
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        function(position) {
                            var pos = {
                                lat: position.coords.latitude,
                                lng: position.coords.longitude
                            };
                            map.setCenter(pos);
                            placeMarker(pos);
                        },
                        function() {
                            // Konum alınamazsa varsayılan merkezi kullan
                            placeMarker(center);
                        },
                        { timeout: 8000, enableHighAccuracy: true }
                    );
                } else {
                    placeMarker(center);
                }

                document.getElementById('confirm-btn').onclick = function() {
                    var pos = marker.getPosition();
                    document.getElementById('loading-overlay').style.display = 'flex';

                    geocoder.geocode({ location: pos, language: 'tr' }, function(results, status) {
                        document.getElementById('loading-overlay').style.display = 'none';
                        if (status === 'OK' && results && results[0]) {
                            var msgData = {
                                type: 'LOCATION_SELECTED',
                                lat: pos.lat(),
                                lng: pos.lng(),
                                addressComponents: results[0].address_components
                            };
                            if (window.ReactNativeWebView) {
                                window.ReactNativeWebView.postMessage(JSON.stringify(msgData));
                            } else {
                                window.parent.postMessage(msgData, '*');
                            }
                        } else {
                            // Geocode başarısız olsa bile koordinatları gönder
                            var msgData = {
                                type: 'LOCATION_SELECTED',
                                lat: pos.lat(),
                                lng: pos.lng(),
                                addressComponents: []
                            };
                            if (window.ReactNativeWebView) {
                                window.ReactNativeWebView.postMessage(JSON.stringify(msgData));
                            } else {
                                window.parent.postMessage(msgData, '*');
                            }
                        }
                    });
                };

                // Harita boyutunu zorla yenile (iframe resize fix)
                setTimeout(function() {
                    google.maps.event.trigger(map, 'resize');
                    map.setCenter(map.getCenter());
                }, 300);
                setTimeout(function() {
                    google.maps.event.trigger(map, 'resize');
                }, 1000);

            } catch (e) {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        function placeMarker(latLng) {
            if (typeof latLng.lat === 'number') {
                latLng = new google.maps.LatLng(latLng.lat, latLng.lng);
            }
            marker.setPosition(latLng);
            document.getElementById('confirm-btn').style.display = 'block';
        }

        // Google Maps yüklenemezse hata göster
        mapLoadTimeout = setTimeout(function() {
            if (typeof google === 'undefined' || typeof google.maps === 'undefined') {
                document.getElementById('error-msg').style.display = 'block';
            }
        }, 12000);

        window.gm_authFailure = function() {
            document.getElementById('error-msg').style.display = 'block';
        };

        var script = document.createElement('script');
        script.src = 'https://maps.googleapis.com/maps/api/js?key=AIzaSyDJIQCluFiJt0GrkAB3t_l88-vux-i4lsA&callback=initMap&libraries=places';
        script.async = true;
        script.onerror = function() {
            document.getElementById('error-msg').style.display = 'block';
        };
        document.head.appendChild(script);
    </script>
</body>
</html>
