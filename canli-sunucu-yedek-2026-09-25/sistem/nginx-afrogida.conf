# Backend upstream with keepalive connection pooling
upstream backend {
    server 127.0.0.1:8000;
    keepalive 32;
    keepalive_requests 100;
    keepalive_timeout 60s;
}

server {
    server_name www.afrogida.com.tr;
    
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/afrogida.com.tr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/afrogida.com.tr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    return 301 https://afrogida.com.tr$request_uri;
}

server {
    server_name afrogida.com.tr;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    
    location ~ /\.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;
    }

    # Statik varliklar (JS/CSS/font). Bundle tarayicida saklanir ama her
    # aciliste ETag ile hizlica dogrulanir: dosya degismediyse sunucu
    # 304 (bos, ~birkac yuz byte) doner -> 3 MB tekrar INMEZ, cache'ten
    # aninda yuklenir. Biz ayni dosya adiyla guncelleme yaptigimizda ise
    # ETag degisir -> tarayici yeni surumu ceker, kimse eski surumde
    # takili kalmaz. gzip ile bundle ~790 KB'ye dusuyor.
    location /_expo/static/ {
        root /var/www/afro-proje;
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Content-hash isimli vendor fontlari ASLA degismez -> 1 yil immutable cache.
    # Boylece her sayfa aciliste ~200KB font tekrar INMEZ (onceden no-store idi).
    location ~* \.(woff2?|ttf|otf|eot)$ {
        root /var/www/afro-proje;
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }


    # Service Worker — cache engeli ve kapsam izni
    location = /sw.js {
        root /var/www/afro-proje;
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # manifest.json
    location = /manifest.json {
        root /var/www/afro-proje;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header Content-Type "application/manifest+json";
    }

    location / {
        root /var/www/afro-proje;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
    
    location = /api/payments/paytr/callback {
        allow all;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Proxy buffers for performance
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    location /api/ {
        proxy_pass http://backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        
        # Proxy buffers for performance
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 20s;
        proxy_read_timeout 30s;
    }
    
    location /uploads/ {
        proxy_pass http://backend/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=2592000, immutable";
        
        # Proxy buffers for larger images
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 8k;
    }

    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/afrogida.com.tr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/afrogida.com.tr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80 default_server;
    server_name afrogida.com.tr www.afrogida.com.tr;
    
    location ~ /\.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;
    }

    # Redirect all HTTP traffic to HTTPS (non-www)
    return 301 https://afrogida.com.tr$request_uri;
}
