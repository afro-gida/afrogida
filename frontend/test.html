
<!DOCTYPE html>
<html>
<head>
    <title>Afro Gıda - Konum Seçici</title>
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no">
    <meta charset="utf-8">
    <style>
        html, body, #map {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #f0f0f0;
        }
        #confirm-btn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #22C55E;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-family: sans-serif;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            display: none;
            z-index: 1000;
        }
        #loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            display: none;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="confirm-btn">Bu Konumu Onayla</div>
    <div id="loading-overlay">📍 Adres çözülüyor...</div>
    <div style="position: absolute; top: 10px; left: 10px; right: 10px; background: rgba(255,255,255,0.9); padding: 10px; border-radius: 8px; font-family: sans-serif; font-size: 13px; font-weight: bold; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 1000; color: #D97706;">
        Lütfen apartman/ev girişini tam üzerine gelecek şekilde seçiniz.
    </div>

    <script>
        let map;
        let marker;
        let geocoder;
        const apiKey = "AIzaSyDJIQCluFiJt0GrkAB3t_l88-vux-i4lsA";
        const center = { lat: 40.2215, lng: 28.8617 }; // Görükle/Bursa

        function initMap() {
            geocoder = new google.maps.Geocoder();
            map = new google.maps.Map(document.getElementById('map'), {
                center: center,
                zoom: 16,
                mapTypeControl: false,
                streetViewControl: false,
                fullscreenControl: false,
                gestureHandling: 'greedy'
            });

            marker = new google.maps.Marker({
                map: map,
                draggable: true,
                animation: google.maps.Animation.DROP
            });

            map.addListener('click', (e) => {
                placeMarker(e.latLng);
            });

            marker.addListener('dragend', () => {
                document.getElementById('confirm-btn').style.display = 'block';
            });

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    const pos = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };
                    map.setCenter(pos);
                    placeMarker(pos);
                });
            }

            document.getElementById('confirm-btn').onclick = function() {
                const pos = marker.getPosition();
                document.getElementById('loading-overlay').style.display = 'flex';
                
                geocoder.geocode({ location: pos, language: 'tr' }, (results, status) => {
                    document.getElementById('loading-overlay').style.display = 'none';
                    if (status === 'OK') {
                        if (results[0]) {
                            const msgData = {
                                type: 'LOCATION_SELECTED',
                                lat: pos.lat(),
                                lng: pos.lng(),
                                addressComponents: results[0].address_components
                            };
                            if (window.ReactNativeWebView) {
                                window.ReactNativeWebView.postMessage(JSON.stringify(msgData));
                            } else {
                                window.parent.postMessage(msgData, '*');
                            }
                        } else {
                            alert('Adres bulunamadı.');
                        }
                    } else {
                        alert('Hata: ' + status);
                    }
                });
            };
        }

        function placeMarker(latLng) {
            marker.setPosition(latLng);
            document.getElementById('confirm-btn').style.display = 'block';
        }

        const script = document.createElement('script');
        script.src = "https://maps.googleapis.com/maps/api/js?key=" + apiKey + "&callback=initMap&libraries=places";
        script.async = true;
        document.head.appendChild(script);
    </script>
</body>
</html>
