# certbot ÖNCESİ geçici config. certbot çalıştıktan sonra
# nginx-staging.conf (TLS'li tam sürüm) ile değiştirilir.
server {
    server_name staging.afrogida.com.tr;
    listen 80;

    location ~ /\.well-known/acme-challenge/ {
        auth_basic off;
        allow all;
        root /var/www/html;
    }

    auth_basic "Afro Gida - Staging";
    auth_basic_user_file /etc/nginx/afrogida-staging.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;

    root /opt/afrogida-staging/frontend;
    index index.html;

    location = /robots.txt {
        auth_basic off;
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8001/uploads/;
        proxy_set_header Host $host;
    }

    location = /api/payments/paytr/callback {
        auth_basic off;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
    }
}
