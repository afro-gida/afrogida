# staging.afrogida.com.tr
#  - Çerez tabanlı geçit: TEK basic-auth istemi (/_stg_login), sonra çerez.
#    Servis worker / fetch / asset artık tekrar tekrar İSTEMEZ (çerez otomatik gider).
#  - sub_filter: bundle'daki sabit "https://afrogida.com.tr" -> "" (relative) ->
#    staging frontend'i STAGING backend'ine (:8001) konuşur, prod'a değil.
#  - noindex.
# certbot TLS satırlarını yönetir.

map $cookie_afrostg $stg_ok {
    default 0;
    "K7p2mZ9xQ4wR1nT8afroSTG" 1;
}

server {
    server_name staging.afrogida.com.tr;
    listen 80;
    location ~ /\.well-known/acme-challenge/ { allow all; root /var/www/html; }
    location / { return 301 https://staging.afrogida.com.tr$request_uri; }
}

server {
    server_name staging.afrogida.com.tr;
    listen 443 ssl http2;

    ssl_certificate     /etc/letsencrypt/live/staging.afrogida.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.afrogida.com.tr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    server_tokens off;

    root /opt/afrogida-staging/frontend;
    index index.html;

    # login: TEK basic-auth istemi, çerezi kurar, ana sayfaya döner
    location = /_stg_login {
        auth_basic "Afro Gida - Staging";
        auth_basic_user_file /etc/nginx/afrogida-staging.htpasswd;
        add_header Set-Cookie "afrostg=K7p2mZ9xQ4wR1nT8afroSTG; Path=/; Max-Age=7776000; Secure; HttpOnly; SameSite=Lax" always;
        return 302 /;
    }

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # statik + bundle — API adresini relative yap
    location / {
        if ($stg_ok = 0) { return 302 /_stg_login; }
        sub_filter 'https://afrogida.com.tr' '';
        sub_filter 'https://www.afrogida.com.tr' '';
        sub_filter_once off;
        sub_filter_types application/javascript application/json application/manifest+json;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    location /_expo/ {
        if ($stg_ok = 0) { return 302 /_stg_login; }
        sub_filter 'https://afrogida.com.tr' '';
        sub_filter_once off;
        sub_filter_types application/javascript;
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }

    # asset'ler (font/resim) eksikse index.html DEĞİL, 404 dönmeli
    location /assets/ {
        if ($stg_ok = 0) { return 302 /_stg_login; }
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # API -> staging backend :8001 (çerez yoksa 401; JS fetch handle eder)
    location /api/ {
        if ($stg_ok = 0) { return 401; }
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /uploads/ {
        if ($stg_ok = 0) { return 401; }
        proxy_pass http://127.0.0.1:8001/uploads/;
        proxy_set_header Host $host;
    }

    # PayTR callback (dışarıdan gelir — geçitten muaf, test modda)
    location = /api/payments/paytr/callback {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}
