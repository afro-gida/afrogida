# staging.afrogida.com.tr — HTTP basic-auth korumalı, arama motorlarına kapalı.
# /etc/nginx/sites-available/afrogida-staging + sites-enabled symlink.
# TLS satırları ilk certbot çalıştırmasından sonra eklenir.

server {
    server_name staging.afrogida.com.tr;
    listen 80;

    # Let's Encrypt doğrulaması (certbot öncesi)
    location ~ /\.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;
    }

    location / {
        return 301 https://staging.afrogida.com.tr$request_uri;
    }
}

server {
    server_name staging.afrogida.com.tr;
    listen 443 ssl http2;

    # certbot bu iki satırı yönetir:
    ssl_certificate     /etc/letsencrypt/live/staging.afrogida.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.afrogida.com.tr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Tüm site basic-auth arkasında
    auth_basic "Afro Gida - Staging";
    auth_basic_user_file /etc/nginx/afrogida-staging.htpasswd;

    # Arama motorlarına asla girmesin
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    server_tokens off;

    root /opt/afrogida-staging/frontend;
    index index.html;

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location /_expo/static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location ~* \.(woff2?|ttf|otf|eot)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-store";
        add_header Service-Worker-Allowed "/";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8001/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # PayTR callback'i staging'de test modda; basic-auth'tan muaf tut ki
    # PayTR sunucusu ulaşabilsin (gerçek para akmaz, PAYTR_TEST_MODE=1).
    location = /api/payments/paytr/callback {
        auth_basic off;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}
