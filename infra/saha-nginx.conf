# saha.afrogida.com.tr — Tedarikçi + Kurye uygulaması (Expo web, statik).
# /api aynı backend'e gider (aynı köken -> CORS gerekmez). Arama motorlarına
# kapalı, çerçeve içine alınamaz, katı içerik güvenlik politikası (CSP).
# SSL satırlarını certbot ekler (infra/saha-kur.sh).

server {
    listen 80;
    server_name saha.afrogida.com.tr;

    location ~ /\.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;
    }
    location / {
        return 301 https://saha.afrogida.com.tr$request_uri;
    }
}

server {
    server_name saha.afrogida.com.tr;
    root /var/www/afro-saha;
    server_tokens off;

    # Güvenlik başlıkları (location içinde add_header kullanılırsa tekrar edilmeli)
    set $csp "default-src 'self'; script-src 'self' 'sha256-67fhrP0+BkBqmgGGXTtgiVO/9EQs3QruYNU/7fnRkI8='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://afrogida.com.tr; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'";
    add_header Content-Security-Policy $csp always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=()" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-store" always;

    location ~ /\.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;
    }

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # İçerik özetli (hash) dosyalar: uzun önbellek
    location ~ ^/(_expo/static|assets)/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host afrogida.com.tr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 20s;
        proxy_read_timeout 30s;
    }

    location /uploads/ {
        proxy_pass http://backend/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host afrogida.com.tr;
    }

    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/saha.afrogida.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saha.afrogida.com.tr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
